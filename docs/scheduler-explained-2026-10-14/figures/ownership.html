<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Who owns what</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #FFFFFF; --color-ink: #1F2A33; --color-muted: #444444; --color-accent: #287A4C;
      --font-sans: 'Calibri', 'Carlito', system-ui, sans-serif; --font-serif: 'Calibri', 'Carlito', serif; --font-mono: 'Consolas', 'Liberation Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1020px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 980px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">WaterFlex scheduler explained</p>
    <h1>Who owns what</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 980 536" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ownership-title ownership-desc">
        <title id="ownership-title">Who owns what</title>
        <desc id="ownership-desc">Two zones: WaterFlex Software owns master data, the business record, lastModified and each client&#x27;s policy; the scheduler owns holds, offers, proposals, receipts and the road graph with its cache. A snapshot goes in, results come out, and the host writes its own record.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#444444"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#287A4C"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0B3A66"/></marker>
<marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#444444" stroke-width="1.2"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="6" stroke="#444444" stroke-width="1.2"/></pattern>
        </defs>
        <rect width="100%" height="100%" fill="#FFFFFF"/>
        <rect x="40" y="40" width="360" height="412" rx="8" fill="rgba(31,42,51,0.02)" stroke="rgba(31,42,51,0.35)" stroke-width="1" stroke-dasharray="6,4"/>
        <rect x="52" y="44" width="146.051" height="14" rx="2" fill="#FFFFFF"/>
        <text x="60" y="55" fill="#5A6B7A" font-size="8" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">WATERFLEX SOFTWARE OWNS</text>
        <rect x="580" y="40" width="360" height="412" rx="8" fill="rgba(31,42,51,0.02)" stroke="rgba(31,42,51,0.35)" stroke-width="1" stroke-dasharray="6,4"/>
        <rect x="592" y="44" width="117.779" height="14" rx="2" fill="#FFFFFF"/>
        <text x="600" y="55" fill="#5A6B7A" font-size="8" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">THE SCHEDULER OWNS</text>
        <rect x="56" y="76" width="328" height="76" rx="6" fill="#FFFFFF"/>
        <rect x="56" y="76" width="328" height="76" rx="6" fill="#DCE6EF" stroke="#5A6B7A" stroke-width="1"/>
        <text x="72" y="100" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">Customers, addresses, jobs, appointments,</text>
        <text x="72" y="118" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">technicians, qualifications, shifts,</text>
        <text x="72" y="136" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">absences, depots</text>
        <rect x="56" y="164" width="328" height="58" rx="6" fill="#FFFFFF"/>
        <rect x="56" y="164" width="328" height="58" rx="6" fill="#DCE6EF" stroke="#5A6B7A" stroke-width="1"/>
        <text x="72" y="188" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">The business record: every appointment&#x27;s</text>
        <text x="72" y="206" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">technician, sequence and planned times</text>
        <rect x="56" y="234" width="328" height="58" rx="6" fill="#FFFFFF"/>
        <rect x="56" y="234" width="328" height="58" rx="6" fill="#DCE6EF" stroke="#5A6B7A" stroke-width="1"/>
        <text x="72" y="258" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">The lastModified timestamp of every</text>
        <text x="72" y="276" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">technician-day</text>
        <rect x="56" y="304" width="328" height="58" rx="6" fill="#FFFFFF"/>
        <rect x="56" y="304" width="328" height="58" rx="6" fill="#DCE6EF" stroke="#5A6B7A" stroke-width="1"/>
        <text x="72" y="328" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">Each client&#x27;s policy choices and rates,</text>
        <text x="72" y="346" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">sent with every call</text>
        <rect x="56" y="374" width="328" height="58" rx="6" fill="#FFFFFF"/>
        <rect x="56" y="374" width="328" height="58" rx="6" fill="#DCE6EF" stroke="#5A6B7A" stroke-width="1"/>
        <text x="72" y="398" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">Overnight schedules, time off,</text>
        <text x="72" y="416" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">cancellations, depot changes</text>
        <rect x="596" y="76" width="328" height="58" rx="6" fill="#FFFFFF"/>
        <rect x="596" y="76" width="328" height="58" rx="6" fill="rgba(40,122,76,0.08)" stroke="#287A4C" stroke-width="1.4"/>
        <text x="612" y="100" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">Booking holds and each metro-day&#x27;s common</text>
        <text x="612" y="118" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">arrangement</text>
        <rect x="596" y="146" width="328" height="58" rx="6" fill="#FFFFFF"/>
        <rect x="596" y="146" width="328" height="58" rx="6" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>
        <text x="612" y="170" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">Offer sets, proposals and receipts it</text>
        <text x="612" y="188" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">issued, keyed by your IDs</text>
        <rect x="596" y="216" width="328" height="58" rx="6" fill="#FFFFFF"/>
        <rect x="596" y="216" width="328" height="58" rx="6" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>
        <text x="612" y="240" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">The road graph per metro, its route cache,</text>
        <text x="612" y="258" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">and address location (Nominatim)</text>
        <rect x="596" y="286" width="328" height="58" rx="6" fill="#FFFFFF"/>
        <rect x="596" y="286" width="328" height="58" rx="6" fill="#F4F6F8" stroke="#5A6B7A" stroke-width="1"/>
        <text x="612" y="310" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">Nothing else: it reads no master data and</text>
        <text x="612" y="328" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">holds no policy settings</text>
        <line x1="400" y1="136" x2="580" y2="136" stroke="#0B3A66" stroke-width="1.4" marker-end="url(#arrow-link)"/>
        <rect x="458.72" y="114" width="62.56" height="16" rx="2" fill="#FFFFFF"/>
        <text x="490" y="126" fill="#0B3A66" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SNAPSHOT</text>
        <text x="490" y="158" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">facts and</text>
        <text x="490" y="172" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">lastModified</text>
        <line x1="580" y1="236" x2="400" y2="236" stroke="#444444" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="462.13" y="214" width="55.74" height="16" rx="2" fill="#FFFFFF"/>
        <text x="490" y="226" fill="#5A6B7A" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RESULTS</text>
        <text x="490" y="258" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">offers, routes,</text>
        <text x="490" y="272" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">receipts</text>
        <text x="412" y="340" fill="#1F2A33" font-size="14" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-style="italic">The host writes</text>
        <text x="412" y="358" fill="#1F2A33" font-size="14" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-style="italic">its own record</text>
        <text x="412" y="376" fill="#1F2A33" font-size="14" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-style="italic">with a compare-</text>
        <text x="412" y="394" fill="#1F2A33" font-size="14" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-style="italic">and-set; the</text>
        <text x="412" y="412" fill="#1F2A33" font-size="14" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-style="italic">scheduler never</text>
        <text x="412" y="430" fill="#1F2A33" font-size="14" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-style="italic">touches it.</text>
        <line x1="40" y1="484" x2="940" y2="484" stroke="rgba(31,42,51,0.1)" stroke-width="0.8"/>
        <text x="40" y="510" fill="#444444" font-size="8" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">LEGEND</text>
        <rect x="110" y="500" width="18" height="12" rx="2" fill="#DCE6EF" stroke="#5A6B7A" stroke-width="0.8"/>
        <text x="136" y="510" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">HOST DATA</text>
        <rect x="228" y="500" width="18" height="12" rx="2" fill="rgba(40,122,76,0.08)" stroke="#5A6B7A" stroke-width="0.8"/>
        <text x="254" y="510" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">WHAT KEEPS PROMISES SAFE</text>
        <rect x="448" y="500" width="18" height="12" rx="2" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="0.8"/>
        <text x="474" y="510" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">SCHEDULER DATA</text>
        <text x="940" y="510" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end">source: the integration guide</text>
      </svg>
    </div>
  </div>
</body>
</html>
