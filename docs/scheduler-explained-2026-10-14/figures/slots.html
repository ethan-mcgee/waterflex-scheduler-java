<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admission on a booking replica, before and after J2</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #FFFFFF; --color-ink: #1F2A33; --color-muted: #444444; --color-accent: #287A4C;
      --font-sans: 'Calibri', 'Carlito', system-ui, sans-serif; --font-serif: 'Calibri', 'Carlito', serif; --font-mono: 'Consolas', 'Liberation Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1320px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1280px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">WaterFlex scheduler explained</p>
    <h1>Admission on a booking replica, before and after J2</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1280 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="slots-title slots-desc">
        <title id="slots-title">Admission on a booking replica, before and after J2</title>
        <desc id="slots-desc">Two panels: before J2 a confirm queued behind waiting searches for one of two search slots; after J2 admission chooses a confirm before any waiting search and a confirm-only slot beyond the search capacity means it never waits for a running search.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#444444"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#287A4C"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0B3A66"/></marker>
<marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#444444" stroke-width="1.2"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="6" stroke="#444444" stroke-width="1.2"/></pattern>
        </defs>
        <rect width="100%" height="100%" fill="#FFFFFF"/>
        <text x="40" y="48" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-weight="700">Before J2</text>
        <rect x="40" y="68" width="580" height="340" rx="8" fill="rgba(31,42,51,0.02)" stroke="rgba(31,42,51,0.35)" stroke-width="1" stroke-dasharray="6,4"/>
        <rect x="52" y="72" width="100.816" height="14" rx="2" fill="#FFFFFF"/>
        <text x="60" y="83" fill="#5A6B7A" font-size="8" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">BOOKING REPLICA</text>
        <text x="64" y="104" fill="#5A6B7A" font-size="8" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">WAITING</text>
        <rect x="64" y="116" width="150" height="40" rx="6" fill="#FFFFFF"/>
        <rect x="64" y="116" width="150" height="40" rx="6" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>
        <text x="139" y="141" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">SEARCH</text>
        <rect x="64" y="168" width="150" height="40" rx="6" fill="#FFFFFF"/>
        <rect x="64" y="168" width="150" height="40" rx="6" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>
        <text x="139" y="193" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">SEARCH</text>
        <rect x="64" y="220" width="150" height="40" rx="6" fill="#FFFFFF"/>
        <rect x="64" y="220" width="150" height="40" rx="6" fill="#F4F6F8" stroke="#5A6B7A" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="139" y="245" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">CONFIRM</text>
        <text x="340" y="104" fill="#5A6B7A" font-size="8" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">RUNNING</text>
        <rect x="340" y="116" width="250" height="56" rx="6" fill="#FFFFFF"/>
        <rect x="340" y="116" width="250" height="56" rx="6" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>
        <text x="465" y="140" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">SEARCH SLOT 1</text>
        <text x="465" y="158" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">a search, up to 5 s</text>
        <rect x="340" y="186" width="250" height="56" rx="6" fill="#FFFFFF"/>
        <rect x="340" y="186" width="250" height="56" rx="6" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>
        <text x="465" y="210" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">SEARCH SLOT 2</text>
        <text x="465" y="228" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">a search, up to 5 s</text>
        <line x1="214" y1="136" x2="340" y2="136" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="64" y="372" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">A confirm waits for a slot like a search,</text>
        <text x="64" y="390" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">behind every search already waiting.</text>
        <text x="660" y="48" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-weight="700">After J2 (#162)</text>
        <rect x="660" y="68" width="580" height="340" rx="8" fill="rgba(31,42,51,0.02)" stroke="rgba(31,42,51,0.35)" stroke-width="1" stroke-dasharray="6,4"/>
        <rect x="672" y="72" width="100.816" height="14" rx="2" fill="#FFFFFF"/>
        <text x="680" y="83" fill="#5A6B7A" font-size="8" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">BOOKING REPLICA</text>
        <text x="684" y="104" fill="#5A6B7A" font-size="8" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">WAITING</text>
        <rect x="684" y="116" width="150" height="40" rx="6" fill="#FFFFFF"/>
        <rect x="684" y="116" width="150" height="40" rx="6" fill="rgba(40,122,76,0.1)" stroke="#287A4C" stroke-width="1.4"/>
        <text x="759" y="141" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">CONFIRM</text>
        <rect x="684" y="168" width="150" height="40" rx="6" fill="#FFFFFF"/>
        <rect x="684" y="168" width="150" height="40" rx="6" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>
        <text x="759" y="193" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">SEARCH</text>
        <rect x="684" y="220" width="150" height="40" rx="6" fill="#FFFFFF"/>
        <rect x="684" y="220" width="150" height="40" rx="6" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>
        <text x="759" y="245" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">SEARCH</text>
        <text x="960" y="104" fill="#5A6B7A" font-size="8" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">RUNNING</text>
        <rect x="960" y="116" width="250" height="56" rx="6" fill="#FFFFFF"/>
        <rect x="960" y="116" width="250" height="56" rx="6" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>
        <text x="1085" y="140" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">SEARCH SLOT 1</text>
        <text x="1085" y="158" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">a search, up to 5 s</text>
        <rect x="960" y="186" width="250" height="56" rx="6" fill="#FFFFFF"/>
        <rect x="960" y="186" width="250" height="56" rx="6" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>
        <text x="1085" y="210" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">SEARCH SLOT 2</text>
        <text x="1085" y="228" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">a search, up to 5 s</text>
        <line x1="834" y1="136" x2="960" y2="136" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="960" y="276" width="250" height="56" rx="6" fill="#FFFFFF"/>
        <rect x="960" y="276" width="250" height="56" rx="6" fill="rgba(40,122,76,0.1)" stroke="#287A4C" stroke-width="1.4"/>
        <text x="1085" y="300" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">CONFIRM-ONLY SLOT</text>
        <text x="1085" y="318" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">a few ms of work</text>
        <path d="M834,148 L889,148 Q897,148 897,156 L897,296 Q897,304 905,304 L960,304" fill="none" stroke="#287A4C" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="875.95" y="228" width="42.1" height="16" rx="2" fill="#FFFFFF"/>
        <text x="897" y="240" fill="#287A4C" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">FIRST</text>
        <text x="684" y="372" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">A confirm is chosen before any waiting search</text>
        <text x="684" y="390" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">and has a slot no search may take.</text>
        <text x="40" y="446" fill="#1F2A33" font-size="14" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-style="italic">The confirm completes a booking the customer already chose: its wait was pure waste.</text>
        <line x1="30" y1="470" x2="1250" y2="470" stroke="rgba(31,42,51,0.1)" stroke-width="0.8"/>
        <text x="30" y="496" fill="#444444" font-size="8" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">LEGEND</text>
        <rect x="100" y="486" width="18" height="12" rx="2" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="0.8"/>
        <text x="126" y="496" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">SEARCH WORK</text>
        <rect x="232" y="486" width="18" height="12" rx="2" fill="rgba(40,122,76,0.1)" stroke="#5A6B7A" stroke-width="0.8"/>
        <text x="258" y="496" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">THE CONFIRM, AFTER J2</text>
        <rect x="432" y="486" width="18" height="12" rx="2" fill="#F4F6F8" stroke="#5A6B7A" stroke-width="0.8" stroke-dasharray="3,2"/>
        <text x="458" y="496" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">THE CONFIRM, BEFORE</text>
        <text x="1250" y="496" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end">search capacity is 2 slots in every run here</text>
      </svg>
    </div>
  </div>
</body>
</html>
