<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The API surface: twelve operations in six families</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #FFFFFF; --color-ink: #1F2A33; --color-muted: #444444; --color-accent: #287A4C;
      --font-sans: 'Calibri', 'Carlito', system-ui, sans-serif; --font-serif: 'Calibri', 'Carlito', serif; --font-mono: 'Consolas', 'Liberation Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1320px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1280px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">WaterFlex scheduler explained</p>
    <h1>The API surface: twelve operations in six families</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1280 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="surface-title surface-desc">
        <title id="surface-title">The API surface: twelve operations in six families</title>
        <desc id="surface-desc">Map of the twelve /api/v1 operations grouped into booking, daily, repair, routes, requests and identity, with the order in which a host calls the booking and daily ones.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#444444"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#287A4C"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0B3A66"/></marker>
<marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#444444" stroke-width="1.2"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="6" stroke="#444444" stroke-width="1.2"/></pattern>
        </defs>
        <rect width="100%" height="100%" fill="#FFFFFF"/>
        <text x="176" y="97" fill="#1F2A33" font-size="11" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="end" font-weight="700">BOOKING</text>
        <rect x="200" y="56" width="300" height="72" rx="6" fill="#FFFFFF"/>
        <rect x="200" y="56" width="300" height="72" rx="6" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>
        <text x="216" y="82" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-weight="700">createBookingOffers</text>
        <text x="216" y="102" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">POST /booking/offers</text>
        <text x="216" y="118" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">search, hold windows</text>
        <rect x="576" y="56" width="300" height="72" rx="6" fill="#FFFFFF"/>
        <rect x="576" y="56" width="300" height="72" rx="6" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>
        <text x="592" y="82" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-weight="700">selectBookingOffer</text>
        <text x="592" y="102" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">POST /offers/{id}/select</text>
        <text x="592" y="118" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">customer picks one</text>
        <line x1="500" y1="92" x2="576" y2="92" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="952" y="56" width="300" height="72" rx="6" fill="#FFFFFF"/>
        <rect x="952" y="56" width="300" height="72" rx="6" fill="rgba(40,122,76,0.08)" stroke="#287A4C" stroke-width="1.4"/>
        <text x="968" y="82" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-weight="700">confirmBookingHold</text>
        <text x="968" y="102" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">POST /holds/{id}/confirm</text>
        <text x="968" y="118" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">fresh snapshot, receipt</text>
        <line x1="876" y1="92" x2="952" y2="92" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="576" y="152" width="300" height="72" rx="6" fill="#FFFFFF"/>
        <rect x="576" y="152" width="300" height="72" rx="6" fill="#F4F6F8" stroke="#5A6B7A" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="592" y="178" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-weight="700">releaseBookingOffer</text>
        <text x="592" y="198" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">POST /offers/{id}/release</text>
        <text x="592" y="214" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">give the set back</text>
        <path d="M350,128 L350,180 Q350,188 358,188 L576,188" fill="none" stroke="#444444" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="176" y="289" fill="#1F2A33" font-size="11" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="end" font-weight="700">DAILY</text>
        <rect x="200" y="248" width="300" height="72" rx="6" fill="#FFFFFF"/>
        <rect x="200" y="248" width="300" height="72" rx="6" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>
        <text x="216" y="274" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-weight="700">createDailyProposal</text>
        <text x="216" y="294" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">POST /daily/proposals</text>
        <text x="216" y="310" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">optimize one metro day</text>
        <rect x="576" y="248" width="300" height="72" rx="6" fill="#FFFFFF"/>
        <rect x="576" y="248" width="300" height="72" rx="6" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>
        <text x="592" y="274" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-weight="700">commitDailyProposal</text>
        <text x="592" y="294" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">POST /proposals/{id}/commit</text>
        <text x="592" y="310" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">current lastModified, receipt</text>
        <line x1="500" y1="284" x2="576" y2="284" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="176" y="389" fill="#1F2A33" font-size="11" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="end" font-weight="700">REPAIR</text>
        <rect x="200" y="348" width="300" height="72" rx="6" fill="#FFFFFF"/>
        <rect x="200" y="348" width="300" height="72" rx="6" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>
        <text x="216" y="374" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-weight="700">createRepairProposal</text>
        <text x="216" y="394" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">POST /repairs/proposals</text>
        <text x="216" y="410" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">one disrupted day</text>
        <text x="176" y="489" fill="#1F2A33" font-size="11" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="end" font-weight="700">ROUTES</text>
        <rect x="200" y="448" width="300" height="72" rx="6" fill="#FFFFFF"/>
        <rect x="200" y="448" width="300" height="72" rx="6" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>
        <text x="216" y="474" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-weight="700">evaluateRoutes</text>
        <text x="216" y="494" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">POST /routes/evaluate</text>
        <text x="216" y="510" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">time a day as it is</text>
        <rect x="576" y="448" width="300" height="72" rx="6" fill="#FFFFFF"/>
        <rect x="576" y="448" width="300" height="72" rx="6" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>
        <text x="592" y="474" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-weight="700">drawRoutes</text>
        <text x="592" y="494" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">POST /routes/geometry</text>
        <text x="592" y="510" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">road lines to draw</text>
        <line x1="500" y1="484" x2="576" y2="484" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="176" y="589" fill="#1F2A33" font-size="11" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="end" font-weight="700">REQUESTS</text>
        <rect x="200" y="548" width="300" height="72" rx="6" fill="#FFFFFF"/>
        <rect x="200" y="548" width="300" height="72" rx="6" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>
        <text x="216" y="574" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-weight="700">getRequest</text>
        <text x="216" y="594" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">GET /requests/{id}</text>
        <text x="216" y="610" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">status of a queued call</text>
        <rect x="576" y="548" width="300" height="72" rx="6" fill="#FFFFFF"/>
        <rect x="576" y="548" width="300" height="72" rx="6" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>
        <text x="592" y="574" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-weight="700">cancelRequest</text>
        <text x="592" y="594" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">DELETE /requests/{id}</text>
        <text x="592" y="610" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">best-effort cancel</text>
        <line x1="500" y1="584" x2="576" y2="584" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="176" y="689" fill="#1F2A33" font-size="11" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="end" font-weight="700">IDENTITY</text>
        <rect x="200" y="648" width="300" height="72" rx="6" fill="#FFFFFF"/>
        <rect x="200" y="648" width="300" height="72" rx="6" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>
        <text x="216" y="674" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-weight="700">whoami</text>
        <text x="216" y="694" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">GET /whoami</text>
        <text x="216" y="710" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">the token&#x27;s tenant</text>
        <line x1="30" y1="726" x2="1250" y2="726" stroke="rgba(31,42,51,0.1)" stroke-width="0.8"/>
        <text x="30" y="752" fill="#444444" font-size="8" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">LEGEND</text>
        <rect x="100" y="742" width="18" height="12" rx="2" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="0.8"/>
        <text x="126" y="752" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">OPERATION</text>
        <rect x="216" y="742" width="18" height="12" rx="2" fill="rgba(40,122,76,0.08)" stroke="#5A6B7A" stroke-width="0.8"/>
        <text x="242" y="752" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">THE CALL THAT COMMITS A BOOKING</text>
        <line x1="484" y1="748" x2="520" y2="748" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="530" y="752" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">CALLED NEXT</text>
        <rect x="636" y="742" width="18" height="12" rx="2" fill="#F4F6F8" stroke="#5A6B7A" stroke-width="0.8" stroke-dasharray="3,2"/>
        <text x="662" y="752" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">ALTERNATIVE PATH</text>
        <text x="1250" y="752" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end">every operation is under /api/v1; the contract is OpenAPI 3.1</text>
      </svg>
    </div>
  </div>
</body>
</html>
