<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A queued proposal&#x27;s life</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #FFFFFF; --color-ink: #1F2A33; --color-muted: #444444; --color-accent: #287A4C;
      --font-sans: 'Calibri', 'Carlito', system-ui, sans-serif; --font-serif: 'Calibri', 'Carlito', serif; --font-mono: 'Consolas', 'Liberation Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1320px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1280px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">WaterFlex scheduler explained</p>
    <h1>A queued proposal&#x27;s life</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1280 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="queue_states-title queue_states-desc">
        <title id="queue_states-title">A queued proposal&#x27;s life</title>
        <desc id="queue_states-desc">State machine of a daily or repair proposal sent with Prefer: respond-async: accepted 202 and queued, taken in turn by any replica, completed with the answer the call would have given, or completed with 429 after waiting 15 minutes.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#444444"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#287A4C"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0B3A66"/></marker>
<marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#444444" stroke-width="1.2"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="6" stroke="#444444" stroke-width="1.2"/></pattern>
        </defs>
        <rect width="100%" height="100%" fill="#FFFFFF"/>
        <rect x="40" y="196" width="200" height="80" rx="6" fill="#FFFFFF"/>
        <rect x="40" y="196" width="200" height="80" rx="6" fill="#DCE6EF" stroke="#5A6B7A" stroke-width="1"/>
        <text x="140" y="232" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="middle" font-weight="700">POST proposal</text>
        <text x="140" y="252" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">PREFER: RESPOND-ASYNC</text>
        <rect x="320" y="196" width="200" height="80" rx="10" fill="#FFFFFF"/>
        <rect x="320" y="196" width="200" height="80" rx="10" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>
        <text x="420" y="234" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="middle" font-weight="700">QUEUED</text>
        <text x="420" y="252" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">DURABLE TABLE</text>
        <rect x="620" y="196" width="200" height="80" rx="10" fill="#FFFFFF"/>
        <rect x="620" y="196" width="200" height="80" rx="10" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>
        <text x="720" y="234" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="middle" font-weight="700">RUNNING</text>
        <text x="720" y="252" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">ANY REPLICA</text>
        <rect x="940" y="196" width="260" height="80" rx="10" fill="#FFFFFF"/>
        <rect x="940" y="196" width="260" height="80" rx="10" fill="rgba(40,122,76,0.1)" stroke="#287A4C" stroke-width="1"/>
        <text x="1070" y="234" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="middle" font-weight="700">COMPLETED</text>
        <text x="1070" y="252" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">THE CALL&#x27;S OWN ANSWER</text>
        <line x1="240" y1="236" x2="320" y2="236" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="265.77" y="214" width="28.46" height="16" rx="2" fill="#FFFFFF"/>
        <text x="280" y="226" fill="#5A6B7A" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">202</text>
        <line x1="520" y1="236" x2="620" y2="236" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="538.72" y="214" width="62.56" height="16" rx="2" fill="#FFFFFF"/>
        <text x="570" y="226" fill="#5A6B7A" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ITS TURN</text>
        <line x1="820" y1="236" x2="940" y2="236" stroke="#287A4C" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="862.36" y="214" width="35.28" height="16" rx="2" fill="#FFFFFF"/>
        <text x="880" y="226" fill="#287A4C" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">DONE</text>
        <path d="M420,276 L420,352 Q420,360 428,360 L1062,360 Q1070,360 1070,352 L1070,276" fill="none" stroke="#444444" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="577.32" y="340" width="335.36" height="16" rx="2" fill="#FFFFFF"/>
        <text x="745" y="352" fill="#5A6B7A" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">WAITED 15 MINUTES: COMPLETED WITH 429, NEVER RUN</text>
        <path d="M140,196 L140,128 Q140,120 148,120 L400,120" fill="none" stroke="#444444" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="214.85" y="100" width="110.3" height="16" rx="2" fill="#FFFFFF"/>
        <text x="270" y="112" fill="#5A6B7A" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">QUEUE FULL (50)</text>
        <rect x="400" y="104" width="120" height="32" rx="2" fill="#FFFFFF"/>
        <rect x="400" y="104" width="120" height="32" rx="2" fill="#F4F6F8" stroke="rgba(31,42,51,0.4)" stroke-width="0.8"/>
        <text x="460" y="125" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">429 AT ONCE</text>
        <text x="620" y="96" fill="#1F2A33" font-size="14" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-style="italic">A worker takes the waiting request of the client</text>
        <text x="620" y="114" fill="#1F2A33" font-size="14" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-style="italic">whose last one started longest ago, with SKIP</text>
        <text x="620" y="132" fill="#1F2A33" font-size="14" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-style="italic">LOCKED: thirty overnight days of one client never</text>
        <text x="620" y="150" fill="#1F2A33" font-size="14" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-style="italic">hold back another client&#x27;s single day.</text>
        <text x="40" y="420" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">The host polls GET /requests/{requestId} and reads QUEUED, RUNNING, then COMPLETED with the status and body the call would have answered.</text>
        <text x="40" y="438" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">DELETE /requests/{requestId} is a best-effort cancel from any replica; the call then answers 409 CANCELLED.</text>
        <line x1="30" y1="466" x2="1250" y2="466" stroke="rgba(31,42,51,0.1)" stroke-width="0.8"/>
        <text x="30" y="492" fill="#444444" font-size="8" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">LEGEND</text>
        <rect x="100" y="482" width="18" height="12" rx="2" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="0.8"/>
        <text x="126" y="492" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">STATE</text>
        <rect x="188" y="482" width="18" height="12" rx="2" fill="rgba(40,122,76,0.1)" stroke="#5A6B7A" stroke-width="0.8"/>
        <text x="214" y="492" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">THE ANSWER</text>
        <line x1="312" y1="488" x2="348" y2="488" stroke="#444444" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="358" y="492" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">REFUSAL PATH</text>
      </svg>
    </div>
  </div>
</body>
</html>
