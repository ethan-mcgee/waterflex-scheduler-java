<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The booking sequence and its refusals</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #FFFFFF; --color-ink: #1F2A33; --color-muted: #444444; --color-accent: #287A4C;
      --font-sans: 'Calibri', 'Carlito', system-ui, sans-serif; --font-serif: 'Calibri', 'Carlito', serif; --font-mono: 'Consolas', 'Liberation Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1020px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 980px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">WaterFlex scheduler explained</p>
    <h1>The booking sequence and its refusals</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 980 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="booking-title booking-desc">
        <title id="booking-title">The booking sequence and its refusals</title>
        <desc id="booking-desc">Sequence of the booking calls between WaterFlex Software and the scheduler: offers, select, confirm and the receipt write, with the refusals that send the host back to a new search.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#444444"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#287A4C"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0B3A66"/></marker>
<marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#444444" stroke-width="1.2"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="6" stroke="#444444" stroke-width="1.2"/></pattern>
        </defs>
        <rect width="100%" height="100%" fill="#FFFFFF"/>
        <rect x="20" y="40" width="220" height="56" rx="6" fill="#FFFFFF"/>
        <rect x="20" y="40" width="220" height="56" rx="6" fill="#DCE6EF" stroke="#5A6B7A" stroke-width="1"/>
        <text x="130" y="64" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="middle" font-weight="700">WaterFlex Software</text>
        <text x="130" y="84" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">HOST · DESK OR CUSTOMER</text>
        <rect x="560" y="40" width="220" height="56" rx="6" fill="#FFFFFF"/>
        <rect x="560" y="40" width="220" height="56" rx="6" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>
        <text x="670" y="64" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="middle" font-weight="700">Scheduler</text>
        <text x="670" y="84" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">ANY BOOKING REPLICA</text>
        <line x1="130" y1="96" x2="130" y2="616" stroke="rgba(31,42,51,0.2)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="670" y1="96" x2="670" y2="616" stroke="rgba(31,42,51,0.2)" stroke-width="1" stroke-dasharray="3,3"/>
        <rect x="666" y="136" width="8" height="36" fill="rgba(31,42,51,0.06)" stroke="#444444" stroke-width="0.8"/>
        <rect x="666" y="216" width="8" height="28" fill="rgba(31,42,51,0.06)" stroke="#444444" stroke-width="0.8"/>
        <rect x="666" y="344" width="8" height="36" fill="rgba(31,42,51,0.06)" stroke="#444444" stroke-width="0.8"/>
        <line x1="134" y1="136" x2="666" y2="136" stroke="#0B3A66" stroke-width="1.4" marker-end="url(#arrow-link)"/>
        <rect x="191.4" y="114" width="417.2" height="16" rx="2" fill="#FFFFFF"/>
        <text x="400" y="126" fill="#0B3A66" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">POST OFFERS · JOB, HORIZON, SNAPSHOT OF EVERY TECHNICIAN-DAY</text>
        <line x1="666" y1="172" x2="134" y2="172" stroke="#444444" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="222.09" y="150" width="355.82" height="16" rx="2" fill="#FFFFFF"/>
        <text x="400" y="162" fill="#5A6B7A" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">201 OFFER SET · WINDOWS WITH PRICES, SEARCHCOMPLETE</text>
        <line x1="134" y1="216" x2="666" y2="216" stroke="#0B3A66" stroke-width="1.4" marker-end="url(#arrow-link)"/>
        <rect x="245.96" y="194" width="308.08" height="16" rx="2" fill="#FFFFFF"/>
        <text x="400" y="206" fill="#0B3A66" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">POST SELECT · THE WINDOW THE CUSTOMER PICKED</text>
        <line x1="666" y1="244" x2="134" y2="244" stroke="#444444" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="286.88" y="222" width="226.24" height="16" rx="2" fill="#FFFFFF"/>
        <text x="400" y="234" fill="#5A6B7A" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">200 HOLD · EXPIRES IN 10 MINUTES</text>
        <rect x="80" y="272" width="630" height="328" rx="4" fill="rgba(31,42,51,0.02)" stroke="rgba(31,42,51,0.22)" stroke-width="1"/>
        <rect x="80" y="272" width="40" height="16" rx="2" fill="#FFFFFF" stroke="rgba(31,42,51,0.22)" stroke-width="1"/>
        <text x="100" y="284" fill="#444444" font-size="8" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>
        <text x="92" y="308" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.04em">[RECORDS UNCHANGED SINCE THE OFFER]</text>
        <line x1="134" y1="344" x2="666" y2="344" stroke="#0B3A66" stroke-width="1.4" marker-end="url(#arrow-link)"/>
        <rect x="232.32" y="322" width="335.36" height="16" rx="2" fill="#FFFFFF"/>
        <text x="400" y="334" fill="#0B3A66" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">POST CONFIRM · FRESH SNAPSHOT OF THE HOLD&#x27;S DATE</text>
        <line x1="666" y1="380" x2="134" y2="380" stroke="#287A4C" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="259.6" y="358" width="280.8" height="16" rx="2" fill="#FFFFFF"/>
        <text x="400" y="370" fill="#287A4C" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">200 CONFIRMED · ARRANGEMENT FOR THAT DAY</text>
        <path d="M134,408 H166 Q174,408 174,416 V424 Q174,432 166,432 H142" fill="none" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="186" y="413" width="389.92" height="16" rx="2" fill="#FFFFFF"/>
        <text x="186" y="425" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">HOST WRITES THE RECEIPT: COMPARE-AND-SET ON LASTMODIFIED</text>
        <line x1="88" y1="456" x2="702" y2="456" stroke="rgba(31,42,51,0.2)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="92" y="480" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.04em">[409 STALE · 409 HOLD_UNAVAILABLE · OR THE RECEIPT WRITE FAILS]</text>
        <line x1="666" y1="520" x2="134" y2="520" stroke="#444444" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="211.86" y="498" width="376.28" height="16" rx="2" fill="#FFFFFF"/>
        <text x="400" y="510" fill="#5A6B7A" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">409 WITH ITS REASON (OR THE HOST&#x27;S OWN WRITE CONFLICT)</text>
        <line x1="134" y1="568" x2="666" y2="568" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="164.12" y="546" width="471.76" height="16" rx="2" fill="#FFFFFF"/>
        <text x="400" y="558" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RELEASE THE SET OR LET THE HOLD EXPIRE · SEARCH AGAIN, NEW REQUESTID</text>
        <text x="730" y="300" fill="#1F2A33" font-size="14" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-style="italic">STALE: the snapshot is</text>
        <text x="730" y="318" fill="#1F2A33" font-size="14" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-style="italic">older than records</text>
        <text x="730" y="336" fill="#1F2A33" font-size="14" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-style="italic">already used.</text>
        <text x="730" y="354" fill="#1F2A33" font-size="14" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-style="italic"></text>
        <text x="730" y="372" fill="#1F2A33" font-size="14" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-style="italic">HOLD_UNAVAILABLE: the</text>
        <text x="730" y="390" fill="#1F2A33" font-size="14" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-style="italic">hold expired or was</text>
        <text x="730" y="408" fill="#1F2A33" font-size="14" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-style="italic">lost, another offer was</text>
        <text x="730" y="426" fill="#1F2A33" font-size="14" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-style="italic">selected, or the day no</text>
        <text x="730" y="444" fill="#1F2A33" font-size="14" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-style="italic">longer fits.</text>
        <text x="730" y="462" fill="#1F2A33" font-size="14" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-style="italic"></text>
        <text x="730" y="480" fill="#1F2A33" font-size="14" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-style="italic">Write conflict: a</text>
        <text x="730" y="498" fill="#1F2A33" font-size="14" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-style="italic">lastModified moved</text>
        <text x="730" y="516" fill="#1F2A33" font-size="14" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-style="italic">since the receipt.</text>
        <line x1="40" y1="644" x2="940" y2="644" stroke="rgba(31,42,51,0.1)" stroke-width="0.8"/>
        <text x="40" y="670" fill="#444444" font-size="8" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">LEGEND</text>
        <line x1="110" y1="666" x2="146" y2="666" stroke="#0B3A66" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="156" y="670" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">CALL</text>
        <line x1="212" y1="666" x2="248" y2="666" stroke="#444444" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="258" y="670" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">REPLY</text>
        <line x1="320" y1="666" x2="356" y2="666" stroke="#287A4C" stroke-width="1.6"/>
        <text x="366" y="670" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">HEADLINE SUCCESS</text>
        <rect x="504" y="660" width="18" height="12" rx="2" fill="rgba(31,42,51,0.06)" stroke="#5A6B7A" stroke-width="0.8"/>
        <text x="530" y="670" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">SCHEDULER HOLDS CONTROL</text>
        <text x="940" y="670" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end">time runs top to bottom</text>
      </svg>
    </div>
  </div>
</body>
</html>
