<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Every refusal, by what the host does next</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #FFFFFF; --color-ink: #1F2A33; --color-muted: #444444; --color-accent: #287A4C;
      --font-sans: 'Calibri', 'Carlito', system-ui, sans-serif; --font-serif: 'Calibri', 'Carlito', serif; --font-mono: 'Consolas', 'Liberation Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1020px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 980px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">WaterFlex scheduler explained</p>
    <h1>Every refusal, by what the host does next</h1>

<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0B3A66"/></marker>
<marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#444444" stroke-width="1.2"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="6" stroke="#444444" stroke-width="1.2"/></pattern>
        </defs>
        <rect width="100%" height="100%" fill="#FFFFFF"/>
        <rect x="40" y="284" width="160" height="72" rx="6" fill="#FFFFFF"/>

        <text x="120" y="336" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">PROBLEM+JSON</text>

        <line x1="228" y1="80" x2="228" y2="560" stroke="#444444" stroke-width="1.2"/>
        <line x1="228" y1="80" x2="260" y2="80" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="260" y="40" width="340" height="80" rx="6" fill="#FFFFFF"/>
        <rect x="260" y="40" width="340" height="80" rx="6" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>

        <text x="276" y="102" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">unchanged</text>

        <rect x="632" y="68" width="149.58" height="24" rx="2" fill="#FFFFFF"/>
        <rect x="632" y="68" width="149.58" height="24" rx="2" fill="#F4F6F8" stroke="rgba(31,42,51,0.4)" stroke-width="0.8"/>
        <text x="706.79" y="84" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">413 INVALID_REQUEST</text>
        <rect x="632" y="100" width="156.4" height="24" rx="2" fill="#FFFFFF"/>
        <rect x="632" y="100" width="156.4" height="24" rx="2" fill="#F4F6F8" stroke="rgba(31,42,51,0.4)" stroke-width="0.8"/>
        <text x="710.2" y="116" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">422 INCOMPLETE_FACTS</text>

        <rect x="632" y="164" width="40.46" height="24" rx="2" fill="#FFFFFF"/>

        <text x="652.23" y="180" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">401</text>
        <line x1="600" y1="176" x2="632" y2="176" stroke="rgba(31,42,51,0.25)" stroke-width="1"/>

        <rect x="260" y="232" width="340" height="80" rx="6" fill="rgba(40,122,76,0.08)" stroke="#287A4C" stroke-width="1.4"/>
        <text x="276" y="260" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-weight="700">Rebuild from current records</text>
        <text x="276" y="280" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">commit: a new proposal; booking: same call,</text>

        <rect x="632" y="260" width="81.38" height="24" rx="2" fill="#FFFFFF"/>
        <rect x="632" y="260" width="81.38" height="24" rx="2" fill="#F4F6F8" stroke="rgba(31,42,51,0.4)" stroke-width="0.8"/>

        <line x1="600" y1="272" x2="632" y2="272" stroke="rgba(31,42,51,0.25)" stroke-width="1"/>
        <line x1="228" y1="368" x2="260" y2="368" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="260" y="328" width="340" height="80" rx="6" fill="#FFFFFF"/>
        <rect x="260" y="328" width="340" height="80" rx="6" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>

        <text x="276" y="376" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">a new requestId</text>
        <rect x="632" y="356" width="156.4" height="24" rx="2" fill="#FFFFFF"/>
        <rect x="632" y="356" width="156.4" height="24" rx="2" fill="#F4F6F8" stroke="rgba(31,42,51,0.4)" stroke-width="0.8"/>
        <text x="710.2" y="372" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">409 HOLD_UNAVAILABLE</text>
        <line x1="600" y1="368" x2="632" y2="368" stroke="rgba(31,42,51,0.25)" stroke-width="1"/>
        <line x1="228" y1="464" x2="260" y2="464" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="260" y="424" width="340" height="80" rx="6" fill="#FFFFFF"/>
        <rect x="260" y="424" width="340" height="80" rx="6" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>
        <text x="276" y="452" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-weight="700">Wait, then retry the same requestId</text>
        <text x="276" y="472" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">Retry-After or backoff</text>

        <text x="806.99" y="452" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">503 ROUTING_UNAVAILABLE</text>
        <rect x="632" y="468" width="204.14" height="24" rx="2" fill="#FFFFFF"/>
        <rect x="632" y="468" width="204.14" height="24" rx="2" fill="#F4F6F8" stroke="rgba(31,42,51,0.4)" stroke-width="0.8"/>
        <text x="734.07" y="484" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">503 CALCULATION_UNAVAILABLE</text>
        <line x1="600" y1="448" x2="632" y2="448" stroke="rgba(31,42,51,0.25)" stroke-width="1"/>
        <line x1="228" y1="560" x2="260" y2="560" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="260" y="520" width="340" height="80" rx="6" fill="#FFFFFF"/>
        <rect x="260" y="520" width="340" height="80" rx="6" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>

        <rect x="632" y="532" width="108.66" height="24" rx="2" fill="#FFFFFF"/>

        <rect x="752.66" y="532" width="149.58" height="24" rx="2" fill="#F4F6F8" stroke="rgba(31,42,51,0.4)" stroke-width="0.8"/>
        <text x="827.45" y="548" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">409 NOT_COMMITTABLE</text>
        <rect x="632" y="564" width="108.66" height="24" rx="2" fill="#FFFFFF"/>
        <rect x="632" y="564" width="108.66" height="24" rx="2" fill="#F4F6F8" stroke="rgba(31,42,51,0.4)" stroke-width="0.8"/>

        <line x1="600" y1="544" x2="632" y2="544" stroke="rgba(31,42,51,0.25)" stroke-width="1"/>
        <line x1="40" y1="624" x2="940" y2="624" stroke="rgba(31,42,51,0.1)" stroke-width="0.8"/>
        <text x="40" y="650" fill="#444444" font-size="8" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">LEGEND</text>
        <rect x="110" y="640" width="18" height="12" rx="2" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="0.8"/>
        <text x="136" y="650" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">THE HOST&#x27;S ACTION</text>
        <rect x="280" y="640" width="18" height="12" rx="2" fill="#F4F6F8" stroke="#5A6B7A" stroke-width="0.8"/>
        <text x="306" y="650" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">STATUS AND CODE</text>

      </svg>
    </div>
  </div>
</body>
</html>
