<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Every refusal, by what the host does next</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #FFFFFF; --color-ink: #1F2A33; --color-muted: #444444; --color-accent: #287A4C;
      --font-sans: 'Calibri', 'Carlito', system-ui, sans-serif; --font-serif: 'Calibri', 'Carlito', serif; --font-mono: 'Consolas', 'Liberation Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1320px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1280px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">WaterFlex scheduler explained</p>
    <h1>Every refusal, by what the host does next</h1>

<marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#444444" stroke-width="1.2"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="6" stroke="#444444" stroke-width="1.2"/></pattern>

        <text x="130" y="304" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">PROBLEM+JSON BODY</text>

        <rect x="300" y="40" width="380" height="72" rx="6" fill="#FFFFFF"/>

        <line x1="680" y1="76" x2="712" y2="76" stroke="rgba(31,42,51,0.25)" stroke-width="1"/>

        <rect x="712" y="156" width="40.46" height="24" rx="2" fill="#F4F6F8" stroke="rgba(31,42,51,0.4)" stroke-width="0.8"/>
        <text x="732.23" y="172" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">401</text>
        <line x1="680" y1="168" x2="712" y2="168" stroke="rgba(31,42,51,0.25)" stroke-width="1"/>
        <path d="M220,288 L252,288 Q260,288 260,280 L260,268 Q260,260 268,260 L300,260" fill="none" stroke="#287A4C" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="300" y="224" width="380" height="72" rx="6" fill="#FFFFFF"/>

        <text x="316" y="276" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">commit: a new proposal; booking: same call, new requestId</text>
        <rect x="712" y="248" width="81.38" height="24" rx="2" fill="#FFFFFF"/>
        <rect x="712" y="248" width="81.38" height="24" rx="2" fill="#F4F6F8" stroke="rgba(31,42,51,0.4)" stroke-width="0.8"/>
        <text x="752.69" y="264" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">409 STALE</text>
        <line x1="680" y1="260" x2="712" y2="260" stroke="rgba(31,42,51,0.25)" stroke-width="1"/>
        <path d="M220,288 L252,288 Q260,288 260,296 L260,344 Q260,352 268,352 L300,352" fill="none" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>

        <text x="316" y="368" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">a new requestId</text>
        <rect x="712" y="340" width="156.4" height="24" rx="2" fill="#FFFFFF"/>
        <rect x="712" y="340" width="156.4" height="24" rx="2" fill="#F4F6F8" stroke="rgba(31,42,51,0.4)" stroke-width="0.8"/>
        <text x="790.2" y="356" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">409 HOLD_UNAVAILABLE</text>
        <line x1="680" y1="352" x2="712" y2="352" stroke="rgba(31,42,51,0.25)" stroke-width="1"/>
        <path d="M220,288 L252,288 Q260,288 260,296 L260,436 Q260,444 268,444 L300,444" fill="none" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="300" y="408" width="380" height="72" rx="6" fill="#FFFFFF"/>
        <rect x="300" y="408" width="380" height="72" rx="6" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>
        <text x="316" y="438" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-weight="700">Wait, then retry the same requestId</text>
        <text x="316" y="460" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">Retry-After or backoff</text>
        <rect x="712" y="432" width="74.56" height="24" rx="2" fill="#FFFFFF"/>
        <rect x="712" y="432" width="74.56" height="24" rx="2" fill="#F4F6F8" stroke="rgba(31,42,51,0.4)" stroke-width="0.8"/>
        <text x="749.28" y="448" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">429 BUSY</text>
        <rect x="798.56" y="432" width="176.86" height="24" rx="2" fill="#FFFFFF"/>
        <rect x="798.56" y="432" width="176.86" height="24" rx="2" fill="#F4F6F8" stroke="rgba(31,42,51,0.4)" stroke-width="0.8"/>
        <text x="886.99" y="448" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">503 ROUTING_UNAVAILABLE</text>
        <rect x="987.42" y="432" width="204.14" height="24" rx="2" fill="#FFFFFF"/>
        <rect x="987.42" y="432" width="204.14" height="24" rx="2" fill="#F4F6F8" stroke="rgba(31,42,51,0.4)" stroke-width="0.8"/>
        <text x="1089.49" y="448" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">503 CALCULATION_UNAVAILABLE</text>
        <line x1="680" y1="444" x2="712" y2="444" stroke="rgba(31,42,51,0.25)" stroke-width="1"/>
        <path d="M220,288 L252,288 Q260,288 260,296 L260,528 Q260,536 268,536 L300,536" fill="none" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="300" y="500" width="380" height="72" rx="6" fill="#FFFFFF"/>

        <text x="316" y="552" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">or repeat a cancelled call if still wanted</text>
        <rect x="712" y="524" width="108.66" height="24" rx="2" fill="#FFFFFF"/>
        <rect x="712" y="524" width="108.66" height="24" rx="2" fill="#F4F6F8" stroke="rgba(31,42,51,0.4)" stroke-width="0.8"/>
        <text x="766.33" y="540" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">404 NOT_FOUND</text>
        <rect x="832.66" y="524" width="149.58" height="24" rx="2" fill="#FFFFFF"/>
        <rect x="832.66" y="524" width="149.58" height="24" rx="2" fill="#F4F6F8" stroke="rgba(31,42,51,0.4)" stroke-width="0.8"/>
        <text x="907.45" y="540" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">409 NOT_COMMITTABLE</text>
        <rect x="994.24" y="524" width="108.66" height="24" rx="2" fill="#FFFFFF"/>
        <rect x="994.24" y="524" width="108.66" height="24" rx="2" fill="#F4F6F8" stroke="rgba(31,42,51,0.4)" stroke-width="0.8"/>
        <text x="1048.57" y="540" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">409 CANCELLED</text>
        <line x1="680" y1="536" x2="712" y2="536" stroke="rgba(31,42,51,0.25)" stroke-width="1"/>
        <line x1="30" y1="586" x2="1250" y2="586" stroke="rgba(31,42,51,0.1)" stroke-width="0.8"/>
        <text x="30" y="612" fill="#444444" font-size="8" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">LEGEND</text>
        <rect x="100" y="602" width="18" height="12" rx="2" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="0.8"/>
        <text x="126" y="612" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">THE HOST&#x27;S ACTION</text>
        <rect x="272" y="602" width="18" height="12" rx="2" fill="#F4F6F8" stroke="#5A6B7A" stroke-width="0.8"/>
        <text x="298" y="612" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">STATUS AND CODE</text>
        <rect x="428" y="602" width="18" height="12" rx="2" fill="rgba(40,122,76,0.08)" stroke="#5A6B7A" stroke-width="0.8"/>
        <text x="454" y="612" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">THE ONE THE TOKEN DESIGN RELIES ON</text>
        <text x="1250" y="612" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end">source: the integration guide&#x27;s problem table</text>
      </svg>
    </div>
  </div>
</body>
</html>
