<!DOCTYPE html>
<html lang="en">
<head>

  <title>Two ways to fit a new job into a booked day</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #FFFFFF; --color-ink: #1F2A33; --color-muted: #444444; --color-accent: #287A4C;
      --font-sans: 'Calibri', 'Carlito', system-ui, sans-serif; --font-serif: 'Calibri', 'Carlito', serif; --font-mono: 'Consolas', 'Liberation Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1320px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1280px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>

    <p class="eyebrow">WaterFlex scheduler explained</p>
    <h1>Two ways to fit a new job into a booked day</h1>

        <desc id="booking_methods-desc">Insertion tries the new visit in every gap of every eligible route and moves nothing else; bounded search also tries small rearrangements around the affected work, within limits on routes, depth and candidates.</desc>

<marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#444444" stroke-width="1.2"/></marker>

        <line x1="338" y1="116" x2="338" y2="128" stroke="#287A4C" stroke-width="1.2" stroke-dasharray="3,2"/>

        <text x="40" y="278" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">the first gap that keeps every promise and adds no overtime, per window</text>
        <text x="680" y="48" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-weight="700">Bounded search</text>

        <circle cx="850" cy="92" r="13" fill="rgba(40,122,76,0.14)" stroke="#287A4C" stroke-width="1.4"/>

        <text x="870" y="96" fill="#287A4C" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">N TAKES THE ROOM 3 LEFT</text>

        <line x1="40" y1="316" x2="1240" y2="316" stroke="rgba(31,42,51,0.1)" stroke-width="0.8"/>

        <text x="56" y="406" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">Bounded never used more paid minutes or</text>
        <text x="56" y="424" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">cost than insertion where both booked alike</text>
        <rect x="680" y="356" width="560" height="108" rx="6" fill="#FFFFFF"/>
        <rect x="680" y="356" width="560" height="108" rx="6" fill="#FFFFFF" stroke="rgba(31,42,51,0.18)" stroke-width="1"/>

        <text x="696" y="406" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">More candidates per search: a higher p95,</text>
        <text x="696" y="424" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">and more of it as requests run at once</text>
