<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One road leg lookup, before and after RoadMatrix</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #FFFFFF; --color-ink: #1F2A33; --color-muted: #444444; --color-accent: #287A4C;
      --font-sans: 'Calibri', 'Carlito', system-ui, sans-serif; --font-serif: 'Calibri', 'Carlito', serif; --font-mono: 'Consolas', 'Liberation Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1020px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 980px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">WaterFlex scheduler explained</p>
    <h1>One road leg lookup, before and after RoadMatrix</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 980 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="roadmatrix-title roadmatrix-desc">
        <title id="roadmatrix-title">One road leg lookup, before and after RoadMatrix</title>
        <desc id="roadmatrix-desc">Before: every scored route built a from-to string per leg, probed an immutable map, computed buffered minutes in BigDecimal and built a map of arrivals that was then copied. After: endpoints are numbered once per fact revision and legs are read from two tables with the minutes precomputed; the score-only path builds no arrival map.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#444444"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#287A4C"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0B3A66"/></marker>
<marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#444444" stroke-width="1.2"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="6" stroke="#444444" stroke-width="1.2"/></pattern>
        </defs>
        <rect width="100%" height="100%" fill="#FFFFFF"/>
        <text x="40" y="104" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-weight="700">Before</text>
        <text x="40" y="124" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">PER LEG, EVERY SCORE</text>
        <rect x="220" y="76" width="156" height="56" rx="6" fill="#FFFFFF"/>
        <rect x="220" y="76" width="156" height="56" rx="6" fill="#F4F6F8" stroke="#5A6B7A" stroke-width="1"/>
        <text x="298" y="109" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">&quot;A|B&quot; KEY</text>
        <rect x="404" y="76" width="156" height="56" rx="6" fill="#FFFFFF"/>
        <rect x="404" y="76" width="156" height="56" rx="6" fill="#F4F6F8" stroke="#5A6B7A" stroke-width="1"/>
        <text x="482" y="109" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">MAP PROBE</text>
        <line x1="376" y1="104" x2="404" y2="104" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="588" y="76" width="156" height="56" rx="6" fill="#FFFFFF"/>
        <rect x="588" y="76" width="156" height="56" rx="6" fill="#F4F6F8" stroke="#5A6B7A" stroke-width="1"/>
        <text x="666" y="109" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">BIGDECIMAL MINUTES</text>
        <line x1="560" y1="104" x2="588" y2="104" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="772" y="76" width="156" height="56" rx="6" fill="#FFFFFF"/>
        <rect x="772" y="76" width="156" height="56" rx="6" fill="#F4F6F8" stroke="#5A6B7A" stroke-width="1"/>
        <text x="850" y="109" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">ARRIVALS MAP, COPIED</text>
        <line x1="744" y1="104" x2="772" y2="104" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="40" y="254" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-weight="700">After (#163)</text>
        <text x="40" y="274" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">ONCE PER FACT REVISION</text>
        <rect x="220" y="226" width="156" height="56" rx="6" fill="#FFFFFF"/>
        <rect x="220" y="226" width="156" height="56" rx="6" fill="rgba(40,122,76,0.08)" stroke="#287A4C" stroke-width="1.4"/>
        <text x="298" y="259" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">ENDPOINT NUMBERS</text>
        <rect x="404" y="226" width="156" height="56" rx="6" fill="#FFFFFF"/>
        <rect x="404" y="226" width="156" height="56" rx="6" fill="rgba(40,122,76,0.08)" stroke="#287A4C" stroke-width="1.4"/>
        <text x="482" y="259" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">TABLE[i][j]</text>
        <line x1="376" y1="254" x2="404" y2="254" stroke="#287A4C" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="588" y="226" width="156" height="56" rx="6" fill="#FFFFFF"/>
        <rect x="588" y="226" width="156" height="56" rx="6" fill="rgba(40,122,76,0.08)" stroke="#287A4C" stroke-width="1.4"/>
        <text x="666" y="259" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">MINUTES PRECOMPUTED</text>
        <line x1="560" y1="254" x2="588" y2="254" stroke="#287A4C" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="772" y="226" width="156" height="56" rx="6" fill="#FFFFFF"/>
        <rect x="772" y="226" width="156" height="56" rx="6" fill="rgba(40,122,76,0.08)" stroke="#287A4C" stroke-width="1.4"/>
        <text x="850" y="259" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">NO ARRIVAL MAP</text>
        <line x1="744" y1="254" x2="772" y2="254" stroke="#287A4C" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="40" y="360" width="900" height="112" rx="6" fill="#FFFFFF"/>
        <rect x="40" y="360" width="900" height="112" rx="6" fill="rgba(40,122,76,0.06)" stroke="#287A4C" stroke-width="1.2"/>
        <text x="56" y="382" fill="#287A4C" font-size="8" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">THE GATE</text>
        <text x="56" y="410" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">A scoring exactness test captured a step-limited, fixed-seed solve on three fixtures</text>
        <text x="56" y="428" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">before the change and asserts the same score, move count, arrangement and independent</text>
        <text x="56" y="446" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">evaluation after it. Every number the engine computes stays the same.</text>
        <line x1="40" y1="504" x2="940" y2="504" stroke="rgba(31,42,51,0.1)" stroke-width="0.8"/>
        <text x="40" y="530" fill="#444444" font-size="8" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">LEGEND</text>
        <rect x="110" y="520" width="18" height="12" rx="2" fill="#F4F6F8" stroke="#5A6B7A" stroke-width="0.8"/>
        <text x="136" y="530" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">WORK PER LEG BEFORE</text>
        <rect x="296" y="520" width="18" height="12" rx="2" fill="rgba(40,122,76,0.08)" stroke="#5A6B7A" stroke-width="0.8"/>
        <text x="322" y="530" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">AFTER: LAZY, BUILT ON THE FIRST LOOKUP</text>
        <text x="940" y="530" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end">a booking candidate pays nothing new</text>
      </svg>
    </div>
  </div>
</body>
</html>
