<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reconciling a technician-day before a booking search</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #FFFFFF; --color-ink: #1F2A33; --color-muted: #444444; --color-accent: #287A4C;
      --font-sans: 'Calibri', 'Carlito', system-ui, sans-serif; --font-serif: 'Calibri', 'Carlito', serif; --font-mono: 'Consolas', 'Liberation Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1020px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 980px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">WaterFlex scheduler explained</p>
    <h1>Reconciling a technician-day before a booking search</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 980 920" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="reconcile-title reconcile-desc">
        <title id="reconcile-title">Reconciling a technician-day before a booking search</title>
        <desc id="reconcile-desc">Flowchart of the five reconciliation rules a booking search or confirm applies to each technician-day of the host&#x27;s snapshot against the stored arrangement: refuse STALE, keep as stored, accept the expected change, replace the route, or lose the holds of that date.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#444444"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#287A4C"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0B3A66"/></marker>
<marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#444444" stroke-width="1.2"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="6" stroke="#444444" stroke-width="1.2"/></pattern>
        </defs>
        <rect width="100%" height="100%" fill="#FFFFFF"/>
        <rect x="180" y="40" width="160" height="56" rx="6" fill="#FFFFFF"/>
        <rect x="180" y="40" width="160" height="56" rx="6" fill="#DCE6EF" stroke="#5A6B7A" stroke-width="1"/>
        <text x="260" y="64" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="middle" font-weight="700">Snapshot</text>
        <text x="260" y="84" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">ONE TECHNICIAN-DAY</text>
        <line x1="260" y1="96" x2="260" y2="104" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <polygon points="260,104 380,164 260,224 140,164" fill="#FFFFFF"/>
        <polygon points="260,104 380,164 260,224 140,164" fill="rgba(40,122,76,0.08)" stroke="#287A4C" stroke-width="1"/>
        <text x="260" y="152" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">ALREADY SEEN</text>
        <text x="260" y="168" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">TIMESTAMP OR</text>
        <text x="260" y="184" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">PRE-RECEIPT ROUTE?</text>
        <line x1="380" y1="164" x2="500" y2="164" stroke="#287A4C" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="425.77" y="142" width="28.46" height="16" rx="2" fill="#FFFFFF"/>
        <text x="440" y="154" fill="#287A4C" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
        <rect x="500" y="122" width="440" height="84" rx="6" fill="#FFFFFF"/>
        <rect x="500" y="122" width="440" height="84" rx="6" fill="rgba(40,122,76,0.08)" stroke="#287A4C" stroke-width="1.4"/>
        <rect x="508" y="128" width="56" height="16" rx="2" fill="transparent" stroke="rgba(31,42,51,0.4)" stroke-width="0.8"/>
        <text x="536" y="140" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">RULE 0</text>
        <text x="516" y="162" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-weight="700">409 STALE</text>
        <text x="516" y="182" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">refused before anything is reconciled; nothing is lost</text>
        <line x1="260" y1="224" x2="260" y2="254" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="271.18" y="231" width="21.64" height="16" rx="2" fill="#FFFFFF"/>
        <text x="282" y="243" fill="#5A6B7A" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
        <polygon points="260,254 380,314 260,374 140,314" fill="#FFFFFF"/>
        <polygon points="260,254 380,314 260,374 140,314" fill="#F4F6F8" stroke="#5A6B7A" stroke-width="1"/>
        <text x="260" y="310" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">LASTMODIFIED</text>
        <text x="260" y="326" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">UNCHANGED?</text>
        <line x1="380" y1="314" x2="500" y2="314" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="425.77" y="292" width="28.46" height="16" rx="2" fill="#FFFFFF"/>
        <text x="440" y="304" fill="#5A6B7A" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
        <rect x="500" y="272" width="440" height="84" rx="6" fill="#FFFFFF"/>
        <rect x="500" y="272" width="440" height="84" rx="6" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>
        <rect x="508" y="278" width="56" height="16" rx="2" fill="transparent" stroke="rgba(31,42,51,0.4)" stroke-width="0.8"/>
        <text x="536" y="290" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">RULE 1</text>
        <text x="516" y="312" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-weight="700">As stored</text>
        <text x="516" y="332" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">nothing to do</text>
        <line x1="260" y1="374" x2="260" y2="404" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="271.18" y="381" width="21.64" height="16" rx="2" fill="#FFFFFF"/>
        <text x="282" y="393" fill="#5A6B7A" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
        <polygon points="260,404 380,464 260,524 140,464" fill="#FFFFFF"/>
        <polygon points="260,404 380,464 260,524 140,464" fill="#F4F6F8" stroke="#5A6B7A" stroke-width="1"/>
        <text x="260" y="452" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">APPOINTMENTS</text>
        <text x="260" y="468" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">EXACTLY AS</text>
        <text x="260" y="484" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">EXPECTED?</text>
        <line x1="380" y1="464" x2="500" y2="464" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="425.77" y="442" width="28.46" height="16" rx="2" fill="#FFFFFF"/>
        <text x="440" y="454" fill="#5A6B7A" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
        <rect x="500" y="422" width="440" height="84" rx="6" fill="#FFFFFF"/>
        <rect x="500" y="422" width="440" height="84" rx="6" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>
        <rect x="508" y="428" width="56" height="16" rx="2" fill="transparent" stroke="rgba(31,42,51,0.4)" stroke-width="0.8"/>
        <text x="536" y="440" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">RULE 2</text>
        <text x="516" y="462" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-weight="700">Accepted</text>
        <text x="516" y="482" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">the new timestamp is recorded</text>
        <line x1="260" y1="524" x2="260" y2="554" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="271.18" y="531" width="21.64" height="16" rx="2" fill="#FFFFFF"/>
        <text x="282" y="543" fill="#5A6B7A" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
        <polygon points="260,554 380,614 260,674 140,614" fill="#FFFFFF"/>
        <polygon points="260,554 380,614 260,674 140,614" fill="#F4F6F8" stroke="#5A6B7A" stroke-width="1"/>
        <text x="260" y="602" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">STORED ROUTE HAS</text>
        <text x="260" y="618" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">A HOLD OR A</text>
        <text x="260" y="634" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">PENDING MOVE?</text>
        <line x1="380" y1="614" x2="500" y2="614" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="425.77" y="592" width="28.46" height="16" rx="2" fill="#FFFFFF"/>
        <text x="440" y="604" fill="#5A6B7A" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
        <rect x="500" y="572" width="440" height="84" rx="6" fill="#FFFFFF"/>
        <rect x="500" y="572" width="440" height="84" rx="6" fill="#F4F6F8" stroke="#5A6B7A" stroke-width="1"/>
        <rect x="508" y="578" width="56" height="16" rx="2" fill="transparent" stroke="rgba(31,42,51,0.4)" stroke-width="0.8"/>
        <text x="536" y="590" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">RULE 3</text>
        <text x="516" y="612" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-weight="700">Holds lost</text>
        <text x="516" y="632" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">every hold on that date is lost; the date restarts from</text>
        <text x="516" y="646" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">the host&#x27;s records</text>
        <line x1="260" y1="674" x2="260" y2="714" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="271.18" y="687" width="21.64" height="16" rx="2" fill="#FFFFFF"/>
        <text x="282" y="699" fill="#5A6B7A" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
        <rect x="140" y="714" width="240" height="84" rx="6" fill="#FFFFFF"/>
        <rect x="140" y="714" width="240" height="84" rx="6" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>
        <rect x="148" y="720" width="56" height="16" rx="2" fill="transparent" stroke="rgba(31,42,51,0.4)" stroke-width="0.8"/>
        <text x="176" y="732" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">RULE 3</text>
        <text x="260" y="756" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="middle" font-weight="700">Replace route</text>
        <text x="260" y="776" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">the host&#x27;s route becomes</text>
        <text x="260" y="790" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">the stored one</text>
        <rect x="500" y="714" width="440" height="100" rx="6" fill="#FFFFFF"/>
        <rect x="500" y="714" width="440" height="100" rx="6" fill="#F4F6F8" stroke="#5A6B7A" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="508" y="720" width="56" height="16" rx="2" fill="transparent" stroke="rgba(31,42,51,0.4)" stroke-width="0.8"/>
        <text x="536" y="732" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">RULE 4</text>
        <text x="516" y="754" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">Then, for every day kept, the whole arrangement is</text>
        <text x="516" y="768" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">re-evaluated with the snapshot&#x27;s current windows,</text>
        <text x="516" y="782" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">durations, shifts and absences. If it no longer fits,</text>
        <text x="516" y="796" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">that date&#x27;s holds are lost the same way.</text>
        <line x1="40" y1="854" x2="940" y2="854" stroke="rgba(31,42,51,0.1)" stroke-width="0.8"/>
        <text x="40" y="880" fill="#444444" font-size="8" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">LEGEND</text>
        <rect x="110" y="870" width="18" height="12" rx="2" fill="rgba(40,122,76,0.08)" stroke="#5A6B7A" stroke-width="0.8"/>
        <text x="136" y="880" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">THE RULE THE LOAD TOOL ADDED (#152)</text>
        <rect x="404" y="870" width="18" height="12" rx="2" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="0.8"/>
        <text x="430" y="880" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">KEPT</text>
        <rect x="488" y="870" width="18" height="12" rx="2" fill="#F4F6F8" stroke="#5A6B7A" stroke-width="0.8"/>
        <text x="514" y="880" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">HOLDS LOST</text>
        <text x="940" y="880" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end">32 timestamps remembered per day</text>
      </svg>
    </div>
  </div>
</body>
</html>
