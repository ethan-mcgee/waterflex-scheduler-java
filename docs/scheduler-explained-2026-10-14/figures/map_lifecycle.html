<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How a map version is prepared and switched on</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #FFFFFF; --color-ink: #1F2A33; --color-muted: #444444; --color-accent: #287A4C;
      --font-sans: 'Calibri', 'Carlito', system-ui, sans-serif; --font-serif: 'Calibri', 'Carlito', serif; --font-mono: 'Consolas', 'Liberation Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1020px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 980px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">WaterFlex scheduler explained</p>
    <h1>How a map version is prepared and switched on</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 980 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="map_lifecycle-title map_lifecycle-desc">
        <title id="map_lifecycle-title">How a map version is prepared and switched on</title>
        <desc id="map_lifecycle-desc">Process of preparing a map version as a whole: the merged OpenStreetMap extract, both road graphs, tiles and TIGER address ranges, validation with preview services, activation by switching symlinks, and the new routing identity that starts every cache cold.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#444444"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#287A4C"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0B3A66"/></marker>
<marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#444444" stroke-width="1.2"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="6" stroke="#444444" stroke-width="1.2"/></pattern>
        </defs>
        <rect width="100%" height="100%" fill="#FFFFFF"/>
        <rect x="40" y="48" width="268" height="88" rx="6" fill="#FFFFFF"/>
        <rect x="40" y="48" width="268" height="88" rx="6" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>
        <rect x="48" y="54" width="20" height="16" rx="2" fill="transparent" stroke="rgba(31,42,51,0.4)" stroke-width="0.8"/>
        <text x="58" y="66" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">1</text>
        <text x="174" y="88" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="middle" font-weight="700">Extract</text>
        <text x="174" y="108" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">MERGED OSM</text>
        <rect x="356" y="48" width="268" height="88" rx="6" fill="#FFFFFF"/>
        <rect x="356" y="48" width="268" height="88" rx="6" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>
        <rect x="364" y="54" width="20" height="16" rx="2" fill="transparent" stroke="rgba(31,42,51,0.4)" stroke-width="0.8"/>
        <text x="374" y="66" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">2</text>
        <text x="490" y="80" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="middle" font-weight="700">Road graphs</text>
        <text x="490" y="100" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">FLEXIBLE + CH</text>
        <text x="490" y="116" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">CH: ~27 S, ~200 MIB MORE</text>
        <rect x="672" y="48" width="268" height="88" rx="6" fill="#FFFFFF"/>
        <rect x="672" y="48" width="268" height="88" rx="6" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>
        <rect x="680" y="54" width="20" height="16" rx="2" fill="transparent" stroke="rgba(31,42,51,0.4)" stroke-width="0.8"/>
        <text x="690" y="66" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">3</text>
        <text x="806" y="88" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="middle" font-weight="700">Tiles</text>
        <text x="806" y="108" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">FOR DRAWING</text>
        <rect x="672" y="208" width="268" height="88" rx="6" fill="#FFFFFF"/>
        <rect x="672" y="208" width="268" height="88" rx="6" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>
        <rect x="680" y="214" width="20" height="16" rx="2" fill="transparent" stroke="rgba(31,42,51,0.4)" stroke-width="0.8"/>
        <text x="690" y="226" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">4</text>
        <text x="806" y="248" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="middle" font-weight="700">TIGER ranges</text>
        <text x="806" y="268" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">FOR NOMINATIM</text>
        <rect x="356" y="208" width="268" height="88" rx="6" fill="#FFFFFF"/>
        <rect x="356" y="208" width="268" height="88" rx="6" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>
        <rect x="364" y="214" width="20" height="16" rx="2" fill="transparent" stroke="rgba(31,42,51,0.4)" stroke-width="0.8"/>
        <text x="374" y="226" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">5</text>
        <text x="490" y="248" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="middle" font-weight="700">Validate</text>
        <text x="490" y="268" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">PREVIEW SERVICES</text>
        <rect x="40" y="208" width="268" height="88" rx="6" fill="#FFFFFF"/>
        <rect x="40" y="208" width="268" height="88" rx="6" fill="rgba(40,122,76,0.08)" stroke="#287A4C" stroke-width="1.4"/>
        <rect x="48" y="214" width="20" height="16" rx="2" fill="transparent" stroke="rgba(31,42,51,0.4)" stroke-width="0.8"/>
        <text x="58" y="226" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">6</text>
        <text x="174" y="248" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="middle" font-weight="700">Activate</text>
        <text x="174" y="268" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">SWITCH SYMLINKS</text>
        <line x1="308" y1="92" x2="356" y2="92" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="624" y1="92" x2="672" y2="92" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="806" y1="136" x2="806" y2="208" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="672" y1="252" x2="624" y2="252" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="356" y1="252" x2="308" y2="252" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="174" y1="296" x2="174" y2="352" stroke="#287A4C" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="40" y="352" width="360" height="72" rx="6" fill="#FFFFFF"/>
        <rect x="40" y="352" width="360" height="72" rx="6" fill="rgba(40,122,76,0.08)" stroke="#287A4C" stroke-width="1.4"/>
        <text x="220" y="384" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="middle" font-weight="700">A new routing identity</text>
        <text x="220" y="404" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">HASH OF GRAPH + MAP VERSION</text>
        <text x="440" y="372" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">Memory tiers are cleared and the database tier is</text>
        <text x="440" y="390" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">never read for the old identity: a changed road</text>
        <text x="440" y="408" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">network is never mixed with old legs, and every</text>
        <text x="440" y="426" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">cache starts cold.</text>
        <line x1="40" y1="464" x2="940" y2="464" stroke="rgba(31,42,51,0.1)" stroke-width="0.8"/>
        <text x="40" y="490" fill="#444444" font-size="8" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">LEGEND</text>
        <rect x="110" y="480" width="18" height="12" rx="2" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="0.8"/>
        <text x="136" y="490" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">PREPARATION STEP</text>
        <rect x="276" y="480" width="18" height="12" rx="2" fill="rgba(40,122,76,0.08)" stroke="#5A6B7A" stroke-width="0.8"/>
        <text x="302" y="490" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">THE SWITCH AND ITS CONSEQUENCE</text>
        <text x="940" y="490" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end">switching flexible and CH does it too</text>
      </svg>
    </div>
  </div>
</body>
</html>
