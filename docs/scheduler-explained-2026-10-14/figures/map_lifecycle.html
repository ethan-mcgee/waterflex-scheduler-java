<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How a map version is prepared and switched on</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #FFFFFF; --color-ink: #1F2A33; --color-muted: #444444; --color-accent: #287A4C;
      --font-sans: 'Calibri', 'Carlito', system-ui, sans-serif; --font-serif: 'Calibri', 'Carlito', serif; --font-mono: 'Consolas', 'Liberation Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1320px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1280px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">WaterFlex scheduler explained</p>
    <h1>How a map version is prepared and switched on</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1280 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="map_lifecycle-title map_lifecycle-desc">
        <title id="map_lifecycle-title">How a map version is prepared and switched on</title>
        <desc id="map_lifecycle-desc">Process of preparing a map version as a whole: the merged OpenStreetMap extract, both road graphs, tiles and TIGER address ranges, validation with preview services, activation by switching symlinks, and the new routing identity that starts every cache cold.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#444444"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#287A4C"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0B3A66"/></marker>
<marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#444444" stroke-width="1.2"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="6" stroke="#444444" stroke-width="1.2"/></pattern>
        </defs>
        <rect width="100%" height="100%" fill="#FFFFFF"/>
        <rect x="40" y="80" width="172" height="72" rx="6" fill="#FFFFFF"/>
        <rect x="40" y="80" width="172" height="72" rx="6" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>
        <rect x="48" y="86" width="20" height="16" rx="2" fill="transparent" stroke="rgba(31,42,51,0.4)" stroke-width="0.8"/>
        <text x="58" y="98" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">1</text>
        <text x="126" y="112" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="middle" font-weight="700">Extract</text>
        <text x="126" y="132" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">MERGED OSM</text>
        <rect x="246" y="80" width="172" height="72" rx="6" fill="#FFFFFF"/>
        <rect x="246" y="80" width="172" height="72" rx="6" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>
        <rect x="254" y="86" width="20" height="16" rx="2" fill="transparent" stroke="rgba(31,42,51,0.4)" stroke-width="0.8"/>
        <text x="264" y="98" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">2</text>
        <text x="332" y="112" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="middle" font-weight="700">Road graphs</text>
        <text x="332" y="132" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">FLEXIBLE + CH</text>
        <line x1="212" y1="116" x2="246" y2="116" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="452" y="80" width="172" height="72" rx="6" fill="#FFFFFF"/>
        <rect x="452" y="80" width="172" height="72" rx="6" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>
        <rect x="460" y="86" width="20" height="16" rx="2" fill="transparent" stroke="rgba(31,42,51,0.4)" stroke-width="0.8"/>
        <text x="470" y="98" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">3</text>
        <text x="538" y="112" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="middle" font-weight="700">Tiles</text>
        <text x="538" y="132" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">FOR DRAWING</text>
        <line x1="418" y1="116" x2="452" y2="116" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="658" y="80" width="172" height="72" rx="6" fill="#FFFFFF"/>
        <rect x="658" y="80" width="172" height="72" rx="6" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>
        <rect x="666" y="86" width="20" height="16" rx="2" fill="transparent" stroke="rgba(31,42,51,0.4)" stroke-width="0.8"/>
        <text x="676" y="98" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">4</text>
        <text x="744" y="112" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="middle" font-weight="700">TIGER ranges</text>
        <text x="744" y="132" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">FOR NOMINATIM</text>
        <line x1="624" y1="116" x2="658" y2="116" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="864" y="80" width="172" height="72" rx="6" fill="#FFFFFF"/>
        <rect x="864" y="80" width="172" height="72" rx="6" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>
        <rect x="872" y="86" width="20" height="16" rx="2" fill="transparent" stroke="rgba(31,42,51,0.4)" stroke-width="0.8"/>
        <text x="882" y="98" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">5</text>
        <text x="950" y="112" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="middle" font-weight="700">Validate</text>
        <text x="950" y="132" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">PREVIEW SERVICES</text>
        <line x1="830" y1="116" x2="864" y2="116" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="1070" y="80" width="172" height="72" rx="6" fill="#FFFFFF"/>
        <rect x="1070" y="80" width="172" height="72" rx="6" fill="rgba(40,122,76,0.08)" stroke="#287A4C" stroke-width="1.4"/>
        <rect x="1078" y="86" width="20" height="16" rx="2" fill="transparent" stroke="rgba(31,42,51,0.4)" stroke-width="0.8"/>
        <text x="1088" y="98" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">6</text>
        <text x="1156" y="112" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="middle" font-weight="700">Activate</text>
        <text x="1156" y="132" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">SWITCH SYMLINKS</text>
        <line x1="1036" y1="116" x2="1070" y2="116" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="246" y="188" fill="#1F2A33" font-size="14" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-style="italic">CH import: about 27 s and about 200 MiB more on disk per map version.</text>
        <line x1="1156" y1="152" x2="1156" y2="260" stroke="#287A4C" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="896" y="260" width="360" height="72" rx="6" fill="#FFFFFF"/>
        <rect x="896" y="260" width="360" height="72" rx="6" fill="rgba(40,122,76,0.08)" stroke="#287A4C" stroke-width="1.4"/>
        <text x="1076" y="292" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="middle" font-weight="700">A new routing identity</text>
        <text x="1076" y="312" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">HASH OF GRAPH + MAP VERSION</text>
        <text x="40" y="284" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">Memory tiers are cleared and the database tier is never read</text>
        <text x="40" y="302" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">for the old identity: a changed road network can never be</text>
        <text x="40" y="320" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">mixed with old legs, and every cache starts cold.</text>
        <line x1="30" y1="376" x2="1250" y2="376" stroke="rgba(31,42,51,0.1)" stroke-width="0.8"/>
        <text x="30" y="402" fill="#444444" font-size="8" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">LEGEND</text>
        <rect x="100" y="392" width="18" height="12" rx="2" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="0.8"/>
        <text x="126" y="402" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">PREPARATION STEP</text>
        <rect x="264" y="392" width="18" height="12" rx="2" fill="rgba(40,122,76,0.08)" stroke="#5A6B7A" stroke-width="0.8"/>
        <text x="290" y="402" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">THE SWITCH AND ITS CONSEQUENCE</text>
        <text x="1250" y="402" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end">a switch between flexible and CH changes the identity too</text>
      </svg>
    </div>
  </div>
</body>
</html>
