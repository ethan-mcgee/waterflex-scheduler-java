<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The four route cache tiers, in lookup order</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #FFFFFF; --color-ink: #1F2A33; --color-muted: #444444; --color-accent: #287A4C;
      --font-sans: 'Calibri', 'Carlito', system-ui, sans-serif; --font-serif: 'Calibri', 'Carlito', serif; --font-mono: 'Consolas', 'Liberation Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1320px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1280px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">WaterFlex scheduler explained</p>
    <h1>The four route cache tiers, in lookup order</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1280 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tiers-title tiers-desc">
        <title id="tiers-title">The four route cache tiers, in lookup order</title>
        <desc id="tiers-desc">Layer stack of the route cache: in-flight dedup, scheduler memory, the scheduler database and routing memory, each with its key, lifetime and who shares it.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#444444"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#287A4C"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0B3A66"/></marker>
<marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#444444" stroke-width="1.2"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="6" stroke="#444444" stroke-width="1.2"/></pattern>
        </defs>
        <rect width="100%" height="100%" fill="#FFFFFF"/>
        <line x1="160" y1="72" x2="160" y2="376" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="111.36" y="40" width="97.28" height="16" rx="2" fill="#FFFFFF"/>
        <text x="160" y="52" fill="#5A6B7A" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">LOOKUP ORDER</text>
        <rect x="200" y="64" width="1000" height="80" fill="#FFFFFF"/>
        <rect x="200" y="64" width="1000" height="80" fill="#FFFFFF" stroke="rgba(31,42,51,0.12)" stroke-width="1"/>
        <rect x="216" y="96" width="56" height="16" rx="2" fill="transparent" stroke="rgba(31,42,51,0.4)" stroke-width="0.8"/>
        <text x="244" y="108" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">TIER 1</text>
        <text x="320" y="98" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-weight="700">In-flight dedup</text>
        <text x="320" y="122" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">UNTIL THE ROUTING CALL FINISHES</text>
        <text x="1184" y="98" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end">KEY: ROUTING IDENTITY + DIRECTED PAIR</text>
        <text x="1184" y="122" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end">SHARED BY: CONCURRENT REQUESTS IN ONE REPLICA</text>
        <rect x="200" y="144" width="1000" height="80" fill="#FFFFFF"/>
        <rect x="200" y="144" width="1000" height="80" fill="#F4F6F8" stroke="rgba(31,42,51,0.12)" stroke-width="1"/>
        <rect x="216" y="176" width="56" height="16" rx="2" fill="transparent" stroke="rgba(31,42,51,0.4)" stroke-width="0.8"/>
        <text x="244" y="188" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">TIER 2</text>
        <text x="320" y="178" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-weight="700">Scheduler memory</text>
        <text x="320" y="202" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">ROUTING.CACHE.TTL-MINUTES (60) AND ROUTING.CACHE.MAX-ENTRIES (100,000)</text>
        <text x="1184" y="178" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end">KEY: DIRECTED COORDINATE PAIR + ROUTING IDENTITY</text>
        <text x="1184" y="202" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end">SHARED BY: ONE REPLICA</text>
        <rect x="200" y="224" width="1000" height="80" fill="#FFFFFF"/>
        <rect x="200" y="224" width="1000" height="80" fill="rgba(40,122,76,0.08)" stroke="#287A4C" stroke-width="1.4"/>
        <rect x="216" y="256" width="56" height="16" rx="2" fill="transparent" stroke="#287A4C" stroke-width="0.8"/>
        <text x="244" y="268" fill="#287A4C" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">TIER 3</text>
        <text x="320" y="258" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-weight="700">Scheduler database</text>
        <text x="320" y="282" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">READ ONLY IF FETCHED IN THE LAST 30 DAYS</text>
        <text x="1184" y="258" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end">KEY: (ORIGINKEY, DESTINATIONKEY, PROFILE, MAPVERSION)</text>
        <text x="1184" y="282" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end">SHARED BY: ALL REPLICAS</text>
        <rect x="200" y="304" width="1000" height="80" fill="#FFFFFF"/>
        <rect x="200" y="304" width="1000" height="80" fill="#F4F6F8" stroke="rgba(31,42,51,0.12)" stroke-width="1"/>
        <rect x="216" y="336" width="56" height="16" rx="2" fill="transparent" stroke="rgba(31,42,51,0.4)" stroke-width="0.8"/>
        <text x="244" y="348" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">TIER 4</text>
        <text x="320" y="338" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-weight="700">Routing memory</text>
        <text x="320" y="362" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">60 MINUTES, 100,000 ENTRIES</text>
        <text x="1184" y="338" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end">KEY: DIRECTED COORDINATE PAIR</text>
        <text x="1184" y="362" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end">SHARED BY: ALL CALLERS OF THAT ROUTING REPLICA</text>
        <line x1="200" y1="384" x2="1200" y2="384" stroke="#1F2A33" stroke-width="1"/>
        <text x="200" y="424" fill="#1F2A33" font-size="14" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-style="italic">every entry is bound to a routing identity (a hash of the road graph and map version), so a changed map can never be mixed with old legs;</text>
        <text x="200" y="442" fill="#1F2A33" font-size="14" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-style="italic">keys are coordinates rounded to 5 decimals (about 1 m); a leg computed by the routing service is written back to tiers 2 and 3 in a separate short transaction</text>
        <line x1="30" y1="466" x2="1250" y2="466" stroke="rgba(31,42,51,0.1)" stroke-width="0.8"/>
        <text x="30" y="492" fill="#444444" font-size="8" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">LEGEND</text>
        <rect x="100" y="482" width="18" height="12" rx="2" fill="rgba(40,122,76,0.08)" stroke="#5A6B7A" stroke-width="0.8"/>
        <text x="126" y="492" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">THE TIER ALL REPLICAS SHARE</text>
        <rect x="340" y="482" width="18" height="12" rx="2" fill="#F4F6F8" stroke="#5A6B7A" stroke-width="0.8"/>
        <text x="366" y="492" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">PER REPLICA OR PER CALLER</text>
        <text x="1250" y="492" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end">source: the design document&#x27;s route cache table</text>
      </svg>
    </div>
  </div>
</body>
</html>
