<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The scheduler as a service of its own</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #FFFFFF; --color-ink: #1F2A33; --color-muted: #444444; --color-accent: #287A4C;
      --font-sans: 'Calibri', 'Carlito', system-ui, sans-serif; --font-serif: 'Calibri', 'Carlito', serif; --font-mono: 'Consolas', 'Liberation Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1020px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 980px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">WaterFlex scheduler explained</p>
    <h1>The scheduler as a service of its own</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 980 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="stateless-title stateless-desc">
        <title id="stateless-title">The scheduler as a service of its own</title>
        <desc id="stateless-desc">WaterFlex Software keeps every record and calls the scheduler API with a snapshot; the scheduler answers with results and keeps only a thin store of its own, and the host writes its own database with a compare-and-set.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#444444"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#287A4C"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0B3A66"/></marker>
<marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#444444" stroke-width="1.2"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="6" stroke="#444444" stroke-width="1.2"/></pattern>
        </defs>
        <rect width="100%" height="100%" fill="#FFFFFF"/>
        <rect x="40" y="40" width="900" height="264" rx="8" fill="rgba(31,42,51,0.02)" stroke="rgba(31,42,51,0.35)" stroke-width="1" stroke-dasharray="6,4"/>
        <rect x="52" y="44" width="270.448" height="14" rx="2" fill="#FFFFFF"/>
        <text x="60" y="55" fill="#5A6B7A" font-size="8" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">THE STATELESS SCHEDULER: A SERVICE OF ITS OWN</text>
        <rect x="80" y="76" width="240" height="72" rx="6" fill="#FFFFFF"/>
        <rect x="80" y="76" width="240" height="72" rx="6" fill="#DCE6EF" stroke="#5A6B7A" stroke-width="1"/>
        <text x="200" y="108" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="middle" font-weight="700">WaterFlex Software</text>
        <text x="200" y="128" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">HOST · OWNS EVERY RECORD</text>
        <rect x="440" y="76" width="240" height="72" rx="6" fill="#FFFFFF"/>
        <rect x="440" y="76" width="240" height="72" rx="6" fill="#7DAFCB" stroke="#287A4C" stroke-width="1.6"/>
        <text x="560" y="108" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="middle" font-weight="700">Scheduler API</text>
        <text x="560" y="128" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">/API/V1 · 12 OPERATIONS</text>
        <rect x="80" y="196" width="240" height="88" rx="6" fill="#FFFFFF"/>
        <rect x="80" y="196" width="240" height="88" rx="6" fill="#DCE6EF" stroke="#5A6B7A" stroke-width="1"/>
        <text x="200" y="228" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="middle" font-weight="700">Host database</text>
        <text x="200" y="248" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">THE BUSINESS RECORD</text>
        <text x="200" y="264" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">LASTMODIFIED PER DAY</text>
        <rect x="440" y="196" width="240" height="88" rx="6" fill="#FFFFFF"/>
        <rect x="440" y="196" width="240" height="88" rx="6" fill="#C9C9C9" stroke="#5A6B7A" stroke-width="1"/>
        <text x="560" y="228" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="middle" font-weight="700">Thin store</text>
        <text x="560" y="248" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">ITS OWN POSTGRES</text>
        <text x="560" y="264" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">TENANTS · ROW SECURITY</text>
        <line x1="320" y1="100" x2="440" y2="100" stroke="#0B3A66" stroke-width="1.4" marker-end="url(#arrow-link)"/>
        <rect x="348.72" y="78" width="62.56" height="16" rx="2" fill="#FFFFFF"/>
        <text x="380" y="90" fill="#0B3A66" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SNAPSHOT</text>
        <line x1="440" y1="128" x2="320" y2="128" stroke="#444444" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="352.13" y="140" width="55.74" height="16" rx="2" fill="#FFFFFF"/>
        <text x="380" y="152" fill="#5A6B7A" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RESULTS</text>
        <line x1="200" y1="148" x2="200" y2="196" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="212" y="165" width="110.3" height="16" rx="2" fill="#FFFFFF"/>
        <text x="212" y="177" fill="#5A6B7A" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">COMPARE-AND-SET</text>
        <line x1="560" y1="148" x2="560" y2="196" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="572" y="165" width="110.3" height="16" rx="2" fill="#FFFFFF"/>
        <text x="572" y="177" fill="#5A6B7A" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">HOLDS, RECEIPTS</text>
        <text x="720" y="108" fill="#1F2A33" font-size="14" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-style="italic">Every call carries the</text>
        <text x="720" y="126" fill="#1F2A33" font-size="14" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-style="italic">facts it needs; nothing</text>
        <text x="720" y="144" fill="#1F2A33" font-size="14" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-style="italic">is copied, synced or</text>
        <text x="720" y="162" fill="#1F2A33" font-size="14" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-style="italic">scheduled by the</text>
        <text x="720" y="180" fill="#1F2A33" font-size="14" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-style="italic">scheduler itself.</text>
        <line x1="40" y1="324" x2="940" y2="324" stroke="rgba(31,42,51,0.1)" stroke-width="0.8"/>
        <text x="40" y="350" fill="#444444" font-size="8" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">LEGEND</text>
        <rect x="110" y="340" width="18" height="12" rx="2" fill="#DCE6EF" stroke="#5A6B7A" stroke-width="0.8"/>
        <text x="136" y="350" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">WATERFLEX SOFTWARE</text>
        <rect x="288" y="340" width="18" height="12" rx="2" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="0.8"/>
        <text x="314" y="350" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">SCHEDULER</text>
        <rect x="404" y="340" width="18" height="12" rx="2" fill="#C9C9C9" stroke="#5A6B7A" stroke-width="0.8"/>
        <text x="430" y="350" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">DATABASE</text>
        <line x1="512" y1="346" x2="548" y2="346" stroke="#0B3A66" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="558" y="350" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">HTTPS CALL</text>
      </svg>
    </div>
  </div>
</body>
</html>
