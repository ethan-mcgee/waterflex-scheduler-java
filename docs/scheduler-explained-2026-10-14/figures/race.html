<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How a late snapshot lost holds, and how rule 0 stops it</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #FFFFFF; --color-ink: #1F2A33; --color-muted: #444444; --color-accent: #287A4C;
      --font-sans: 'Calibri', 'Carlito', system-ui, sans-serif; --font-serif: 'Calibri', 'Carlito', serif; --font-mono: 'Consolas', 'Liberation Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1320px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1280px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">WaterFlex scheduler explained</p>
    <h1>How a late snapshot lost holds, and how rule 0 stops it</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1280 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="race-title race-desc">
        <title id="race-title">How a late snapshot lost holds, and how rule 0 stops it</title>
        <desc id="race-desc">Sequence of two booking desks and the scheduler: desk B confirms and the day moves on; desk A&#x27;s request, built from older records, arrives late. Before #152 rule 3 read it as a host edit and lost every hold on the date; with rule 0 it is answered 409 STALE and nothing is lost.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#444444"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#287A4C"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0B3A66"/></marker>
<marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#444444" stroke-width="1.2"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="6" stroke="#444444" stroke-width="1.2"/></pattern>
        </defs>
        <rect width="100%" height="100%" fill="#FFFFFF"/>
        <rect x="80" y="32" width="240" height="56" rx="6" fill="#FFFFFF"/>
        <rect x="80" y="32" width="240" height="56" rx="6" fill="#DCE6EF" stroke="#5A6B7A" stroke-width="1"/>
        <text x="200" y="56" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="middle" font-weight="700">Desk A</text>
        <text x="200" y="76" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">BUILT ITS SNAPSHOT EARLY</text>
        <rect x="440" y="32" width="240" height="56" rx="6" fill="#FFFFFF"/>
        <rect x="440" y="32" width="240" height="56" rx="6" fill="#DCE6EF" stroke="#5A6B7A" stroke-width="1"/>
        <text x="560" y="56" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="middle" font-weight="700">Desk B</text>
        <text x="560" y="76" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">CONFIRMS FIRST</text>
        <rect x="880" y="32" width="240" height="56" rx="6" fill="#FFFFFF"/>
        <rect x="880" y="32" width="240" height="56" rx="6" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>
        <text x="1000" y="56" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="middle" font-weight="700">Scheduler</text>
        <text x="1000" y="76" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">THE DATE&#x27;S ARRANGEMENT</text>
        <line x1="200" y1="88" x2="200" y2="620" stroke="rgba(31,42,51,0.2)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="560" y1="88" x2="560" y2="620" stroke="rgba(31,42,51,0.2)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="1000" y1="88" x2="1000" y2="620" stroke="rgba(31,42,51,0.2)" stroke-width="1" stroke-dasharray="3,3"/>
        <rect x="212" y="114" width="137.58" height="16" rx="2" fill="#FFFFFF"/>
        <text x="212" y="126" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">READS THE DAY AT T1</text>
        <line x1="564" y1="164" x2="996" y2="164" stroke="#0B3A66" stroke-width="1.4" marker-end="url(#arrow-link)"/>
        <rect x="724.85" y="144" width="110.3" height="16" rx="2" fill="#FFFFFF"/>
        <text x="780" y="156" fill="#0B3A66" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CONFIRM WITH T1</text>
        <line x1="996" y1="204" x2="564" y2="204" stroke="#444444" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <text x="780" y="196" fill="#5A6B7A" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">200 RECEIPT · THE DAY MOVES TO T2</text>
        <line x1="204" y1="252" x2="996" y2="252" stroke="#0B3A66" stroke-width="1.4" marker-end="url(#arrow-link)"/>
        <rect x="617.11" y="232" width="205.78" height="16" rx="2" fill="#FFFFFF"/>
        <text x="720" y="244" fill="#0B3A66" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SEARCH WITH T1, ARRIVING LATE</text>
        <rect x="120" y="280" width="1020" height="300" rx="4" fill="rgba(31,42,51,0.02)" stroke="rgba(31,42,51,0.22)" stroke-width="1"/>
        <rect x="120" y="280" width="40" height="16" rx="2" fill="#FFFFFF" stroke="rgba(31,42,51,0.22)" stroke-width="1"/>
        <text x="140" y="292" fill="#444444" font-size="8" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>
        <text x="132" y="316" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">[BEFORE #152]</text>
        <rect x="673.1" y="340" width="314.9" height="16" rx="2" fill="#FFFFFF"/>
        <text x="988" y="352" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.06em">T1 IS NOT T2: LOOKS LIKE A HOST EDIT (RULE 3)</text>
        <line x1="996" y1="388" x2="204" y2="388" stroke="#444444" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="473.24" y="368" width="253.52" height="16" rx="2" fill="#FFFFFF"/>
        <text x="600" y="380" fill="#9c6b50" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">OFFERS · EVERY HOLD ON THE DATE LOST</text>
        <text x="572" y="412" fill="#9c6b50" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">B&#x27;s next customer finds its hold gone: 409 HOLD_UNAVAILABLE</text>
        <line x1="128" y1="436" x2="1132" y2="436" stroke="rgba(31,42,51,0.2)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="132" y="460" fill="#287A4C" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">[WITH RULE 0]</text>
        <rect x="673.1" y="482" width="314.9" height="16" rx="2" fill="#FFFFFF"/>
        <text x="988" y="494" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.06em">T1 IS AMONG THE LAST 32 TIMESTAMPS MOVED PAST</text>
        <line x1="996" y1="530" x2="204" y2="530" stroke="#287A4C" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="445.96" y="510" width="308.08" height="16" rx="2" fill="#FFFFFF"/>
        <text x="600" y="522" fill="#287A4C" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">409 STALE · NOTHING RECONCILED, NOTHING LOST</text>
        <text x="212" y="556" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">A rebuilds from current records and resends</text>
        <text x="160" y="616" fill="#1F2A33" font-size="14" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-style="italic">Any host with several desks produces such late requests; the cost of rule 0 is a resend, never a lost customer.</text>
        <line x1="30" y1="650" x2="1250" y2="650" stroke="rgba(31,42,51,0.1)" stroke-width="0.8"/>
        <text x="30" y="676" fill="#444444" font-size="8" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">LEGEND</text>
        <line x1="100" y1="672" x2="136" y2="672" stroke="#0B3A66" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="146" y="676" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">CALL</text>
        <line x1="204" y1="672" x2="240" y2="672" stroke="#444444" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="250" y="676" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">REPLY</text>
        <line x1="312" y1="672" x2="348" y2="672" stroke="#287A4C" stroke-width="1.6"/>
        <text x="358" y="676" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">THE RULE THAT KEEPS HOLDS</text>
        <text x="1250" y="676" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end">the comparison is still exact equality, never ordering</text>

  </div>
