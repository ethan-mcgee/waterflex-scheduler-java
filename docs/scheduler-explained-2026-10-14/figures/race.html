<!DOCTYPE html>

<head>

  <title>How a late snapshot lost holds, and how rule 0 stops it</title>
  <style>

    .frame { max-width: 1020px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 980px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">WaterFlex scheduler explained</p>
    <h1>How a late snapshot lost holds, and how rule 0 stops it</h1>

        <desc id="race-desc">Sequence of two booking desks and the scheduler: desk B confirms and the day moves on; desk A&#x27;s request, built from older records, arrives late. Before #152 rule 3 read it as a host edit and lost every hold on the date; with rule 0 it is answered 409 STALE and nothing is lost.</desc>

<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0B3A66"/></marker>

        <rect x="300" y="32" width="240" height="56" rx="6" fill="#FFFFFF"/>

        <text x="728" y="352" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.06em">T1 IS NOT T2: LOOKS LIKE A HOST EDIT (RULE 3)</text>
        <line x1="736" y1="388" x2="154" y2="388" stroke="#444444" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="318.24" y="366" width="253.52" height="16" rx="2" fill="#FFFFFF"/>

        <text x="432" y="430" fill="#9c6b50" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">GONE: 409 HOLD_UNAVAILABLE</text>
        <line x1="108" y1="452" x2="792" y2="452" stroke="rgba(31,42,51,0.2)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="112" y="476" fill="#287A4C" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">[WITH RULE 0]</text>
        <rect x="413.1" y="496" width="314.9" height="16" rx="2" fill="#FFFFFF"/>
        <text x="728" y="508" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.06em">T1 IS AMONG THE LAST 32 TIMESTAMPS MOVED PAST</text>
        <line x1="736" y1="544" x2="154" y2="544" stroke="#287A4C" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="290.96" y="522" width="308.08" height="16" rx="2" fill="#FFFFFF"/>
        <text x="445" y="534" fill="#287A4C" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">409 STALE · NOTHING RECONCILED, NOTHING LOST</text>
        <rect x="162" y="560" width="301.26" height="16" rx="2" fill="#FFFFFF"/>
        <text x="162" y="572" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">A REBUILDS FROM CURRENT RECORDS AND RESENDS</text>
        <text x="100" y="636" fill="#1F2A33" font-size="14" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-style="italic">Any host with several desks produces such late requests; the cost of rule 0 is a resend,</text>

        <text x="366" y="710" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">THE RULE THAT KEEPS HOLDS</text>
        <text x="940" y="710" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end">still exact equality, never ordering</text>

  </div>
