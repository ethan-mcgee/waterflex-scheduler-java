<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Why a remote engine costs booking more than it saves</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #FFFFFF; --color-ink: #1F2A33; --color-muted: #444444; --color-accent: #287A4C;
      --font-sans: 'Calibri', 'Carlito', system-ui, sans-serif; --font-serif: 'Calibri', 'Carlito', serif; --font-mono: 'Consolas', 'Liberation Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1320px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1280px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">WaterFlex scheduler explained</p>
    <h1>Why a remote engine costs booking more than it saves</h1>

        <desc id="round_trips-desc">Left: an embedded booking search calls the engine in process. Right: with a remote pool each of up to three engine calls (insertion, refinement, the retry on a moved day) encodes a snapshot, sends it, waits and decodes the answer; the engine share of a search grows accordingly.</desc>

        <text x="160" y="100" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="middle" font-weight="700">Booking replica</text>
        <line x1="160" y1="120" x2="160" y2="470" stroke="rgba(31,42,51,0.2)" stroke-width="1" stroke-dasharray="3,3"/>

        <line x1="784" y1="368" x2="1116" y2="368" stroke="#0B3A66" stroke-width="1.4" marker-end="url(#arrow-link)"/>
        <rect x="819.83" y="348" width="260.34" height="16" rx="2" fill="#FFFFFF"/>

        <line x1="1116" y1="408" x2="784" y2="408" stroke="#444444" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="888.03" y="388" width="123.94" height="16" rx="2" fill="#FFFFFF"/>
        <text x="950" y="400" fill="#5A6B7A" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">DECODE THE ANSWER</text>
        <rect x="660" y="480" width="560" height="76" rx="6" fill="#FFFFFF"/>
        <rect x="660" y="480" width="560" height="76" rx="6" fill="#FFFFFF" stroke="rgba(31,42,51,0.18)" stroke-width="1"/>
        <text x="676" y="502" fill="#5A6B7A" font-size="8" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">ENGINE TIME OF A SEARCH, P50</text>
        <text x="676" y="530" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">69 ms of 367 ms on the server · 703 searches in 60 s</text>
        <line x1="30" y1="576" x2="1250" y2="576" stroke="rgba(31,42,51,0.1)" stroke-width="0.8"/>
