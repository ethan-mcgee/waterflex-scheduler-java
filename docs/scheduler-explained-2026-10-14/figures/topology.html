<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Where the scheduler runs</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #FFFFFF;
      --color-ink:     #1F2A33;
      --color-muted:   #444444;
      --color-accent:  #287A4C;
      --font-sans:     'Calibri', 'Carlito', system-ui, sans-serif;
      --font-serif:    'Calibri', 'Carlito', serif;
      --font-mono:     'Consolas', 'Liberation Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1320px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · WaterFlex scheduler explained, figure 1</p>
    <h1>Where the scheduler runs</h1>

    <div class="diagram-container">
      <svg viewBox="0 32 1280 624" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="topology-title topology-desc">
        <title id="topology-title">Where the scheduler runs</title>
        <desc id="topology-desc">The WaterFlex Software backend calls one address on the scheduler VM; behind it a proxy sends booking calls to the booking pool and proposals to the daily pool, and every replica reaches a routing service per metro, an optional Nominatim and the scheduler's own database.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#444444"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#287A4C"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0B3A66"/></marker>
        </defs>

        <rect x="0" y="32" width="1280" height="624" fill="#FFFFFF"/>

        <!-- Zone: the scheduler VM (trust boundary) -->
        <rect x="360" y="72" width="888" height="520" rx="8" fill="rgba(31,42,51,0.02)" stroke="rgba(31,42,51,0.35)" stroke-width="1" stroke-dasharray="6,4"/>
        <rect x="372" y="76" width="476" height="14" rx="2" fill="#FFFFFF"/>
        <text x="380" y="87" fill="#5A6B7A" font-size="8" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" font-weight="500" letter-spacing="0.14em">SCHEDULER VM · PRIVATE NETWORK · PARTITIONED CPU AND MEMORY · ONE JAR, MANY REPLICAS</text>

        <!-- Arrows (drawn before nodes) -->
        <!-- Host to proxy: the HTTPS call, and the dashed return -->
        <line x1="280" y1="136" x2="400" y2="136" stroke="#0B3A66" stroke-width="1.4" marker-end="url(#arrow-link)"/>
        <rect x="292" y="108" width="96" height="16" rx="2" fill="#FFFFFF"/>
        <text x="340" y="120" fill="#0B3A66" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS /API/V1</text>
        <line x1="400" y1="168" x2="280" y2="168" stroke="#444444" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="308" y="180" width="64" height="16" rx="2" fill="#FFFFFF"/>
        <text x="340" y="192" fill="#5A6B7A" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RESULTS</text>

        <!-- Proxy to the two pools -->
        <line x1="496" y1="200" x2="496" y2="356" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="504" y="268" width="108" height="16" rx="2" fill="#FFFFFF"/>
        <text x="558" y="280" fill="#5A6B7A" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">BOOKING CALLS</text>
        <line x1="1136" y1="200" x2="1136" y2="356" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="1144" y="268" width="80" height="16" rx="2" fill="#FFFFFF"/>
        <text x="1184" y="280" fill="#5A6B7A" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PROPOSALS</text>

        <!-- Booking pool to the three shared pieces (fanned ports on its right edge) -->
        <path d="M592,380 H616 Q624,380 624,372 V300 Q624,292 632,292 H712" fill="none" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="592" y1="404" x2="712" y2="404" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M592,428 H648 Q656,428 656,436 V508 Q656,516 664,516 H712" fill="none" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Daily pool to the same three (fanned ports on its left edge) -->
        <path d="M1040,380 H1016 Q1008,380 1008,372 V300 Q1008,292 1000,292 H920" fill="none" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="1040" y1="404" x2="920" y2="404" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M1040,428 H984 Q976,428 976,436 V508 Q976,516 968,516 H920" fill="none" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Node: the host -->
        <rect x="40" y="104" width="240" height="96" rx="6" fill="#FFFFFF"/>
        <rect x="40" y="104" width="240" height="96" rx="6" fill="#DCE6EF" stroke="#5A6B7A" stroke-width="1"/>
        <rect x="48" y="110" width="40" height="16" rx="2" fill="transparent" stroke="rgba(90,107,122,0.40)" stroke-width="0.8"/>
        <text x="68" y="122" fill="#5A6B7A" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">HOST</text>
        <text x="160" y="152" fill="#1F2A33" font-size="16" font-weight="700" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="middle">WaterFlex Software</text>
        <text x="160" y="176" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">MASTER DATA · LASTMODIFIED</text>

        <!-- Node: the proxy (focal: the one address) -->
        <rect x="400" y="104" width="832" height="96" rx="6" fill="#FFFFFF"/>
        <rect x="400" y="104" width="832" height="96" rx="6" fill="#7DAFCB" stroke="#287A4C" stroke-width="1.6"/>
        <rect x="408" y="110" width="48" height="16" rx="2" fill="transparent" stroke="rgba(40,122,76,0.50)" stroke-width="0.8"/>
        <text x="432" y="122" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">ENTRY</text>
        <text x="816" y="152" fill="#1F2A33" font-size="16" font-weight="700" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="middle">scheduler-proxy</text>
        <text x="816" y="176" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">NGINX :8000 · THE ONE ADDRESS A HOST CALLS</text>

        <!-- Node: booking pool -->
        <rect x="400" y="356" width="192" height="96" rx="6" fill="#FFFFFF"/>
        <rect x="400" y="356" width="192" height="96" rx="6" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>
        <rect x="408" y="362" width="40" height="16" rx="2" fill="transparent" stroke="rgba(31,42,51,0.40)" stroke-width="0.8"/>
        <text x="428" y="374" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">POOL</text>
        <text x="496" y="400" fill="#1F2A33" font-size="16" font-weight="700" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="middle">Booking pool</text>
        <text x="496" y="420" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">REPLICAS OF ONE JAR</text>
        <text x="496" y="436" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">EMBEDDED ENGINE</text>

        <!-- Node: daily pool -->
        <rect x="1040" y="356" width="192" height="96" rx="6" fill="#FFFFFF"/>
        <rect x="1040" y="356" width="192" height="96" rx="6" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>
        <rect x="1048" y="362" width="40" height="16" rx="2" fill="transparent" stroke="rgba(31,42,51,0.40)" stroke-width="0.8"/>
        <text x="1068" y="374" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">POOL</text>
        <text x="1136" y="400" fill="#1F2A33" font-size="16" font-weight="700" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="middle">Daily pool</text>
        <text x="1136" y="420" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">REPLICAS OF ONE JAR</text>
        <text x="1136" y="436" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">EMBEDDED ENGINE</text>

        <!-- Node: routing service -->
        <rect x="712" y="256" width="208" height="72" rx="6" fill="#FFFFFF"/>
        <rect x="712" y="256" width="208" height="72" rx="6" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>
        <rect x="720" y="262" width="76" height="16" rx="2" fill="transparent" stroke="rgba(31,42,51,0.40)" stroke-width="0.8"/>
        <text x="758" y="274" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">PER METRO</text>
        <text x="816" y="298" fill="#1F2A33" font-size="16" font-weight="700" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="middle">Routing service</text>
        <text x="816" y="316" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">CH ROAD GRAPH</text>

        <!-- Node: Nominatim (optional) -->
        <rect x="712" y="368" width="208" height="72" rx="6" fill="#FFFFFF"/>
        <rect x="712" y="368" width="208" height="72" rx="6" fill="#F4F6F8" stroke="#5A6B7A" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="720" y="374" width="68" height="16" rx="2" fill="transparent" stroke="rgba(31,42,51,0.40)" stroke-width="0.8"/>
        <text x="754" y="386" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">OPTIONAL</text>
        <text x="816" y="410" fill="#1F2A33" font-size="16" font-weight="700" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="middle">Nominatim</text>
        <text x="816" y="428" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">EXACT HOUSE GEOCODER</text>

        <!-- Node: scheduler-db -->
        <rect x="712" y="480" width="208" height="72" rx="6" fill="#FFFFFF"/>
        <rect x="712" y="480" width="208" height="72" rx="6" fill="#C9C9C9" stroke="#5A6B7A" stroke-width="1"/>
        <rect x="720" y="486" width="68" height="16" rx="2" fill="transparent" stroke="rgba(31,42,51,0.40)" stroke-width="0.8"/>
        <text x="754" y="498" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">POSTGRES</text>
        <text x="816" y="522" fill="#1F2A33" font-size="16" font-weight="700" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="middle">scheduler-db</text>
        <text x="816" y="540" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">THIN STORE · ROUTE CACHE</text>

        <!-- Node: management port (private, not behind the proxy) -->
        <rect x="1040" y="496" width="192" height="64" rx="6" fill="#FFFFFF"/>
        <rect x="1040" y="496" width="192" height="64" rx="6" fill="#F4F6F8" stroke="#5A6B7A" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="1048" y="502" width="60" height="16" rx="2" fill="transparent" stroke="rgba(31,42,51,0.40)" stroke-width="0.8"/>
        <text x="1078" y="514" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">PRIVATE</text>
        <text x="1136" y="534" fill="#1F2A33" font-size="16" font-weight="700" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="middle">Management port</text>
        <text x="1136" y="550" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">:9000 · HEALTH, METRICS</text>

        <!-- Callout: the boundary, as an aside under the host -->
        <text x="40" y="244" fill="#1F2A33" font-size="14" font-style="italic" font-family="'Calibri', 'Carlito', serif">nothing else connects: no shared database,</text>
        <text x="40" y="262" fill="#1F2A33" font-size="14" font-style="italic" font-family="'Calibri', 'Carlito', serif">no client library, no callbacks</text>

        <!-- Legend strip -->
        <line x1="30" y1="612" x2="1250" y2="612" stroke="rgba(31,42,51,0.10)" stroke-width="0.8"/>
        <text x="30" y="638" fill="#444444" font-size="8" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="100" y="628" width="18" height="12" rx="2" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="0.8"/>
        <text x="126" y="638" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace">SCHEDULER SERVICE</text>
        <rect x="272" y="628" width="18" height="12" rx="2" fill="#C9C9C9" stroke="#5A6B7A" stroke-width="0.8"/>
        <text x="298" y="638" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace">STORE</text>
        <rect x="360" y="628" width="18" height="12" rx="2" fill="#DCE6EF" stroke="#5A6B7A" stroke-width="0.8"/>
        <text x="386" y="638" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace">HOST SYSTEM</text>
        <rect x="492" y="628" width="18" height="12" rx="2" fill="#F4F6F8" stroke="#5A6B7A" stroke-width="0.8" stroke-dasharray="3,2"/>
        <text x="518" y="638" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace">OPTIONAL OR PRIVATE</text>
        <line x1="680" y1="634" x2="716" y2="634" stroke="#0B3A66" stroke-width="1.4" marker-end="url(#arrow-link)"/>
        <text x="726" y="638" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace">HTTPS CALL</text>
        <line x1="824" y1="634" x2="860" y2="634" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="870" y="638" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace">INTERNAL CALL</text>
        <line x1="988" y1="634" x2="1024" y2="634" stroke="#444444" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="1034" y="638" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace">RETURN</text>
      </svg>
    </div>
  </div>
</body>
</html>
