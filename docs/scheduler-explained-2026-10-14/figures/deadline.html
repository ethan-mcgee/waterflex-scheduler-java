<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Inside the deadline: when the second pass runs, and how it ends</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #FFFFFF; --color-ink: #1F2A33; --color-muted: #444444; --color-accent: #287A4C;

      display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1320px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1280px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>

    <p class="eyebrow">WaterFlex scheduler explained</p>

        <rect x="960" y="384" width="290" height="72" rx="6" fill="#F4F6F8" stroke="#5A6B7A" stroke-width="1"/>

        <text x="1105" y="436" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">INSERTION OFFERS PUBLISHED</text>

        <text x="895" y="410" fill="#5A6B7A" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
        <path d="M380,420 L522,420 Q530,420 530,428 L530,616 Q530,624 538,624 L1097,624 Q1105,624 1105,616 L1105,456" fill="none" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>

        <rect x="279.77" y="500" width="28.46" height="16" rx="2" fill="#FFFFFF"/>
        <text x="294" y="512" fill="#5A6B7A" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
        <text x="960" y="160" fill="#1F2A33" font-size="14" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-style="italic">Every path publishes offers that</text>

        <text x="960" y="196" fill="#1F2A33" font-size="14" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-style="italic">nothing unchecked is offered.</text>
