<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Many clients in one database: the guards, layer by layer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #FFFFFF; --color-ink: #1F2A33; --color-muted: #444444; --color-accent: #287A4C;
      --font-sans: 'Calibri', 'Carlito', system-ui, sans-serif; --font-serif: 'Calibri', 'Carlito', serif; --font-mono: 'Consolas', 'Liberation Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1020px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 980px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">WaterFlex scheduler explained</p>
    <h1>Many clients in one database: the guards, layer by layer</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 980 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="isolation-title isolation-desc">
        <title id="isolation-title">Many clients in one database: the guards, layer by layer</title>
        <desc id="isolation-desc">Layer stack of the guards that keep tenants apart: the token decides the tenant, every key starts with the tenant, row-level security fails closed, the runtime login has least privilege, and admission takes turns by client.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#444444"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#287A4C"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0B3A66"/></marker>
<marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#444444" stroke-width="1.2"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="6" stroke="#444444" stroke-width="1.2"/></pattern>
        </defs>
        <rect width="100%" height="100%" fill="#FFFFFF"/>
        <line x1="96" y1="64" x2="96" y2="428" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="73.31" y="28" width="69.38" height="16" rx="2" fill="#FFFFFF"/>
        <text x="108" y="40" fill="#5A6B7A" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">A REQUEST</text>
        <rect x="140" y="56" width="800" height="76" fill="#FFFFFF"/>
        <rect x="140" y="56" width="800" height="76" fill="#FFFFFF" stroke="rgba(31,42,51,0.12)" stroke-width="1"/>
        <rect x="156" y="86" width="48" height="16" rx="2" fill="transparent" stroke="rgba(31,42,51,0.4)" stroke-width="0.8"/>
        <text x="180" y="98" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">TOKEN</text>
        <text x="240" y="90" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-weight="700">The token decides the tenant</text>
        <text x="240" y="112" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">A REQUEST NEVER NAMES ONE · REVOKED OR DISABLED IS 401 · TOKENS STORED AS SHA-256</text>
        <rect x="140" y="132" width="800" height="76" fill="#FFFFFF"/>
        <rect x="140" y="132" width="800" height="76" fill="#F4F6F8" stroke="rgba(31,42,51,0.12)" stroke-width="1"/>
        <rect x="156" y="162" width="40" height="16" rx="2" fill="transparent" stroke="rgba(31,42,51,0.4)" stroke-width="0.8"/>
        <text x="176" y="174" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">KEYS</text>
        <text x="240" y="166" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-weight="700">Tenant on every row</text>
        <text x="240" y="188" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">TENANT_ID STARTS EVERY KEY AND INDEX · TWO CLIENTS CAN BOTH HAVE TECHNICIAN 42</text>
        <rect x="140" y="208" width="800" height="76" fill="#FFFFFF"/>
        <rect x="140" y="208" width="800" height="76" fill="rgba(40,122,76,0.08)" stroke="#287A4C" stroke-width="1.4"/>
        <rect x="156" y="238" width="32" height="16" rx="2" fill="transparent" stroke="#287A4C" stroke-width="0.8"/>
        <text x="172" y="250" fill="#287A4C" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">RLS</text>
        <text x="240" y="242" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-weight="700">Row-level security</text>
        <text x="240" y="264" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">EACH TRANSACTION SETS APP.TENANT_ID · AN UNSET TENANT SEES NOTHING</text>
        <rect x="140" y="284" width="800" height="76" fill="#FFFFFF"/>
        <rect x="140" y="284" width="800" height="76" fill="#F4F6F8" stroke="rgba(31,42,51,0.12)" stroke-width="1"/>
        <rect x="156" y="314" width="48" height="16" rx="2" fill="transparent" stroke="rgba(31,42,51,0.4)" stroke-width="0.8"/>
        <text x="180" y="326" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">ROLES</text>
        <text x="240" y="318" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-weight="700">Least privilege</text>
        <text x="240" y="340" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">RUNTIME LOGIN IS SCHEDULER_APP, NEVER THE OWNER · MIGRATIONS RUN AS THE OWNER</text>
        <rect x="140" y="360" width="800" height="76" fill="#FFFFFF"/>
        <rect x="140" y="360" width="800" height="76" fill="#FFFFFF" stroke="rgba(31,42,51,0.12)" stroke-width="1"/>
        <rect x="156" y="390" width="48" height="16" rx="2" fill="transparent" stroke="rgba(31,42,51,0.4)" stroke-width="0.8"/>
        <text x="180" y="402" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">TURNS</text>
        <text x="240" y="394" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-weight="700">Fair turns</text>
        <text x="240" y="416" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">ADMISSION AND THE QUEUE START THE CLIENT WAITING LONGEST · NO CLIENT STARVES ANOTHER</text>
        <line x1="140" y1="436" x2="940" y2="436" stroke="#1F2A33" stroke-width="1"/>
        <text x="140" y="476" fill="#1F2A33" font-size="14" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-style="italic">A missed filter in application code fails closed: the database itself refuses another tenant&#x27;s rows.</text>
        <text x="140" y="494" fill="#1F2A33" font-size="14" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-style="italic">Road legs are not tenant data: they are shared by every client in a metro, kept at</text>
        <text x="140" y="512" fill="#1F2A33" font-size="14" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-style="italic">about 1 m and purged within 30 days.</text>
        <line x1="40" y1="564" x2="940" y2="564" stroke="rgba(31,42,51,0.1)" stroke-width="0.8"/>
        <text x="40" y="590" fill="#444444" font-size="8" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">LEGEND</text>
        <rect x="110" y="580" width="18" height="12" rx="2" fill="rgba(40,122,76,0.08)" stroke="#5A6B7A" stroke-width="0.8"/>
        <text x="136" y="590" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">THE LAYER THAT FAILS CLOSED</text>
        <rect x="348" y="580" width="18" height="12" rx="2" fill="#F4F6F8" stroke="#5A6B7A" stroke-width="0.8"/>
        <text x="374" y="590" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">GUARD</text>
      </svg>
    </div>
  </div>
</body>
</html>
