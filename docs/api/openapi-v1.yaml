openapi: 3.1.0
info:
  title: WaterFlex Scheduler public API
  version: 1.4.1
  summary: Stateless scheduling and booking for WaterFlex Software.
  description: |
    Version 1 of the scheduler's public contract. docs/integration-guide.md shows how to use it; the design is in
    docs/stateless-api-design.md.

    WaterFlex Software owns all master data and the business record. Every calculating call carries a
    snapshot of the facts it needs. The scheduler keeps only holds, offers, proposals and receipts.

    Conventions:
    - The tenant is derived from the bearer token. Requests never name a tenant.
    - Every write carries a host `requestId` (UUID) used as an idempotency key across all of the tenant's endpoints.
    - IDs are WaterFlex Software IDs, opaque strings.
    - Money and rates are canonical decimal strings, never JSON numbers.
    - Instants are RFC 3339 with an offset; service dates are calendar dates in the metro's time zone.
    - Unknown fields, duplicate keys and missing required values are rejected with 400.
    - Each technician-day carries the host `lastModified` timestamp. A commit whose timestamps differ from
      the ones a proposal was computed from gets 409, and nothing is changed. A confirm sends the hold's
      date as a new snapshot instead, and the scheduler reconciles its holds with it. A booking search or confirm
      whose snapshot carries a timestamp older than one the scheduler already used for that technician-day (a
      request built before a later write, arriving late) gets 409 STALE; send current records with a new requestId.
    - Overtime is never assigned.
    - Requests, proposals, offers and receipts are kept for the deployment's retention period
      (`SCHEDULER_RETENTION_DAYS`), then purged. Repeating a `requestId` older than that period runs it as a new request.

    Every operation is marked `x-implementation: implemented`; an operation specified before it is served is marked
    `planned`.

    Versioning: within v1, changes are additive only (a new operation, optional request field, response field, error
    code or enum value) and raise the minor version; each is listed below and in the change table of
    docs/stateless-api-design.md before it is deployed. A reader that rejects unknown response fields takes each new
    minor version before the scheduler is upgraded. A breaking change is published as /api/v2 beside v1, never in place.

    Version history:
    - 1.4.1 (2026-10-13): cancelRequest reaches every call in progress from any replica, so a load balancer may send
      it anywhere: a replica that does not run the call records the cancel, and the replica running it stops the call
      within a second. No schema changes.
    - 1.4.0 (2026-10-13): createDailyProposal and createRepairProposal accept the optional request header
      `Prefer: respond-async`: the request is queued and answered 202 at once with a RequestStatus, and the host polls
      the new getRequest (GET /api/v1/requests/{requestId}) for its answer. Queued requests are taken by any replica,
      round-robin across tenants. cancelRequest also cancels a queued request from any replica. Without the header,
      both operations behave as before.
    - 1.3.0 (2026-10-13): OfferSet gains incompleteDates, the horizon dates where a pass the offers need did not
      finish. refinement gains SHED: an optional refinement skipped because other booking requests were waiting for
      a slot. Policy gains the optional bookingRefinementMs, the client's own budget for an optional refinement.
    - 1.2.0 (2026-10-13): OfferSet gains refinement (COMPLETE, SHORTENED, SKIPPED or UNAVAILABLE), saying how the
      booking search's second pass ended. searchComplete keeps its meaning and is now false only when the deadline
      or a failure stopped a pass the offers need; an optional refinement cut short at its cap no longer clears it.
    - 1.1.0 (2026-10-13): createBookingOffers and confirmBookingHold answer 409 STALE (a StaleProblem listing the
      newest timestamp seen for each technician-day) when the snapshot is older than records already used, instead
      of reading the older routes as a host change and losing the date's holds.
    - 1.0.0 (2026-10-13): the first stable contract. It is the draft as last changed, with every operation served; the
      draft's changes are listed in the change table of docs/stateless-api-design.md.
servers:
  - url: https://{schedulerHost}
    description: >-
      The scheduler VM's API address on WaterFlex Software's private network, supplied by the host. TLS is a
      precondition of production traffic (docs/integration-guide.md, step 10).
    variables:
      schedulerHost:
        default: scheduler.internal.example
        description: Host name and port of the scheduler API (placeholder).
security:
  - tenantToken: []
tags:
  - name: Integration
  - name: Daily
  - name: Booking
  - name: Repair
paths:
  /api/v1/whoami:
    get:
      operationId: whoami
      tags: [Integration]
      summary: Return the tenant that the bearer token belongs to.
      x-implementation: implemented
      responses:
        '200':
          description: Token is active.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WhoAmI' }
              examples:
                tenant: { value: { tenantId: acme-water } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/daily/proposals:
    post:
      operationId: createDailyProposal
      tags: [Daily]
      summary: Propose optimized routes for one metro day.
      description: >-
        Technician-days whose locations cannot be resolved are left exactly as they are and listed in
        skippedTechnicianDays; every other technician-day is still optimized. Routes are frozen from 6 a.m.
        local time on the service date. Repeating a request with the same requestId replays the stored result.
        With `Prefer: respond-async` the request is queued and answered 202; poll getRequest for its answer.
      x-implementation: implemented
      parameters:
        - $ref: '#/components/parameters/Prefer'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DailyProposalRequest' }
            examples:
              oneDay: { $ref: '#/components/examples/DailyProposalRequest' }
      responses:
        '201':
          description: Proposal stored; it can be committed until any technician-day it covers changes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailyProposal' }
              examples:
                proposed: { $ref: '#/components/examples/DailyProposal' }
        '202': { $ref: '#/components/responses/Queued' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Cancelled' }
        '422': { $ref: '#/components/responses/IncompleteFacts' }
        '429': { $ref: '#/components/responses/Busy' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/daily/proposals/{proposalId}/commit:
    post:
      operationId: commitDailyProposal
      tags: [Daily]
      summary: Revalidate a proposal against current technician-day timestamps and return the assignments to write.
      description: >-
        A proposal is committed at most once, and only when its decision is IMPROVED. Repeating the same
        requestId returns the stored answer. A stale or refused commit changes nothing.
      x-implementation: implemented
      parameters:
        - $ref: '#/components/parameters/ProposalId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommitRequest' }
            examples:
              current: { $ref: '#/components/examples/CommitRequest' }
      responses:
        '200':
          description: Proposal still valid. The host writes these assignments with a compare-and-set on the same timestamps.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommitReceipt' }
              examples:
                committed: { $ref: '#/components/examples/CommitReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/CommitConflict' }
        '422': { $ref: '#/components/responses/IncompleteFacts' }
        '429': { $ref: '#/components/responses/Busy' }
  /api/v1/routes/evaluate:
    post:
      operationId: evaluateRoutes
      tags: [Daily]
      summary: Time one metro day's routes in their current order.
      description: >-
        Times every technician-day of the snapshot exactly in the order its appointments give, from its start to its
        end point, and reports whether the day holds every window, shift and paid limit. Nothing is optimized or
        stored, so a host can check a change to its own facts (a depot's location or route endpoints, a technician's
        depot) by sending the snapshot as it would be after the change. Technician-days whose locations cannot be
        resolved are listed in skippedTechnicianDays and not timed.
      x-implementation: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RouteEvaluationRequest' }
            examples:
              oneDay: { $ref: '#/components/examples/RouteEvaluationRequest' }
      responses:
        '200':
          description: The routes as timed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouteEvaluation' }
              examples:
                timed: { $ref: '#/components/examples/RouteEvaluation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/IncompleteFacts' }
        '429': { $ref: '#/components/responses/Busy' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/routes/geometry:
    post:
      operationId: drawRoutes
      tags: [Daily]
      summary: Draw one metro day's routes on roads in their current order.
      description: >-
        For every technician-day of the snapshot, the road legs from its start through its appointments (in sequence
        order) to its end. Approved absences split a day into segments, each drawn from start to end; an appointment
        belongs to the segment after every absence that ends by its planned start, and one that starts during an
        absence is refused as INCOMPLETE_FACTS. Nothing is optimized or stored. Technician-days whose locations cannot
        be resolved are listed in skippedTechnicianDays and not drawn.
      x-implementation: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RouteEvaluationRequest' }
            examples:
              oneDay: { $ref: '#/components/examples/RouteEvaluationRequest' }
      responses:
        '200':
          description: The routes as drawn.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouteGeometry' }
              examples:
                drawn: { $ref: '#/components/examples/RouteGeometry' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/IncompleteFacts' }
        '429': { $ref: '#/components/responses/Busy' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/booking/offers:
    post:
      operationId: createBookingOffers
      tags: [Booking]
      summary: Find up to four arrival windows for a job and hold them.
      description: >-
        Answers within the client's `bookingDeadlineMs` (at most 5 seconds) end to end. Returns at most `offerLimit` offers, the client's own cap.
        Offers add no overtime and may move other appointments
        (see "Booking (Decided 2026-10-08)" in docs/stateless-api-design.md). A new search for the same job
        ends its earlier offers. A date already past its 6 a.m. cutoff is a 422.
      x-implementation: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookingOffersRequest' }
            examples:
              newJob: { $ref: '#/components/examples/BookingOffersRequest' }
      responses:
        '201':
          description: Offer set created. Each offer holds its slot until `expiresAt`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OfferSet' }
              examples:
                offers: { $ref: '#/components/examples/OfferSet' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/StaleOrCancelled' }
        '422': { $ref: '#/components/responses/IncompleteFacts' }
        '429': { $ref: '#/components/responses/Busy' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/booking/offers/{offerId}/select:
    post:
      operationId: selectBookingOffer
      tags: [Booking]
      summary: Keep the hold for one offer and release the others in its set.
      description: >-
        The hold keeps its original expiry. Selecting the already selected offer again returns its hold.
      x-implementation: implemented
      parameters:
        - $ref: '#/components/parameters/OfferId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestOnly' }
            examples:
              select: { value: { requestId: 7d0e1c55-4c1e-4f7a-9d1a-0b6a3c1b2e10 } }
      responses:
        '200':
          description: Offer selected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hold' }
              examples:
                held: { value: { holdId: hold-5f2c, offerId: offer-1, expiresAt: '2026-10-12T15:10:00-05:00' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/HoldUnavailable' }
        '429': { $ref: '#/components/responses/Busy' }
  /api/v1/booking/offers/{offerId}/release:
    post:
      operationId: releaseBookingOffer
      tags: [Booking]
      summary: Release every hold in the offer's set.
      x-implementation: implemented
      parameters:
        - $ref: '#/components/parameters/OfferId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestOnly' }
            examples:
              release: { value: { requestId: 1f3a9b2c-6d4e-4a8b-9c0d-2e1f3a4b5c6d } }
      responses:
        '200':
          description: Released, or already released.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Released' }
              examples:
                released: { value: { released: true } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/Busy' }
  /api/v1/booking/holds/{holdId}/confirm:
    post:
      operationId: confirmBookingHold
      tags: [Booking]
      summary: Confirm a selected hold against the host's current snapshot of its date and return the appointments to write.
      description: >-
        Send the snapshot of the hold's metro and date (technician-days on any other date are a 400). The scheduler
        reconciles its holds with it, turns the hold into the job's appointment, under the job's ID, and checks the
        result is feasible and adds no overtime. Confirming a confirmed hold again returns the same receipt.
        Select the offer first: confirming a hold that is only offered is a 409.
      x-implementation: implemented
      parameters:
        - $ref: '#/components/parameters/HoldId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmRequest' }
            examples:
              current: { $ref: '#/components/examples/ConfirmRequest' }
      responses:
        '200':
          description: >-
            Hold confirmed. The host writes every listed appointment with a compare-and-set on the listed
            technician-day timestamps. If that write fails, search again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommitReceipt' }
              examples:
                confirmed: { $ref: '#/components/examples/CommitReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/HoldUnavailableStaleOrCancelled' }
        '422': { $ref: '#/components/responses/IncompleteFacts' }
        '429': { $ref: '#/components/responses/Busy' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/repairs/proposals:
    post:
      operationId: createRepairProposal
      tags: [Repair]
      summary: Propose how to cover a technician's absence on one day without overtime.
      description: >-
        The same calculation as a daily proposal, with the absence added to the technician's day. The snapshot holds
        the absence's date only and must include the absent technician-day. The decision is IMPROVED only when every
        appointment is placed, every constraint holds and no overtime is added; otherwise the current routes are
        returned with reason "Repair infeasible" and nothing can be committed. An absent technician-day that cannot
        be located is a 422. The absence itself is the host's to record. With `Prefer: respond-async` the request is
        queued and answered 202, as a daily proposal is.
      x-implementation: implemented
      parameters:
        - $ref: '#/components/parameters/Prefer'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RepairProposalRequest' }
            examples:
              absence: { $ref: '#/components/examples/RepairProposalRequest' }
      responses:
        '201':
          description: Repair proposal stored; commit an IMPROVED one with the daily commit endpoint.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailyProposal' }
              examples:
                proposed: { $ref: '#/components/examples/DailyProposal' }
        '202': { $ref: '#/components/responses/Queued' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Cancelled' }
        '422': { $ref: '#/components/responses/IncompleteFacts' }
        '429': { $ref: '#/components/responses/Busy' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/requests/{requestId}:
    get:
      operationId: getRequest
      tags: [Integration]
      summary: The status of a daily or repair proposal request, and its answer once complete.
      description: >-
        Reports a daily or repair proposal request sent with or without `Prefer: respond-async`: QUEUED while it waits
        for a calculation slot on any replica, RUNNING while it is calculated, COMPLETED with the answer the call
        itself would have given. A completed result with status 201 carries the stored proposal; the same requestId
        sent again replays it. A completed result with an error status that is not stored (BUSY, ROUTING_UNAVAILABLE,
        CALCULATION_UNAVAILABLE or CANCELLED) released the requestId, so sending the request again with it runs it
        again; it carries retryAfterSeconds when a wait is advised. Poll no sooner than Retry-After. Other operations'
        requests and unknown IDs are 404.
      x-implementation: implemented
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/RequestId' }
      responses:
        '200':
          description: The request's status.
          headers:
            Retry-After:
              description: Seconds before the next poll, while the request is QUEUED or RUNNING.
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestStatus' }
              examples:
                running:
                  value: { requestId: 0a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d, operation: DAILY_PROPOSAL, state: RUNNING, queuedAt: '2026-10-11T22:00:00.120Z', startedAt: '2026-10-11T22:00:41.902Z' }
                proposed:
                  value:
                    requestId: 0a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                    operation: DAILY_PROPOSAL
                    state: COMPLETED
                    queuedAt: '2026-10-11T22:00:00.120Z'
                    startedAt: '2026-10-11T22:00:41.902Z'
                    result:
                      status: 201
                      body:
                        proposalId: prop-0c4e
                        inputRevision: 9f2b6c0d4e1a7b3c5d8e0f1a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e
                        decision: NO_IMPROVEMENT
                        reason: No appointments to optimize
                        routes: []
                        unresolvedAppointmentIds: []
                        skippedTechnicianDays: []
                        costCents: 0
                        overtimeMinutes: 0
                cancelled:
                  value:
                    requestId: 0a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                    operation: REPAIR_PROPOSAL
                    state: COMPLETED
                    queuedAt: '2026-10-11T22:00:00.120Z'
                    result:
                      status: 409
                      body: { error: CANCELLED, message: 'The request was cancelled; nothing was stored, and retrying it with the same requestId runs it again' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: cancelRequest
      tags: [Integration]
      summary: Best-effort cancellation of an in-flight calculation.
      description: >-
        Cancels a daily or repair proposal, booking search or confirm that is still running under this requestId,
        from any scheduler replica. The cancelled call answers 409 CANCELLED, stores nothing, and releases its
        requestId, so retrying it with the same requestId runs it again. A request sent with `Prefer: respond-async`
        that is still queued ends at once; one that is running stops within a few seconds, and getRequest then reports
        the 409. A synchronous call running on another replica stops within about a second. Cancellation is best
        effort: a call that finishes first keeps its answer. 404 when no call with this requestId is queued or in
        progress.
      x-implementation: implemented
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/RequestId' }
      responses:
        '202': { description: Cancellation recorded; the cancelled call answers 409 CANCELLED. No body. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    tenantToken:
      type: http
      scheme: bearer
      description: >-
        Per-tenant token (`wfs_` plus 43 base64url characters), issued by the scheduler operator with
        `--command=issue-token` and revoked with `--command=revoke-token`. A tenant may hold several active tokens, so a
        token is rotated by issuing the new one, deploying it, then revoking the old one.
  parameters:
    Prefer:
      name: Prefer
      in: header
      required: false
      description: >-
        RFC 7240 preferences. `respond-async` queues the request and answers 202 at once instead of calculating within
        the call. Other preferences are ignored.
      schema: { type: string }
      example: respond-async
    ProposalId:
      name: proposalId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    OfferId:
      name: offerId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    HoldId:
      name: holdId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
  responses:
    BadRequest:
      description: Malformed request, unknown field, duplicate key or missing required value.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            unknownField: { value: { error: INVALID_REQUEST, message: Unknown field "tenantId" } }
    Unauthorized:
      description: Missing, malformed, unknown or revoked token, or a disabled tenant.
      headers:
        WWW-Authenticate:
          schema: { type: string, const: Bearer }
    NotFound:
      description: No such proposal, offer, hold or request for this tenant.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            missing: { value: { error: NOT_FOUND, message: Proposal not found } }
    HoldUnavailable:
      description: >-
        The hold expired or ended (lost, released or superseded), its offer set already selected another offer, its
        date is past the 6 a.m. cutoff, or (on confirm) it was not selected or the confirmed day would need overtime
        or repair. Search again for new offers.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            expired: { value: { error: HOLD_UNAVAILABLE, message: The hold expired } }
    CommitConflict:
      description: >-
        STALE when a technician-day changed since the proposal was computed. NOT_COMMITTABLE when the proposal
        was already committed or its decision is not IMPROVED. Nothing was changed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CommitConflict' }
          examples:
            changed: { $ref: '#/components/examples/StaleProblem' }
            committed: { value: { error: NOT_COMMITTABLE, message: Proposal was already committed as rcpt-41d9 } }
    Cancelled:
      description: >-
        The host cancelled this call with DELETE /api/v1/requests/{requestId}. Nothing was stored and the requestId
        was released; retrying with the same requestId runs the call again.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            cancelled: { value: { error: CANCELLED, message: 'The request was cancelled; nothing was stored, and retrying it with the same requestId runs it again' } }
    StaleOrCancelled:
      description: >-
        STALE: the snapshot carries a technician-day timestamp older than one the scheduler already used for that
        day, so it was built before a later write and arrived late. Nothing was changed and no hold was lost; the
        answer is final for this requestId, so send current records with a new requestId. CANCELLED: the host
        cancelled this search; nothing was stored and the same requestId runs again.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProblemOrStale' }
          examples:
            stale: { value: { error: STALE, message: 'The snapshot is older than one already used for these technician-days; rebuild it from current records and retry with a new requestId', changed: [ { technicianId: tech-1, serviceDate: '2026-10-12', lastModified: '2026-10-11T22:41:05.512Z' } ] } }
            cancelled: { value: { error: CANCELLED, message: 'The request was cancelled; nothing was stored, and retrying it with the same requestId runs it again' } }
    HoldUnavailableStaleOrCancelled:
      description: >-
        HOLD_UNAVAILABLE: the hold expired or ended, was not selected, or the confirmed day would need overtime or
        repair; search again. STALE: the snapshot is older than records the scheduler already used for the date (see
        StaleOrCancelled); the hold still stands, so confirm again with current records and a new requestId.
        CANCELLED: the host cancelled this confirm; nothing was stored and the same requestId runs again.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProblemOrStale' }
          examples:
            expired: { value: { error: HOLD_UNAVAILABLE, message: The hold expired } }
            stale: { value: { error: STALE, message: 'The snapshot is older than one already used for these technician-days; rebuild it from current records and retry with a new requestId', changed: [ { technicianId: tech-1, serviceDate: '2026-10-12', lastModified: '2026-10-11T22:41:05.512Z' } ] } }
            cancelled: { value: { error: CANCELLED, message: 'The request was cancelled; nothing was stored, and retrying it with the same requestId runs it again' } }
    IncompleteFacts:
      description: The snapshot is well formed but cannot be scheduled, for example a location with no road route.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            unroutable: { value: { error: INCOMPLETE_FACTS, message: No road route to appointment appt-7 } }
    Queued:
      description: >-
        Queued, because the request asked `Prefer: respond-async`: a worker on any replica calculates it, taking
        queued requests round-robin across tenants. Poll getRequest at Location, no sooner than Retry-After. A request
        that waits longer than the deployment's queue allowance (15 minutes unless the operator changes it) completes
        with 429 BUSY without running. The same requestId sent again while it is queued or running answers 202 again.
      headers:
        Location:
          description: The request's status, /api/v1/requests/{requestId}.
          schema: { type: string }
        Retry-After:
          description: Seconds before the first poll.
          schema: { type: integer, minimum: 1 }
        Preference-Applied:
          schema: { type: string, const: respond-async }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RequestStatus' }
          examples:
            queued: { value: { requestId: 0a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d, operation: DAILY_PROPOSAL, state: QUEUED, queuedAt: '2026-10-11T22:00:00.120Z' } }
    Busy:
      description: >-
        Admission limit reached, or a call with the same requestId is still running; retry with backoff. A daily or
        repair proposal is refused at once, before anything is routed, when the calculations ahead of it on this
        replica would not finish within its allowance; Retry-After is then their estimated remaining time in seconds
        (at most 300). A request sent with `Prefer: respond-async` is refused when the tenant already has as many
        queued or running as the deployment allows (50 unless the operator changes it), with Retry-After 30. Otherwise
        Retry-After is 1.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            busy: { value: { error: BUSY, message: Search capacity exhausted } }
    Unavailable:
      description: Routing or calculation was unavailable, or the deadline passed. Nothing was stored.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            routing: { value: { error: ROUTING_UNAVAILABLE, message: Road routing unavailable } }
  schemas:
    Id:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^\S(.*\S)?$'
      description: Opaque WaterFlex Software or scheduler identifier.
    RequestId:
      type: string
      format: uuid
      description: >-
        Host idempotency key. Repeating a request with the same ID returns the original result; reusing an ID
        with a different request is rejected with 400.
    TenantId:
      type: string
      pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
    Instant:
      type: string
      format: date-time
    ServiceDate:
      type: string
      format: date
    Decimal:
      type: string
      pattern: '^(0|[1-9][0-9]*)(\.[0-9]*[1-9])?$'
      description: Canonical non-negative decimal string, for example "20", "0.2" or "0.67".
    Location:
      type: object
      additionalProperties: false
      description: >-
        Coordinates are authoritative when present. An address alone is located only when the deployment runs with
        `geocoding.mode=NOMINATIM` and the scheduler's map has exactly one house matching the house number, street
        and ZIP; otherwise it is not located (the technician-day is skipped, or a booking job is a 422). A lookup
        outage is a 503 `ROUTING_UNAVAILABLE` and can be retried.
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        address: { $ref: '#/components/schemas/Address' }
      anyOf:
        - required: [lat, lng]
        - required: [address]
      dependentRequired:
        lat: [lng]
        lng: [lat]
    Address:
      type: object
      additionalProperties: false
      required: [line1, city, state, postalCode]
      properties:
        line1: { type: string, minLength: 1 }
        line2: { type: string }
        city: { type: string, minLength: 1 }
        state: { type: string, minLength: 2, maxLength: 2 }
        postalCode: { type: string, minLength: 5 }
    Window:
      type: object
      additionalProperties: false
      required: [start, end]
      properties:
        start: { $ref: '#/components/schemas/Instant' }
        end: { $ref: '#/components/schemas/Instant' }
    Rates:
      type: object
      additionalProperties: false
      required: [regularHourly, overtimeHourly, mileagePerMile, travelBufferPct, travelBufferMinutes]
      properties:
        regularHourly: { $ref: '#/components/schemas/Decimal' }
        overtimeHourly: { $ref: '#/components/schemas/Decimal' }
        mileagePerMile: { $ref: '#/components/schemas/Decimal' }
        travelBufferPct: { $ref: '#/components/schemas/Decimal' }
        travelBufferMinutes: { type: integer, minimum: 0, maximum: 120 }
    Policy:
      type: object
      additionalProperties: false
      required: [fairnessBudget, dailySearch, costSearchSeconds, fairnessSearchSeconds, bookingDeadlineMs, regularWindowThreshold]
      description: >-
        The client's own scheduling choices, sent with every calculation; the scheduler holds no policy settings of
        its own. The daily search method and times apply
        to daily and repair proposals; costSearchSeconds and fairnessSearchSeconds together may be at most 240. A
        proposal request takes about the search time plus up to 5 seconds.
      properties:
        fairnessBudget:
          $ref: '#/components/schemas/Decimal'
          description: >-
            How much the daily plan's cost may rise, as a share of the lowest-cost plan, to spread work more evenly
            across technicians. "0" means no fairness budget (fairness only chooses between plans of equal cost);
            "0.02" allows up to 2 percent. At most "1".
        dailySearch:
          type: string
          enum: [TABU, TABU_KOPT]
          description: >-
            The daily search method. TABU_KOPT is Tabu search that also tries moving runs of visits and
            reconnecting route segments (K opt); TABU tries only single-visit moves and swaps.
        costSearchSeconds:
          type: integer
          minimum: 5
          maximum: 240
          description: Seconds the search spends looking for the lowest-cost plan. A repair (one phase) spends both times.
        fairnessSearchSeconds:
          type: integer
          minimum: 0
          maximum: 240
          description: >-
            Seconds then spent spreading work more evenly within the fairness budget. 0 skips that search; the
            lowest-cost plan is still checked against the policy.
        bookingDeadlineMs:
          type: integer
          minimum: 1000
          maximum: 5000
          description: >-
            Milliseconds a booking search or confirm may take at the scheduler, end to end. When it passes, the
            search returns the offers found so far, with searchComplete false if a pass the offers need had not
            finished. Set the caller's timeout a little above it.
        bookingRefinementMs:
          type: integer
          minimum: 0
          maximum: 1000
          description: >-
            Optional. Milliseconds a booking search may spend on an optional refinement (one after a first pass that
            found more distinct regular windows than regularWindowThreshold); 0 skips it. A required refinement is not
            limited by it, only by bookingDeadlineMs. When absent, the scheduler operator's configured budget applies
            (booking.search.refinement-ms, 250 unless changed).
        regularWindowThreshold:
          type: integer
          minimum: 0
          maximum: 1000
          description: >-
            How many distinct regular arrival windows the first booking pass must exceed for the refinement pass to
            be optional and kept short. At or below it, offers are scarce and the refinement may use the rest of
            bookingDeadlineMs to find more. 0 keeps the refinement short whenever the first pass found any window.
    Technician:
      type: object
      additionalProperties: false
      required: [id, qualifications]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        qualifications:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/Id' }
          description: Service IDs this technician may perform.
    TechnicianDay:
      type: object
      additionalProperties: false
      required: [technicianId, serviceDate, lastModified, shift, absences, start, end, maxPaidMinutes]
      properties:
        technicianId: { $ref: '#/components/schemas/Id' }
        serviceDate: { $ref: '#/components/schemas/ServiceDate' }
        lastModified:
          $ref: '#/components/schemas/Instant'
          description: Host timestamp that changes whenever anything affecting this technician-day changes. Compared for exact equality.
        shift: { $ref: '#/components/schemas/Window' }
        absences:
          type: array
          description: Required; send an empty list when the technician has no absences that day.
          items: { $ref: '#/components/schemas/Window' }
        start: { $ref: '#/components/schemas/Location' }
        end: { $ref: '#/components/schemas/Location' }
        maxPaidMinutes: { type: integer, minimum: 1, maximum: 1440 }
    Appointment:
      type: object
      additionalProperties: false
      required: [id, technicianId, serviceDate, serviceId, durationMinutes, window, location, sequence, plannedStart]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        technicianId: { $ref: '#/components/schemas/Id' }
        serviceDate: { $ref: '#/components/schemas/ServiceDate' }
        serviceId: { $ref: '#/components/schemas/Id' }
        durationMinutes: { type: integer, minimum: 1, maximum: 720 }
        window: { $ref: '#/components/schemas/Window' }
        location: { $ref: '#/components/schemas/Location' }
        sequence: { type: integer, minimum: 0 }
        plannedStart:
          $ref: '#/components/schemas/Instant'
          description: The appointment's currently planned arrival. Proposals report moves relative to it.
    Snapshot:
      type: object
      additionalProperties: false
      required: [metroId, timeZone, rates, policy, technicians, technicianDays, appointments]
      properties:
        metroId: { $ref: '#/components/schemas/Id' }
        timeZone: { type: string, minLength: 1, examples: [America/Chicago] }
        rates: { $ref: '#/components/schemas/Rates' }
        policy: { $ref: '#/components/schemas/Policy' }
        technicians:
          type: array
          items: { $ref: '#/components/schemas/Technician' }
        technicianDays:
          type: array
          items: { $ref: '#/components/schemas/TechnicianDay' }
        appointments:
          type: array
          description: Every committed appointment on the covered technician-days.
          items: { $ref: '#/components/schemas/Appointment' }
    DailyProposalRequest:
      type: object
      additionalProperties: false
      required: [requestId, serviceDate, snapshot]
      properties:
        requestId: { $ref: '#/components/schemas/RequestId' }
        serviceDate: { $ref: '#/components/schemas/ServiceDate' }
        snapshot: { $ref: '#/components/schemas/Snapshot' }
    RepairProposalRequest:
      type: object
      additionalProperties: false
      required: [requestId, absence, snapshot]
      properties:
        requestId: { $ref: '#/components/schemas/RequestId' }
        absence:
          type: object
          additionalProperties: false
          required: [technicianId, serviceDate, window]
          properties:
            technicianId: { $ref: '#/components/schemas/Id' }
            serviceDate: { $ref: '#/components/schemas/ServiceDate' }
            window: { $ref: '#/components/schemas/Window' }
        snapshot: { $ref: '#/components/schemas/Snapshot' }
    PlannedStop:
      type: object
      additionalProperties: false
      required: [appointmentId, sequence, plannedStart, plannedEnd]
      properties:
        appointmentId: { $ref: '#/components/schemas/Id' }
        sequence: { type: integer, minimum: 0 }
        plannedStart: { $ref: '#/components/schemas/Instant' }
        plannedEnd: { $ref: '#/components/schemas/Instant' }
    PlannedRoute:
      type: object
      additionalProperties: false
      required: [technicianId, serviceDate, stops]
      properties:
        technicianId: { $ref: '#/components/schemas/Id' }
        serviceDate: { $ref: '#/components/schemas/ServiceDate' }
        stops:
          type: array
          items: { $ref: '#/components/schemas/PlannedStop' }
    DailyProposal:
      type: object
      additionalProperties: false
      required: [proposalId, inputRevision, decision, reason, routes, unresolvedAppointmentIds, skippedTechnicianDays, costCents, overtimeMinutes]
      properties:
        proposalId: { $ref: '#/components/schemas/Id' }
        inputRevision:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 of the canonical snapshot.
        decision:
          type: string
          enum: [IMPROVED, NO_IMPROVEMENT, REJECTED_BY_POLICY]
          description: Only IMPROVED proposals can be committed.
        reason:
          type: string
          minLength: 1
          description: >-
            Why the scheduler reached this decision. When the policy judged a valid plan it begins with the policy's code
            (COST_REDUCTION, FAIRNESS_IMPROVEMENT, OVERTIME_REDUCTION, NO_POLICY_IMPROVEMENT, COST_CEILING_EXCEEDED,
            FAIRNESS_REGRESSION_WITHIN_ALLOWANCE, OVERTIME_PROHIBITED, OVERTIME_TARGET_MISMATCH, NO_VALID_CANDIDATE,
            INCOMPLETE_OR_INFEASIBLE_DEMAND or COMPLETE_ZERO_OVERTIME_DEMAND) followed by a colon and a sentence for operators;
            a host that wants the code takes the text before the first colon. Other decisions are a sentence only.
        routes:
          type: array
          items: { $ref: '#/components/schemas/PlannedRoute' }
        unresolvedAppointmentIds:
          type: array
          items: { $ref: '#/components/schemas/Id' }
        skippedTechnicianDays:
          type: array
          description: Technician-days left exactly as they are; they are not in routes.
          items: { $ref: '#/components/schemas/SkippedTechnicianDay' }
        costCents: { type: integer, minimum: 0 }
        overtimeMinutes: { type: integer, const: 0 }
    RouteEvaluationRequest:
      type: object
      additionalProperties: false
      required: [serviceDate, snapshot]
      properties:
        serviceDate: { $ref: '#/components/schemas/ServiceDate' }
        snapshot: { $ref: '#/components/schemas/Snapshot' }
    RouteEvaluation:
      type: object
      additionalProperties: false
      required: [feasible, routes, skippedTechnicianDays, costCents, overtimeMinutes]
      properties:
        feasible:
          type: boolean
          description: True when every timed route holds its windows, shifts, absences and paid limits.
        routes:
          type: array
          description: Every routed technician-day with its appointments timed in order; empty when feasible is false.
          items: { $ref: '#/components/schemas/PlannedRoute' }
        skippedTechnicianDays:
          type: array
          items: { $ref: '#/components/schemas/SkippedTechnicianDay' }
        costCents:
          type: integer
          minimum: 0
          description: Modeled fleet cost of the timed routes.
        overtimeMinutes:
          type: integer
          minimum: 0
          maximum: 1440
    LocatedStop:
      type: object
      additionalProperties: false
      required: [appointmentId, sequence, lat, lng, source]
      properties:
        appointmentId: { $ref: '#/components/schemas/Id' }
        sequence: { type: integer, minimum: 0 }
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        source:
          type: string
          enum: [HOST, NOMINATIM]
          description: >-
            Where the coordinates came from: HOST when the snapshot sent them, NOMINATIM when the scheduler located
            an address-only location. Check a NOMINATIM stop's pin before relying on it.
    GeometryLeg:
      type: object
      additionalProperties: false
      required: [segment, legIndex, seconds, meters, coordinates]
      properties:
        segment:
          type: integer
          minimum: 0
          description: The day's segment, counted from 0; each approved absence that ends before a stop starts a new one.
        legIndex: { type: integer, minimum: 0 }
        seconds: { type: integer, minimum: 0 }
        meters: { type: integer, minimum: 0 }
        coordinates:
          type: array
          minItems: 2
          description: GeoJSON LineString positions, [lng, lat].
          items:
            type: array
            minItems: 2
            maxItems: 2
            items: { type: number }
    GeometryRoute:
      type: object
      additionalProperties: false
      required: [technicianId, serviceDate, stops, legs]
      properties:
        technicianId: { $ref: '#/components/schemas/Id' }
        serviceDate: { $ref: '#/components/schemas/ServiceDate' }
        stops:
          type: array
          items: { $ref: '#/components/schemas/LocatedStop' }
        legs:
          type: array
          description: Empty exactly when the day has no stops.
          items: { $ref: '#/components/schemas/GeometryLeg' }
    RouteGeometry:
      type: object
      additionalProperties: false
      required: [routingIdentity, routes, skippedTechnicianDays]
      properties:
        routingIdentity: { type: string, minLength: 1 }
        routes:
          type: array
          items: { $ref: '#/components/schemas/GeometryRoute' }
        skippedTechnicianDays:
          type: array
          items: { $ref: '#/components/schemas/SkippedTechnicianDay' }
    SkippedTechnicianDay:
      type: object
      additionalProperties: false
      required: [technicianId, serviceDate, reason, message]
      properties:
        technicianId: { $ref: '#/components/schemas/Id' }
        serviceDate: { $ref: '#/components/schemas/ServiceDate' }
        reason:
          type: string
          enum: [LOCATION_UNRESOLVED]
          description: LOCATION_UNRESOLVED means a location on that day arrived without coordinates and could not be located with certainty.
        message: { type: string, minLength: 1 }
    BookingOffersRequest:
      type: object
      additionalProperties: false
      required: [requestId, job, horizon, offerLimit, windowHours, snapshot]
      properties:
        requestId: { $ref: '#/components/schemas/RequestId' }
        offerLimit:
          type: integer
          minimum: 1
          maximum: 4
          description: The client's own cap on offers per search. Required; never assumed.
        windowHours:
          type: integer
          minimum: 1
          maximum: 8
          description: >-
            The client's own arrival window length in whole hours. Every offered window is this long and starts on the
            hour. Required; never assumed.
        job:
          type: object
          additionalProperties: false
          required: [id, serviceId, durationMinutes, location]
          properties:
            id:
              $ref: '#/components/schemas/Id'
              description: Must differ from every appointment and technician ID in the snapshot.
            serviceId: { $ref: '#/components/schemas/Id' }
            durationMinutes: { type: integer, minimum: 1, maximum: 720 }
            location: { $ref: '#/components/schemas/Location' }
        horizon:
          type: object
          additionalProperties: false
          required: [firstDate, lastDate]
          description: >-
            Every date from firstDate to lastDate, both included, at most 21 dates. Every technician-day in the
            snapshot falls inside it. The search covers exactly these dates.
          properties:
            firstDate: { $ref: '#/components/schemas/ServiceDate' }
            lastDate: { $ref: '#/components/schemas/ServiceDate' }
        snapshot: { $ref: '#/components/schemas/Snapshot' }
    Offer:
      type: object
      additionalProperties: false
      required: [offerId, serviceDate, window]
      properties:
        offerId: { $ref: '#/components/schemas/Id' }
        serviceDate: { $ref: '#/components/schemas/ServiceDate' }
        window: { $ref: '#/components/schemas/Window' }
    OfferSet:
      type: object
      additionalProperties: false
      required: [offerSetId, expiresAt, offers, searchComplete, skippedTechnicianDays]
      properties:
        offerSetId: { $ref: '#/components/schemas/Id' }
        expiresAt: { $ref: '#/components/schemas/Instant' }
        offers:
          type: array
          maxItems: 4
          items: { $ref: '#/components/schemas/Offer' }
        searchComplete:
          type: boolean
          description: >-
            False when the deadline or a failure stopped a pass the offers need: the first pass, or the refinement
            when the first pass found no more distinct regular windows than regularWindowThreshold. An empty offer
            list then does not prove there is no capacity. An optional refinement cut short leaves it true.
        refinement:
          type: string
          enum: [COMPLETE, SHORTENED, SKIPPED, UNAVAILABLE, SHED]
          description: >-
            How the search's refinement pass ended. COMPLETE: it finished. SHORTENED: its cap or the deadline ended
            it; the offers are the best found so far. SKIPPED: it did not run, because the first pass used the whole
            deadline, the client's bookingRefinementMs is 0, or the scheduler is configured for one pass. UNAVAILABLE:
            routing or a remote engine failed it, or it could not get routing or database capacity before the
            deadline, and the first pass's offers are returned. SHED: it was optional and
            other booking requests were waiting for a slot, so the slot went to them. Informational: searchComplete
            already says whether the offers are complete. Sent on every offer set since 1.2.0; a replay of an offer
            set answered by an earlier version leaves it out.
        incompleteDates:
          type: array
          description: >-
            Horizon dates, ascending, where a pass the offers need did not finish. On every other date the search
            finished, so having no offer there means there is no regular capacity for the job. Empty when
            searchComplete is true; searchComplete can also be false with this empty, when the deadline stopped the
            offers being prepared after every date was searched. Sent on every offer set since 1.3.0; a replay of an
            offer set answered by an earlier version leaves it out.
          items: { $ref: '#/components/schemas/ServiceDate' }
        skippedTechnicianDays:
          type: array
          description: Technician-days left out of the search because a location could not be located; nothing is offered on them.
          items: { $ref: '#/components/schemas/SkippedTechnicianDay' }
    Hold:
      type: object
      additionalProperties: false
      required: [holdId, offerId, expiresAt]
      properties:
        holdId: { $ref: '#/components/schemas/Id' }
        offerId: { $ref: '#/components/schemas/Id' }
        expiresAt: { $ref: '#/components/schemas/Instant' }
    Released:
      type: object
      additionalProperties: false
      required: [released]
      properties:
        released: { type: boolean, const: true }
    TechnicianDayVersion:
      type: object
      additionalProperties: false
      required: [technicianId, serviceDate, lastModified]
      properties:
        technicianId: { $ref: '#/components/schemas/Id' }
        serviceDate: { $ref: '#/components/schemas/ServiceDate' }
        lastModified: { $ref: '#/components/schemas/Instant' }
    ConfirmRequest:
      type: object
      additionalProperties: false
      required: [requestId, snapshot]
      properties:
        requestId: { $ref: '#/components/schemas/RequestId' }
        snapshot:
          $ref: '#/components/schemas/Snapshot'
          description: The host's current facts for the hold's metro and date; every technician-day is on that date.
    CommitRequest:
      type: object
      additionalProperties: false
      required: [requestId, technicianDays]
      properties:
        requestId: { $ref: '#/components/schemas/RequestId' }
        technicianDays:
          type: array
          minItems: 1
          description: >-
            Current host timestamps for every technician-day the proposal or offer covers, including skipped ones;
            a missing or extra technician-day is a 400.
          items: { $ref: '#/components/schemas/TechnicianDayVersion' }
    Assignment:
      type: object
      additionalProperties: false
      required: [appointmentId, technicianId, serviceDate, sequence, plannedStart, plannedEnd]
      properties:
        appointmentId: { $ref: '#/components/schemas/Id' }
        technicianId: { $ref: '#/components/schemas/Id' }
        serviceDate: { $ref: '#/components/schemas/ServiceDate' }
        sequence: { type: integer, minimum: 0 }
        plannedStart: { $ref: '#/components/schemas/Instant' }
        plannedEnd: { $ref: '#/components/schemas/Instant' }
    CommitReceipt:
      type: object
      additionalProperties: false
      required: [receiptId, assignments, technicianDays]
      properties:
        receiptId: { $ref: '#/components/schemas/Id' }
        assignments:
          type: array
          description: >-
            Every appointment on the proposal's routes with its technician, sequence and planned times. Writing all
            of them leaves each routed technician-day exactly as proposed. A booking confirm lists every appointment
            on each technician-day whose appointments, order or planned times change, the new job included under
            its job ID.
          items: { $ref: '#/components/schemas/Assignment' }
        technicianDays:
          type: array
          description: The timestamps the host must compare-and-set against when writing.
          items: { $ref: '#/components/schemas/TechnicianDayVersion' }
    RequestOnly:
      type: object
      additionalProperties: false
      required: [requestId]
      properties:
        requestId: { $ref: '#/components/schemas/RequestId' }
    WhoAmI:
      type: object
      additionalProperties: false
      required: [tenantId]
      properties:
        tenantId: { $ref: '#/components/schemas/TenantId' }
    Problem:
      type: object
      additionalProperties: false
      required: [error, message]
      properties:
        error:
          type: string
          enum: [INVALID_REQUEST, NOT_FOUND, STALE, NOT_COMMITTABLE, HOLD_UNAVAILABLE, INCOMPLETE_FACTS, BUSY, ROUTING_UNAVAILABLE, CALCULATION_UNAVAILABLE, CANCELLED]
        message: { type: string, minLength: 1 }
    StaleProblem:
      type: object
      additionalProperties: false
      required: [error, message, changed]
      properties:
        error: { type: string, const: STALE }
        message: { type: string, minLength: 1 }
        changed:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/TechnicianDayVersion' }
          description: >-
            Technician-days whose submitted timestamp differs from the recorded one, with the recorded value: for a
            commit, the timestamp the proposal was computed from; for a booking search or confirm, the newest
            timestamp the scheduler has seen.
    ProblemOrStale:
      description: A STALE answer lists the technician-days concerned; any other answer is a plain Problem.
      oneOf:
        - { $ref: '#/components/schemas/StaleProblem' }
        - { $ref: '#/components/schemas/Problem' }
    CommitConflict:
      description: A STALE answer lists the changed technician-days; a NOT_COMMITTABLE answer is a plain Problem.
      oneOf:
        - { $ref: '#/components/schemas/StaleProblem' }
        - { $ref: '#/components/schemas/Problem' }
    RequestStatus:
      type: object
      additionalProperties: false
      required: [requestId, operation, state]
      properties:
        requestId: { $ref: '#/components/schemas/RequestId' }
        operation:
          type: string
          enum: [DAILY_PROPOSAL, REPAIR_PROPOSAL]
        state:
          type: string
          enum: [QUEUED, RUNNING, COMPLETED]
          description: >-
            QUEUED waits for a calculation slot; RUNNING is being calculated (or, for a call sent without
            respond-async, still running within it); COMPLETED has a result.
        queuedAt:
          $ref: '#/components/schemas/Instant'
          description: When the request was queued; absent for a call sent without respond-async.
        startedAt:
          $ref: '#/components/schemas/Instant'
          description: When its calculation last started; absent while queued and for a call sent without respond-async.
        result:
          $ref: '#/components/schemas/RequestResult'
          description: Present exactly when state is COMPLETED.
    RequestResult:
      type: object
      additionalProperties: false
      required: [status, body]
      properties:
        status:
          type: integer
          minimum: 200
          maximum: 599
          description: The HTTP status the call answered, or would have answered had it been sent without respond-async.
        body:
          description: The answer's body, a DailyProposal for 201 and a Problem otherwise.
          oneOf:
            - $ref: '#/components/schemas/DailyProposal'
            - $ref: '#/components/schemas/Problem'
        retryAfterSeconds:
          type: integer
          minimum: 1
          maximum: 300
          description: For a refusal that released the requestId, the seconds to wait before sending it again.
