<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fairness after a move</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); padding: 0; }
    .frame { width: 960px; }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <div class="diagram-container">
      <svg viewBox="0 0 960 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fairness-computation-title fairness-computation-desc">
        <title id="fairness-computation-title">How each arm scores fairness after a move</title>
        <desc id="fairness-computation-desc">After a move re-walks the routes it changed, production recomputes the whole-fleet variance in DECIMAL128, option b recomputes it in binary64, and option c updates three exact running sums for the changed routes only, before the fairness level of the score is set.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Arrows first -->
        <line x1="200" y1="200" x2="236" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- re-walk to the three formulas: attach points 186 / 200 / 214 -->
        <path d="M400 186 H432 Q440 186 440 178 V108 Q440 100 448 100 H476" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="400" y1="200" x2="476" y2="200" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <path d="M400 214 H432 Q440 214 440 222 V292 Q440 300 448 300 H476" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- formulas to the score: attach points 186 / 200 / 214 -->
        <path d="M720 100 H732 Q740 100 740 108 V178 Q740 186 748 186 H776" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="720" y1="200" x2="776" y2="200" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <path d="M720 300 H732 Q740 300 740 292 V222 Q740 214 748 214 H776" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- A move -->
        <rect x="40" y="172" width="160" height="56" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="120" y="198" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">One candidate move</text>
        <text x="120" y="214" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">change, swap, k-opt</text>

        <!-- Re-walk -->
        <rect x="240" y="172" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="320" y="198" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Routes re-walked</text>
        <text x="320" y="214" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">only those it changed</text>

        <!-- Baseline -->
        <rect x="480" y="68" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="492" y="76" width="64" height="14" rx="2" fill="rgba(45,49,66,0.06)"/>
        <text x="524" y="86" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">BASELINE</text>
        <text x="492" y="108" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif">Whole fleet, DECIMAL128</text>
        <text x="492" y="124" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">every route, decimal divides</text>

        <!-- Option b (focal) -->
        <rect x="480" y="168" width="240" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="492" y="176" width="64" height="14" rx="2" fill="rgba(191,69,32,0.14)"/>
        <text x="524" y="186" fill="#bf4520" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">OPTION B</text>
        <text x="492" y="208" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif">Whole fleet, binary64</text>
        <text x="492" y="224" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">every route, rounded to 1e-9 units</text>

        <!-- Option c -->
        <rect x="480" y="268" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="492" y="276" width="64" height="14" rx="2" fill="rgba(45,49,66,0.06)"/>
        <text x="524" y="286" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">OPTION C</text>
        <text x="492" y="308" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif">Three running sums</text>
        <text x="492" y="324" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">changed routes only, exact longs</text>

        <!-- Score -->
        <rect x="780" y="172" width="140" height="56" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="850" y="198" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fairness level</text>
        <text x="850" y="214" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">soft 0 of the score</text>

        <!-- Callout -->
        <text x="480" y="364" fill="#2d3142" font-size="15" font-style="italic" font-family="'Instrument Serif', serif">The re-walk is the same for all three. Only the last step differs.</text>

        <!-- Legend -->
        <line x1="40" y1="388" x2="920" y2="388" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="404" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="40" y="416" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="72" y="426" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Input or result</text>
        <rect x="200" y="416" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="232" y="426" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Work done per move</text>
        <line x1="380" y1="422" x2="408" y2="422" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="416" y="426" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Promoted formula (option b)</text>
      </svg>
    </div>
  </div>
</body>
</html>
