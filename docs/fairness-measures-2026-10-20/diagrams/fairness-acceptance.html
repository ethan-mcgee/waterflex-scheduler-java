<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fairness phase acceptance</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); padding: 0; }
    .frame { width: 960px; }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <div class="diagram-container">
      <svg viewBox="0 0 960 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fairness-acceptance-title fairness-acceptance-desc">
        <title id="fairness-acceptance-title">How a fairness-phase result is accepted</title>
        <desc id="fairness-acceptance-desc">The fairness search runs under a cost ceiling two percent above the reference plan; its result is accepted as a fairness improvement if it is fairer on its measure than the host's plan, as a cost reduction if it is no less fair and cheaper, and rejected otherwise.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Arrows first -->
        <line x1="320" y1="96" x2="320" y2="116" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="320" y1="176" x2="320" y2="196" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="430" y1="248" x2="556" y2="248" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="320" y1="296" x2="320" y2="324" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="430" y1="376" x2="556" y2="376" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <line x1="320" y1="424" x2="320" y2="452" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="430" y1="504" x2="556" y2="504" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="320" y1="552" x2="320" y2="580" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="481" y="228" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="495" y="237" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>
        <rect x="330" y="304" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="346" y="313" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>
        <rect x="479" y="356" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="495" y="365" fill="#bf4520" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>
        <rect x="330" y="432" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="344" y="441" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>
        <rect x="479" y="484" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="495" y="493" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>
        <rect x="330" y="560" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="344" y="569" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

        <!-- Start: reference plan -->
        <rect x="200" y="40" width="240" height="56" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="320" y="64" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Reference plan from the cost phase</text>
        <text x="320" y="81" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">ceiling = its cost x 1.02, floored</text>

        <!-- Step: fairness search -->
        <rect x="200" y="120" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="320" y="144" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fairness search on measure M</text>
        <text x="320" y="161" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">hard: ceiling; soft: M, then cost</text>

        <!-- Decision 1 -->
        <polygon points="320,200 430,248 320,296 210,248" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="320" y="245" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Inside the ceiling,</text>
        <text x="320" y="260" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">no overtime?</text>

        <!-- Decision 2 (focal) -->
        <polygon points="320,328 430,376 320,424 210,376" fill="#ffffff" stroke="#bf4520" stroke-width="1"/>
        <text x="320" y="373" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fairer on M than</text>
        <text x="320" y="388" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">the host's plan?</text>

        <!-- Decision 3 -->
        <polygon points="320,456 430,504 320,552 210,504" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="320" y="501" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">No less fair on M,</text>
        <text x="320" y="516" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">and cheaper?</text>

        <!-- Outcomes -->
        <rect x="560" y="220" width="240" height="56" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="680" y="244" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Rejected</text>
        <text x="680" y="261" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">over the ceiling, or overtime</text>

        <rect x="560" y="348" width="240" height="56" rx="20" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="680" y="372" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Accepted</text>
        <text x="680" y="389" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">FAIRNESS_IMPROVEMENT</text>

        <rect x="560" y="476" width="240" height="56" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="680" y="500" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Accepted</text>
        <text x="680" y="517" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">COST_REDUCTION</text>

        <rect x="200" y="584" width="240" height="56" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="320" y="608" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Rejected</text>
        <text x="320" y="625" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">no gain, or less fair</text>

        <!-- Callout -->
        <text x="560" y="568" fill="#2d3142" font-size="15" font-style="italic" font-family="'Instrument Serif', serif">Min-max and spread mostly end here: a maximum</text>
        <text x="560" y="588" fill="#2d3142" font-size="15" font-style="italic" font-family="'Instrument Serif', serif">rarely moves, so the cost stays at the reference.</text>

        <!-- Legend -->
        <line x1="40" y1="668" x2="920" y2="668" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="684" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>
        <rect x="40" y="696" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="72" y="706" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Start or outcome</text>
        <rect x="200" y="696" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="232" y="706" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Step</text>
        <polygon points="316,702 328,696 340,702 328,708" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="352" y="706" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Decision</text>
        <line x1="460" y1="702" x2="488" y2="702" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="496" y="706" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">The outcome a fairness measure aims for</text>
      </svg>
    </div>
  </div>
</body>
</html>
