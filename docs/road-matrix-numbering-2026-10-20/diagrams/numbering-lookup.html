<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How a leg finds its cell</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); padding: 0; }
    .frame { width: 960px; }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <div class="diagram-container">
      <svg viewBox="0 0 960 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="numbering-lookup-title numbering-lookup-desc">
        <title id="numbering-lookup-title">How a leg finds its road matrix cell</title>
        <desc id="numbering-lookup-desc">Before the fix every leg probed the identity map with the visit's text; after it, a visit keeps its number for the fact revision that gave it and probes again only under a new revision.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Row eyebrows -->
        <text x="40" y="52" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">BEFORE  ·  D571D83</text>
        <text x="40" y="220" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">AFTER  ·  ED97D8B</text>

        <!-- Arrows first: before row -->
        <line x1="200" y1="104" x2="276" y2="104" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="520" y1="104" x2="716" y2="104" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="580" y="78" width="76" height="14" fill="#f5f5f5"/>
        <text x="618" y="88" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EVERY LEG</text>

        <!-- Arrows: after row -->
        <line x1="200" y1="272" x2="276" y2="272" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="520" y1="272" x2="716" y2="272" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="568" y="246" width="100" height="14" fill="#f5f5f5"/>
        <text x="618" y="256" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SAME REVISION</text>
        <line x1="400" y1="304" x2="400" y2="336" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="408" y="312" width="96" height="14" fill="#f5f5f5"/>
        <text x="412" y="322" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.08em">NEW REVISION</text>
        <path d="M520 368 H812 Q820 368 820 360 V304" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <!-- Before: visit identity -->
        <rect x="40" y="76" width="160" height="56" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="120" y="102" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Visit identity</text>
        <text x="120" y="118" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">visit.getId()</text>

        <!-- Before: probe -->
        <rect x="280" y="72" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="292" y="80" width="56" height="14" rx="2" fill="rgba(45,49,66,0.06)"/>
        <text x="320" y="90" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">PROBE</text>
        <text x="292" y="112" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif">Identity map lookup</text>
        <text x="292" y="128" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">hash, then compare the text</text>

        <!-- Before: cell -->
        <rect x="720" y="76" width="200" height="56" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="820" y="102" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Leg cell</text>
        <text x="820" y="118" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">onward[from][to]</text>

        <!-- After: visit -->
        <rect x="40" y="244" width="160" height="56" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="120" y="270" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Visit</text>
        <text x="120" y="286" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">PlanVisit, TechRoute</text>

        <!-- After: kept number (focal) -->
        <rect x="280" y="240" width="240" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="292" y="248" width="56" height="14" rx="2" fill="rgba(191,69,32,0.14)"/>
        <text x="320" y="258" fill="#bf4520" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">FIELD</text>
        <text x="292" y="280" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif">Kept number</text>
        <text x="292" y="296" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">revision checked with one ==</text>

        <!-- After: cell -->
        <rect x="720" y="244" width="200" height="56" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="820" y="270" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Leg cell</text>
        <text x="820" y="286" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">onward[from][to]</text>

        <!-- After: probe once -->
        <rect x="280" y="340" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="292" y="364" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif">Probe once, keep it</text>
        <text x="292" y="380" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">first use under a revision</text>

        <!-- Callout -->
        <text x="560" y="424" fill="#2d3142" font-size="15" font-style="italic" font-family="'Instrument Serif', serif">The probe now runs once per visit and revision, not per leg.</text>

        <!-- Legend -->
        <line x1="40" y1="444" x2="920" y2="444" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="460" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="40" y="472" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="72" y="482" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Input or result</text>
        <rect x="200" y="472" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="232" y="482" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Work done for a leg</text>
        <line x1="376" y1="478" x2="404" y2="478" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="412" y="482" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Rare path</text>
        <line x1="520" y1="478" x2="548" y2="478" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="556" y="482" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">The path almost every leg now takes</text>
      </svg>
    </div>
  </div>
</body>
</html>
