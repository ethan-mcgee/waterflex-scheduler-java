<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How one case runs</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); padding: 0; }
    .frame { width: 960px; }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <div class="diagram-container">
      <svg viewBox="0 0 960 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="study-design-title study-design-desc">
        <title id="study-design-title">How one case of the head-to-head runs</title>
        <desc id="study-design-desc">Each case, one fleet, workload and drawn day, runs the same cost phase for both arms, then a fairness phase on the arm's own measure under the same cost ceiling, an acceptance on that measure, and a reading of the final plan on all five fairness measures.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Arrows first -->
        <line x1="172" y1="200" x2="200" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M344 186 H352 Q360 186 360 178 V128 Q360 120 368 120 H372" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M344 214 H352 Q360 214 360 222 V272 Q360 280 368 280 H372" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M596 120 H604 Q612 120 612 128 V178 Q612 186 620 186 H624" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M596 280 H604 Q612 280 612 272 V222 Q612 214 620 214 H624" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <line x1="768" y1="200" x2="796" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- One case -->
        <rect x="32" y="172" width="140" height="56" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="102" y="198" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">One case</text>
        <text x="102" y="214" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">fleet, workload, day</text>

        <!-- Cost phase -->
        <rect x="204" y="172" width="140" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="274" y="198" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cost phase</text>
        <text x="274" y="214" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">2/3 of the budget</text>

        <!-- Fairness phase, b -->
        <rect x="376" y="88" width="220" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="388" y="96" width="72" height="14" rx="2" fill="rgba(45,49,66,0.06)"/>
        <text x="424" y="106" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ARM B</text>
        <text x="388" y="128" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif">Fairness on the variance</text>
        <text x="388" y="144" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">capacity-weighted, production</text>

        <!-- Fairness phase, load balance (focal) -->
        <rect x="376" y="248" width="220" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="388" y="256" width="96" height="14" rx="2" fill="rgba(191,69,32,0.14)"/>
        <text x="436" y="266" fill="#bf4520" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">LOAD BALANCE</text>
        <text x="388" y="288" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif">Fairness on load balance</text>
        <text x="388" y="304" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">Timefold collector, unweighted</text>

        <!-- Acceptance -->
        <rect x="628" y="172" width="140" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="698" y="198" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Acceptance</text>
        <text x="698" y="214" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">own measure, ceiling</text>

        <!-- Five measures -->
        <rect x="800" y="172" width="128" height="56" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="864" y="198" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Five measures</text>
        <text x="864" y="214" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">every final plan</text>

        <!-- Callout -->
        <text x="376" y="352" fill="#2d3142" font-size="15" font-style="italic" font-family="'Instrument Serif', serif">Same day, same start, same ceiling. Only the fairness objective differs.</text>

        <!-- Legend -->
        <line x1="32" y1="384" x2="928" y2="384" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="32" y="400" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="32" y="412" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="64" y="422" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Input or reading</text>
        <rect x="192" y="412" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="224" y="422" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Search or rule</text>
        <line x1="352" y1="418" x2="380" y2="418" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="388" y="422" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">The policy under test</text>
      </svg>
    </div>
  </div>
</body>
</html>
