<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>One booking search inside its deadline</title>
<style>
  :root { --paper: #FFFFFF; --ink: #1F2A33; --muted: #444444; --accent: #B22222; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Calibri', 'Carlito', system-ui, sans-serif; }
  .wrap { overflow-x: auto; }
  svg { display: block; width: 1000px; min-width: 1000px; }
</style>
</head>
<body>
<div class="wrap">
<svg role="img" aria-labelledby="pipeline-title pipeline-desc" viewBox="0 0 1000 450" xmlns="http://www.w3.org/2000/svg">
<title id="pipeline-title">One booking search inside its deadline</title>
<desc id="pipeline-desc">A flowchart of the five stages of a booking search, admission, first pass, the shed check, the refinement and the commit, over a bar of the 5 s deadline split into exploration, the publish reserve and the database admission guard.</desc>
<rect x="0" y="0" width="1000" height="450" fill="#FFFFFF"/>
<defs><marker id="pipeline-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#444444"/></marker><marker id="pipeline-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#B22222"/></marker></defs>
<text x="30" y="32" fill="#444444" font-size="13" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">ONE BOOKING SEARCH, LEFT TO RIGHT, OVER ITS DEADLINE</text>
<line x1="190" y1="110.0" x2="219" y2="110.0" stroke="#444444" stroke-width="1" marker-end="url(#pipeline-arrow)"/>
<line x1="380" y1="110.0" x2="409.0" y2="110.0" stroke="#444444" stroke-width="1" marker-end="url(#pipeline-arrow)"/>
<line x1="570.0" y1="110.0" x2="599" y2="110.0" stroke="#B22222" stroke-width="1.4" marker-end="url(#pipeline-arrow-accent)"/>
<line x1="760" y1="110.0" x2="789" y2="110.0" stroke="#444444" stroke-width="1" marker-end="url(#pipeline-arrow)"/>
<text x="596.0" y="100.0" fill="#B22222" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.1em">EMPTY</text>
<path d="M 490.0,150 V 192 Q 490.0,200 498.0,200 H 862.0 Q 870.0,200 870.0,192 V 151" fill="none" stroke="#444444" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#pipeline-arrow)"/>
<text x="680.0" y="218" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.1em">QUEUED: SKIP THE REFINEMENT, FIRST-PASS OFFERS ONLY</text>
<text x="680.0" y="172" fill="#444444" font-size="14" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="middle" font-style="italic">the cap&#x27;s clock starts here, before the neighborhood route fetch</text>
<rect data-stage="Admission" x="30" y="70" width="160" height="80" rx="6" fill="#FFFFFF" stroke="rgba(31,42,51,0.60)" stroke-width="1"/>
<text x="110.0" y="96" fill="#1F2A33" font-size="17" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="middle" font-weight="600">Admission</text>
<text x="110.0" y="118" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">takes a replica slot</text>
<text x="110.0" y="136" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">other searches</text>
<rect data-stage="First pass" x="220" y="70" width="160" height="80" rx="6" fill="#FFFFFF" stroke="rgba(31,42,51,0.60)" stroke-width="1"/>
<text x="300.0" y="96" fill="#1F2A33" font-size="17" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="middle" font-weight="600">First pass</text>
<text x="300.0" y="118" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">job on every day</text>
<text x="300.0" y="136" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">horizon x fleet</text>
<polygon data-stage="Shed check" points="490.0,70 570.0,110.0 490.0,150 410.0,110.0" fill="#FFFFFF" stroke="rgba(31,42,51,0.60)" stroke-width="1"/>
<text x="490.0" y="106.0" fill="#1F2A33" font-size="17" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="middle" font-weight="600">Shed check</text>
<text x="490.0" y="126.0" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">queue empty?</text>
<rect data-stage="Refinement" x="600" y="70" width="160" height="80" rx="6" fill="#FFFFFF" stroke="#B22222" stroke-width="1.6"/>
<text x="680.0" y="96" fill="#1F2A33" font-size="17" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="middle" font-weight="600">Refinement</text>
<text x="680.0" y="118" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">moves visits for room</text>
<text x="680.0" y="136" fill="#B22222" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">cap, then deadline</text>
<rect data-stage="Commit" x="790" y="70" width="160" height="80" rx="6" fill="#FFFFFF" stroke="rgba(31,42,51,0.60)" stroke-width="1"/>
<text x="870.0" y="96" fill="#1F2A33" font-size="17" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="middle" font-weight="600">Commit</text>
<text x="870.0" y="118" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">validate and publish</text>
<text x="870.0" y="136" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">reserve and guard</text>
<text x="30" y="248" fill="#444444" font-size="13" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">THE 5 S DEADLINE</text>
<rect data-segment="exploration" data-from-ms="0" data-to-ms="4000" x="30.0" y="262" width="736.0" height="36" fill="rgba(31,42,51,0.10)" stroke="rgba(31,42,51,0.50)" stroke-width="0.8"/>
<text x="398.0" y="285.0" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">FIRST PASS AND REFINEMENT 4,000 MS</text>
<rect data-segment="reserve" data-from-ms="4000" data-to-ms="5000" x="766.0" y="262" width="184.0" height="36" fill="rgba(178,34,34,0.18)" stroke="rgba(31,42,51,0.50)" stroke-width="0.8"/>
<text x="812.0" y="285.0" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">RESERVE</text>
<rect data-segment="guard" data-from-ms="4500" data-to-ms="5000" x="858.0" y="262" width="92.0" height="36" fill="rgba(178,34,34,0.45)" stroke="rgba(31,42,51,0.50)" stroke-width="0.8"/>
<text x="904.0" y="285.0" fill="#FFFFFF" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">GUARD</text>
<line x1="30.0" y1="298" x2="30.0" y2="304" stroke="rgba(31,42,51,0.50)" stroke-width="0.8"/>
<text x="30.0" y="322" fill="#444444" font-size="13" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">0 ms</text>
<line x1="214.0" y1="298" x2="214.0" y2="304" stroke="rgba(31,42,51,0.50)" stroke-width="0.8"/>
<text x="214.0" y="322" fill="#444444" font-size="13" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">1,000 ms</text>
<line x1="398.0" y1="298" x2="398.0" y2="304" stroke="rgba(31,42,51,0.50)" stroke-width="0.8"/>
<text x="398.0" y="322" fill="#444444" font-size="13" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">2,000 ms</text>
<line x1="582.0" y1="298" x2="582.0" y2="304" stroke="rgba(31,42,51,0.50)" stroke-width="0.8"/>
<text x="582.0" y="322" fill="#444444" font-size="13" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">3,000 ms</text>
<line x1="766.0" y1="298" x2="766.0" y2="304" stroke="rgba(31,42,51,0.50)" stroke-width="0.8"/>
<text x="766.0" y="322" fill="#444444" font-size="13" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">4,000 ms</text>
<line x1="950.0" y1="298" x2="950.0" y2="304" stroke="rgba(31,42,51,0.50)" stroke-width="0.8"/>
<text x="950.0" y="322" fill="#444444" font-size="13" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">5,000 ms</text>
<text x="766.0" y="256" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">4,000</text>
<text x="858.0" y="256" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">4,500</text>
<line x1="30" y1="352" x2="960" y2="352" stroke="rgba(31,42,51,0.12)" stroke-width="1"/>
<text x="30" y="374" fill="#444444" font-size="13" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text>
<rect x="130" y="362" width="22" height="14" rx="3" fill="#FFFFFF" stroke="rgba(31,42,51,0.60)" stroke-width="1"/>
<text x="160" y="374" fill="#444444" font-size="15" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start">Stage</text>
<rect x="224" y="362" width="22" height="14" rx="3" fill="#FFFFFF" stroke="#B22222" stroke-width="1.6"/>
<text x="254" y="374" fill="#444444" font-size="15" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start">Stage the cap governs (focal)</text>
<line x1="491" y1="369" x2="519" y2="369" stroke="#444444" stroke-dasharray="5,4"/>
<text x="527" y="374" fill="#444444" font-size="15" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start">Path under load</text>
<rect x="130" y="388" width="22" height="14" rx="0" fill="rgba(31,42,51,0.10)" stroke="rgba(31,42,51,0.50)" stroke-width="0.8"/>
<text x="160" y="400" fill="#444444" font-size="15" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start">Exploration</text>
<rect x="267" y="388" width="22" height="14" rx="0" fill="rgba(178,34,34,0.18)" stroke="rgba(31,42,51,0.50)" stroke-width="0.8"/>
<text x="297" y="400" fill="#444444" font-size="15" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start">Publish reserve, 1,000 ms</text>
<rect x="505" y="388" width="22" height="14" rx="0" fill="rgba(178,34,34,0.45)" stroke="rgba(31,42,51,0.50)" stroke-width="0.8"/>
<text x="535" y="400" fill="#444444" font-size="15" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start">Database admission guard, last 500 ms</text>
<text x="30" y="426" fill="#444444" font-size="14" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start">Stages and limits read from BookingOffers and SearchDeadline; the bar is the default reserve, the rerun&#x27;s floor is 800 ms.</text>
<text x="30" y="446" fill="#444444" font-size="14" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start">A refinement the window threshold makes required skips the shed check and runs uncapped to the reserve.</text>
</svg>
</div>
