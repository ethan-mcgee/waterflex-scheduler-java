<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Two ways to fit a new job into a booked day</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #FFFFFF; --color-ink: #1F2A33; --color-muted: #444444; --color-accent: #287A4C;
      --font-sans: 'Calibri', 'Carlito', system-ui, sans-serif; --font-serif: 'Calibri', 'Carlito', serif; --font-mono: 'Consolas', 'Liberation Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1020px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 980px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">WaterFlex scheduler: a briefing</p>
    <h1>Two ways to fit a new job into a booked day</h1>

        <desc id="booking_methods-desc">Insertion tries the new visit in every gap of every eligible route and moves nothing else; bounded search also tries small rearrangements around the affected work, within limits on routes, depth and candidates.</desc>

<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#287A4C"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0B3A66"/></marker>
<marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#444444" stroke-width="1.2"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="6" stroke="#444444" stroke-width="1.2"/></pattern>

        <rect width="100%" height="100%" fill="#FFFFFF"/>

        <line x1="128" y1="116" x2="128" y2="128" stroke="#287A4C" stroke-width="1.2" stroke-dasharray="3,2"/>
        <line x1="180" y1="116" x2="180" y2="128" stroke="#287A4C" stroke-width="1.2" stroke-dasharray="3,2"/>
        <line x1="232" y1="116" x2="232" y2="128" stroke="#287A4C" stroke-width="1.2" stroke-dasharray="3,2"/>
        <line x1="284" y1="116" x2="284" y2="128" stroke="#287A4C" stroke-width="1.2" stroke-dasharray="3,2"/>
        <circle cx="180" cy="92" r="13" fill="rgba(40,122,76,0.14)" stroke="#287A4C" stroke-width="1.4"/>
        <text x="180" y="96" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">N</text>

        <text x="50" y="234" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">D</text>
        <circle cx="102" cy="230" r="13" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>
        <text x="102" y="234" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">1</text>
        <circle cx="154" cy="230" r="13" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>
        <text x="154" y="234" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">2</text>
        <circle cx="206" cy="230" r="13" fill="rgba(40,122,76,0.14)" stroke="#287A4C" stroke-width="1.4"/>
        <text x="206" y="234" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">N</text>
        <circle cx="258" cy="230" r="13" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>

        <circle cx="310" cy="230" r="13" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>
        <text x="310" y="234" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">4</text>
        <text x="40" y="278" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">the first gap that keeps every promise and</text>
        <text x="40" y="294" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">adds no overtime, per window</text>
        <text x="520" y="48" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-weight="700">Bounded search</text>
        <text x="520" y="70" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">ALSO REARRANGES AROUND THE NEW WORK</text>
        <line x1="530" y1="140" x2="790" y2="140" stroke="rgba(31,42,51,0.35)" stroke-width="1.2"/>
        <rect x="520" y="130" width="20" height="20" rx="2" fill="#C9C9C9" stroke="#5A6B7A" stroke-width="1"/>
        <text x="530" y="144" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">D</text>
        <circle cx="582" cy="140" r="13" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>

        <text x="686" y="144" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">3</text>
        <circle cx="738" cy="140" r="13" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>
        <text x="738" y="144" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">4</text>
        <line x1="530" y1="230" x2="686" y2="230" stroke="rgba(31,42,51,0.35)" stroke-width="1.2"/>
        <rect x="520" y="220" width="20" height="20" rx="2" fill="#C9C9C9" stroke="#5A6B7A" stroke-width="1"/>
        <text x="530" y="234" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">D</text>
        <circle cx="582" cy="230" r="13" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>

        <circle cx="634" cy="230" r="13" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>
        <text x="634" y="234" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">6</text>

        <text x="700" y="182" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">3 RELOCATED</text>
        <circle cx="660" cy="92" r="13" fill="rgba(40,122,76,0.14)" stroke="#287A4C" stroke-width="1.4"/>
        <text x="660" y="96" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">N</text>
        <line x1="660" y1="105" x2="660" y2="124" stroke="#287A4C" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="680" y="96" fill="#287A4C" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">N TAKES THE ROOM 3 LEFT</text>
        <text x="520" y="278" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">relocation, swap or reversal; limits on</text>
        <text x="520" y="294" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">routes, depth and candidates</text>

        <rect x="40" y="368" width="440" height="108" rx="6" fill="#FFFFFF"/>
        <rect x="40" y="368" width="440" height="108" rx="6" fill="rgba(40,122,76,0.06)" stroke="#287A4C" stroke-width="1.2"/>
        <text x="56" y="390" fill="#287A4C" font-size="8" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">SERVICE AND COST</text>
        <text x="56" y="418" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">Bounded never used more paid minutes</text>
        <text x="56" y="436" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">or cost than insertion where both</text>
        <text x="56" y="454" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">booked alike</text>
        <rect x="500" y="368" width="440" height="108" rx="6" fill="#FFFFFF"/>
        <rect x="500" y="368" width="440" height="108" rx="6" fill="#FFFFFF" stroke="rgba(31,42,51,0.18)" stroke-width="1"/>
        <text x="516" y="390" fill="#5A6B7A" font-size="8" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">TIME</text>
        <text x="516" y="418" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">More candidates per search: a higher</text>
        <text x="516" y="436" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">p95, and more of it as requests run</text>
        <text x="516" y="454" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">at once</text>
        <line x1="40" y1="524" x2="940" y2="524" stroke="rgba(31,42,51,0.1)" stroke-width="0.8"/>
        <text x="40" y="550" fill="#444444" font-size="8" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">LEGEND</text>
