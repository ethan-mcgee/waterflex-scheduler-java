<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How a booking search spends its five seconds</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #FFFFFF; --color-ink: #1F2A33; --color-muted: #444444; --color-accent: #287A4C;
      --font-sans: 'Calibri', 'Carlito', system-ui, sans-serif; --font-serif: 'Calibri', 'Carlito', serif; --font-mono: 'Consolas', 'Liberation Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1020px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 980px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">WaterFlex scheduler: a briefing</p>
    <h1>How a booking search spends its five seconds</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 980 492" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="deadline_budget-title deadline_budget-desc">
        <title id="deadline_budget-title">How a booking search spends its five seconds</title>
        <desc id="deadline_budget-desc">Schematic timeline of the five-second booking deadline: the insertion pass gives the first answer, an optional polish of up to two seconds runs only when capacity is abundant and no desk is waiting, a required refinement may run to four seconds when capacity is scarce, and the last second is kept to validate and publish the offers.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#444444"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#287A4C"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0B3A66"/></marker>
<marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#444444" stroke-width="1.2"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="6" stroke="#444444" stroke-width="1.2"/></pattern>
        </defs>
        <rect width="100%" height="100%" fill="#FFFFFF"/>
        <line x1="300" y1="56" x2="300" y2="328" stroke="rgba(31,42,51,0.25)" stroke-width="0.8"/>
        <text x="300" y="348" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">0 S</text>
        <line x1="424" y1="56" x2="424" y2="328" stroke="rgba(31,42,51,0.06)" stroke-width="0.8"/>
        <text x="424" y="348" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">1 S</text>
        <line x1="548" y1="56" x2="548" y2="328" stroke="rgba(31,42,51,0.06)" stroke-width="0.8"/>
        <text x="548" y="348" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">2 S</text>
        <line x1="672" y1="56" x2="672" y2="328" stroke="rgba(31,42,51,0.06)" stroke-width="0.8"/>
        <text x="672" y="348" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">3 S</text>
        <line x1="796" y1="56" x2="796" y2="328" stroke="rgba(31,42,51,0.06)" stroke-width="0.8"/>
        <text x="796" y="348" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">4 S</text>
        <line x1="920" y1="56" x2="920" y2="328" stroke="rgba(31,42,51,0.25)" stroke-width="0.8"/>
        <text x="920" y="348" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">5 S</text>
        <line x1="796" y1="56" x2="796" y2="328" stroke="#1F2A33" stroke-width="1" stroke-dasharray="5,4"/>
        <rect x="751.08" y="38" width="89.84" height="16" rx="2" fill="#FFFFFF"/>
        <text x="796" y="50" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SEARCH STOPS</text>
        <line x1="920" y1="56" x2="920" y2="328" stroke="#9c6b50" stroke-width="1.2"/>
        <rect x="858.72" y="38" width="62.56" height="16" rx="2" fill="#FFFFFF"/>
        <text x="890" y="50" fill="#9c6b50" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">DEADLINE</text>
        <text x="284" y="92" fill="#1F2A33" font-size="15" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="end" font-weight="700">Insertion pass</text>
        <text x="284" y="110" fill="#444444" font-size="10" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end">EVERY GAP, NOTHING MOVED</text>
        <rect x="300" y="82" width="62" height="28" rx="3" fill="rgba(94,122,155,0.3)" stroke="#5e7a9b" stroke-width="1.2"/>
        <text x="284" y="156" fill="#1F2A33" font-size="15" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="end" font-weight="700">Optional polish</text>
        <text x="284" y="174" fill="#444444" font-size="10" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end">PLENTY OF WINDOWS, NOBODY WAITING</text>
        <rect x="362" y="146" width="248" height="28" rx="3" fill="rgba(40,122,76,0.14)" stroke="#287A4C" stroke-width="1.2" stroke-dasharray="5,3"/>
        <text x="284" y="220" fill="#1F2A33" font-size="15" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="end" font-weight="700">Required refinement</text>
        <text x="284" y="238" fill="#444444" font-size="10" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end">TOO FEW WINDOWS FOUND</text>
        <rect x="362" y="210" width="434" height="28" rx="3" fill="rgba(94,122,155,0.3)" stroke="#5e7a9b" stroke-width="1.2"/>
        <text x="284" y="284" fill="#1F2A33" font-size="15" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="end" font-weight="700">Validate and publish</text>
        <text x="284" y="302" fill="#444444" font-size="10" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end">CHECKED ALONE, THEN HELD</text>
        <rect x="796" y="274" width="124" height="28" rx="3" fill="rgba(94,122,155,0.3)" stroke="#5e7a9b" stroke-width="1.2"/>
        <rect x="451.31" y="154" width="69.38" height="16" rx="2" fill="#FFFFFF"/>
        <text x="486" y="166" fill="#287A4C" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">UP TO 2 S</text>
        <text x="40" y="394" fill="#1F2A33" font-size="14" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-style="italic">Waiting for a slot, road routing and the database all spend this same budget. The customer always gets the</text>
        <text x="40" y="412" fill="#1F2A33" font-size="14" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-style="italic">insertion pass&#x27;s windows; the polish only makes the same windows cheaper, and is skipped while other desks wait.</text>
        <line x1="40" y1="436" x2="940" y2="436" stroke="rgba(31,42,51,0.1)" stroke-width="0.8"/>
        <text x="40" y="462" fill="#444444" font-size="8" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">LEGEND</text>
        <rect x="110" y="452" width="18" height="12" rx="2" fill="rgba(94,122,155,0.3)" stroke="#5A6B7A" stroke-width="0.8"/>
        <text x="136" y="462" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">ALWAYS OR WHEN NEEDED</text>
        <rect x="308" y="452" width="18" height="12" rx="2" fill="rgba(40,122,76,0.14)" stroke="#5A6B7A" stroke-width="0.8" stroke-dasharray="3,2"/>
        <text x="334" y="462" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">OPTIONAL, SHED UNDER LOAD</text>
        <text x="940" y="462" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end">schematic widths except the 2, 4 and 5 s marks</text>
      </svg>
    </div>
  </div>
</body>
</html>
