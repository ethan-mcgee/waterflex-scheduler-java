<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The bottleneck lesson</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #FFFFFF; --color-ink: #1F2A33; --color-muted: #444444; --color-accent: #287A4C;
      --font-sans: 'Calibri', 'Carlito', system-ui, sans-serif; --font-serif: 'Calibri', 'Carlito', serif; --font-mono: 'Consolas', 'Liberation Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1020px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 980px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">WaterFlex scheduler: a briefing</p>
    <h1>The bottleneck lesson</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 980 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bottleneck-title bottleneck-desc">
        <title id="bottleneck-title">The bottleneck lesson</title>
        <desc id="bottleneck-desc">Three panels: in September a road graph ten times faster answered routing requests far quicker but served the same customers; in October, after the other bottlenecks were gone, the same kind of graph multiplied the booking searches answered in a minute.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#444444"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#287A4C"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0B3A66"/></marker>
<marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#444444" stroke-width="1.2"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="6" stroke="#444444" stroke-width="1.2"/></pattern>
        </defs>
        <rect width="100%" height="100%" fill="#FFFFFF"/>
        <text x="40" y="40" fill="#1F2A33" font-size="15" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-weight="700">September: routing alone</text>
        <text x="40" y="60" fill="#5A6B7A" font-size="8" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">MS TO ANSWER 16 ROAD LEGS</text>
        <line x1="60" y1="400" x2="320" y2="400" stroke="rgba(31,42,51,0.25)" stroke-width="1"/>
        <rect x="89" y="140.836" width="72" height="259.164" fill="#FFFFFF"/>
        <rect x="89" y="140.836" width="72" height="259.164" fill="rgba(154,165,174,0.35)" stroke="#9AA5AE" stroke-width="1"/>
        <text x="125" y="132.836" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">168.3 ms</text>
        <text x="125" y="420" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">OLD GRAPH</text>
        <rect x="219" y="377.441" width="72" height="22.5593" fill="#FFFFFF"/>
        <rect x="219" y="377.441" width="72" height="22.5593" fill="rgba(94,122,155,0.35)" stroke="#5e7a9b" stroke-width="1"/>
        <text x="255" y="369.441" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">14.6 ms</text>
        <text x="255" y="420" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">FAST GRAPH</text>
        <text x="360" y="40" fill="#1F2A33" font-size="15" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-weight="700">September: booking customers</text>
        <text x="360" y="60" fill="#5A6B7A" font-size="8" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">SERVED OF 720</text>
        <line x1="380" y1="400" x2="640" y2="400" stroke="rgba(31,42,51,0.25)" stroke-width="1"/>
        <rect x="409" y="108.17" width="72" height="291.83" fill="#FFFFFF"/>
        <rect x="409" y="108.17" width="72" height="291.83" fill="rgba(154,165,174,0.35)" stroke="#9AA5AE" stroke-width="1"/>
        <text x="445" y="100.17" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">379</text>
        <text x="445" y="420" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">OLD GRAPH</text>
        <rect x="539" y="105.09" width="72" height="294.91" fill="#FFFFFF"/>
        <rect x="539" y="105.09" width="72" height="294.91" fill="rgba(94,122,155,0.35)" stroke="#5e7a9b" stroke-width="1"/>
        <text x="575" y="97.09" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">383</text>
        <text x="575" y="420" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">FAST GRAPH</text>
        <text x="680" y="40" fill="#1F2A33" font-size="15" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-weight="700">October: booking capacity</text>
        <text x="680" y="60" fill="#5A6B7A" font-size="8" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">SEARCHES IN 60 S, 5 DESKS</text>
        <line x1="700" y1="400" x2="920" y2="400" stroke="rgba(31,42,51,0.25)" stroke-width="1"/>
        <rect x="719" y="340.659" width="72" height="59.3413" fill="#FFFFFF"/>
        <rect x="719" y="340.659" width="72" height="59.3413" fill="rgba(154,165,174,0.35)" stroke="#9AA5AE" stroke-width="1"/>
        <text x="755" y="332.659" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">289</text>
        <text x="755" y="420" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">OLD GRAPH</text>
        <rect x="829" y="190.56" width="72" height="209.44" fill="#FFFFFF"/>
        <rect x="829" y="190.56" width="72" height="209.44" fill="rgba(40,122,76,0.12)" stroke="#287A4C" stroke-width="1"/>
        <text x="865" y="182.56" fill="#287A4C" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">1,020</text>
        <text x="865" y="420" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">FAST GRAPH</text>
        <text x="40" y="456" fill="#1F2A33" font-size="14" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-style="italic">A faster part only pays when it is the part holding the line. In September the booking search was waiting</text>
        <text x="40" y="474" fill="#1F2A33" font-size="14" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-style="italic">on other things; once those were fixed, routing became the constraint and the same idea paid off.</text>
        <line x1="40" y1="504" x2="940" y2="504" stroke="rgba(31,42,51,0.1)" stroke-width="0.8"/>
        <text x="40" y="530" fill="#444444" font-size="8" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">LEGEND</text>
        <rect x="110" y="520" width="18" height="12" rx="2" fill="rgba(154,165,174,0.35)" stroke="#5A6B7A" stroke-width="0.8"/>
        <text x="136" y="530" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">OLD GRAPH</text>
        <rect x="228" y="520" width="18" height="12" rx="2" fill="rgba(94,122,155,0.35)" stroke="#5A6B7A" stroke-width="0.8"/>
        <text x="254" y="530" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">FAST GRAPH</text>
        <rect x="352" y="520" width="18" height="12" rx="2" fill="rgba(40,122,76,0.12)" stroke="#5A6B7A" stroke-width="0.8"/>
        <text x="378" y="530" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">WHERE IT PAID</text>
        <text x="940" y="530" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end">each panel is its own run</text>
      </svg>
    </div>
  </div>
</body>
</html>
