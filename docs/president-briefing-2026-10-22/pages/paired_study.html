<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How one study decides</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #FFFFFF; --color-ink: #1F2A33; --color-muted: #444444; --color-accent: #287A4C;
      --font-sans: 'Calibri', 'Carlito', system-ui, sans-serif; --font-serif: 'Calibri', 'Carlito', serif; --font-mono: 'Consolas', 'Liberation Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1020px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 980px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">WaterFlex scheduler: a briefing</p>
    <h1>How one study decides</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 980 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="paired_study-title paired_study-desc">
        <title id="paired_study-title">How one study decides</title>
        <desc id="paired_study-desc">Schematic with no data: the same synthetic days, seeds and seconds run on today&#x27;s code and on the change, each case compared with its own twin; the median of the paired results is held against a bar written before the run; a change that passes is then rerun through the public API on the rehearsal stack before it ships.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#444444"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#287A4C"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0B3A66"/></marker>
<marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#444444" stroke-width="1.2"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="6" stroke="#444444" stroke-width="1.2"/></pattern>
        </defs>
        <rect width="100%" height="100%" fill="#FFFFFF"/>
        <rect x="40" y="40" width="900" height="64" rx="6" fill="#FFFFFF"/>
        <rect x="40" y="40" width="900" height="64" rx="6" fill="#DCE6EF" stroke="#5A6B7A" stroke-width="1"/>
        <text x="490" y="68" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="middle" font-weight="700">The same synthetic days, seeds and seconds for both sides</text>
        <text x="490" y="88" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">FIXED BEFORE THE RUN, ORDER ALTERNATES, ONE FRESH PROCESS PER CASE</text>
        <rect x="120" y="148" width="300" height="76" rx="6" fill="#FFFFFF"/>
        <rect x="120" y="148" width="300" height="76" rx="6" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>
        <text x="270" y="182" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="middle" font-weight="700">Control</text>
        <text x="270" y="202" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">TODAY&#x27;S CODE OR METHOD</text>
        <rect x="560" y="148" width="300" height="76" rx="6" fill="#FFFFFF"/>
        <rect x="560" y="148" width="300" height="76" rx="6" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>
        <text x="710" y="182" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="middle" font-weight="700">Treatment</text>
        <text x="710" y="202" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">THE CHANGE UNDER TEST</text>
        <line x1="270" y1="104" x2="270" y2="148" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="710" y1="104" x2="710" y2="148" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="300" y="268" width="380" height="76" rx="6" fill="#FFFFFF"/>
        <rect x="300" y="268" width="380" height="76" rx="6" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>
        <text x="490" y="302" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="middle" font-weight="700">Case by case: treatment vs its twin</text>
        <text x="490" y="322" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">SAVING IN CENTS, OR SPEED RATIO</text>
        <path d="M270,224 L270,238 Q270,246 278,246 L432,246 Q440,246 440,254 L440,268" fill="none" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M710,224 L710,238 Q710,246 702,246 L548,246 Q540,246 540,254 L540,268" fill="none" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <polygon points="490,358 640,410 490,462 340,410" fill="#FFFFFF"/>
        <polygon points="490,358 640,410 490,462 340,410" fill="#F4F6F8" stroke="#5A6B7A" stroke-width="1"/>
        <text x="490" y="406" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">MEDIAN CLEARS THE BAR</text>
        <text x="490" y="422" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">WRITTEN BEFORE THE RUN?</text>
        <line x1="490" y1="344" x2="490" y2="358" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="40" y="372" width="200" height="76" rx="6" fill="#FFFFFF"/>
        <rect x="40" y="372" width="200" height="76" rx="6" fill="#F4F6F8" stroke="#5A6B7A" stroke-width="1"/>
        <text x="140" y="406" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="middle" font-weight="700">Rejected</text>
        <text x="140" y="426" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">RECORDED, KEPT ON A BRANCH</text>
        <rect x="740" y="372" width="200" height="76" rx="6" fill="#FFFFFF"/>
        <rect x="740" y="372" width="200" height="76" rx="6" fill="rgba(40,122,76,0.1)" stroke="#287A4C" stroke-width="1.4"/>
        <text x="840" y="406" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="middle" font-weight="700">Rehearsal stack</text>
        <text x="840" y="426" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">SAME CHANGE THROUGH THE API</text>
        <line x1="340" y1="410" x2="240" y2="410" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="279.18" y="390" width="21.64" height="16" rx="2" fill="#FFFFFF"/>
        <text x="290" y="402" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
        <line x1="640" y1="410" x2="740" y2="410" stroke="#287A4C" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="675.77" y="390" width="28.46" height="16" rx="2" fill="#FFFFFF"/>
        <text x="690" y="402" fill="#287A4C" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
        <text x="40" y="500" fill="#1F2A33" font-size="14" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-style="italic">Every case has a twin, so a hard day is compared with the same hard day. The bar is a decision rule</text>
        <text x="40" y="518" fill="#1F2A33" font-size="14" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-style="italic">set in advance (for speed, 1.05 times on the phase the change targets), so the result cannot move the goalposts.</text>
        <line x1="40" y1="552" x2="940" y2="552" stroke="rgba(31,42,51,0.1)" stroke-width="0.8"/>
        <text x="40" y="578" fill="#444444" font-size="8" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">LEGEND</text>
        <rect x="110" y="568" width="18" height="12" rx="2" fill="#DCE6EF" stroke="#5A6B7A" stroke-width="0.8"/>
        <text x="136" y="578" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">SHARED INPUTS</text>
        <rect x="252" y="568" width="18" height="12" rx="2" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="0.8"/>
        <text x="278" y="578" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">STEP</text>
        <rect x="336" y="568" width="18" height="12" rx="2" fill="rgba(40,122,76,0.1)" stroke="#5A6B7A" stroke-width="0.8"/>
        <text x="362" y="578" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">SHIPS AFTER THIS CHECK</text>
        <text x="940" y="578" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end">schematic, no data</text>
      </svg>
    </div>
  </div>
</body>
</html>
