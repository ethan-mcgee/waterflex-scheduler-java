<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>When each search found its best plan</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #FFFFFF; --color-ink: #1F2A33; --color-muted: #444444; --color-accent: #287A4C;
      --font-sans: 'Calibri', 'Carlito', system-ui, sans-serif; --font-serif: 'Calibri', 'Carlito', serif; --font-mono: 'Consolas', 'Liberation Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1020px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 980px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">WaterFlex scheduler: a briefing</p>
    <h1>When each search found its best plan</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 980 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="convergence-title convergence-desc">
        <title id="convergence-title">When each search found its best plan</title>
        <desc id="convergence-desc">Line chart of the mean point in the cost search, as a share of its time, at which each method found its final best plan, for Tabu, Tabu + K opt, K opt and late acceptance at 5 to 50 technicians.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#444444"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#287A4C"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0B3A66"/></marker>
<marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#444444" stroke-width="1.2"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="6" stroke="#444444" stroke-width="1.2"/></pattern>
        </defs>
        <rect width="100%" height="100%" fill="#FFFFFF"/>
        <text x="64" y="28" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-weight="700">Share of the cost search used before the best plan appeared</text>
        <line x1="120" y1="420" x2="740" y2="420" stroke="rgba(31,42,51,0.25)" stroke-width="1"/>
        <text x="112" y="424" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end">0%</text>
        <line x1="120" y1="347.2" x2="740" y2="347.2" stroke="rgba(31,42,51,0.08)" stroke-width="0.8"/>
        <text x="112" y="351.2" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end">20%</text>
        <line x1="120" y1="274.4" x2="740" y2="274.4" stroke="rgba(31,42,51,0.08)" stroke-width="0.8"/>
        <text x="112" y="278.4" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end">40%</text>
        <line x1="120" y1="201.6" x2="740" y2="201.6" stroke="rgba(31,42,51,0.08)" stroke-width="0.8"/>
        <text x="112" y="205.6" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end">60%</text>
        <line x1="120" y1="128.8" x2="740" y2="128.8" stroke="rgba(31,42,51,0.08)" stroke-width="0.8"/>
        <text x="112" y="132.8" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end">80%</text>
        <line x1="120" y1="56" x2="740" y2="56" stroke="rgba(31,42,51,0.08)" stroke-width="0.8"/>
        <text x="112" y="60" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end">100%</text>
        <line x1="120" y1="56" x2="120" y2="420" stroke="rgba(31,42,51,0.25)" stroke-width="1"/>
        <text x="64" y="238" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.10em" transform="rotate(-90 64 238)">SHARE OF THE TIME</text>
        <text x="197.5" y="440" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">5 TECHS</text>
        <text x="352.5" y="440" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">10 TECHS</text>
        <text x="507.5" y="440" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">20 TECHS</text>
        <text x="662.5" y="440" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">50 TECHS</text>
        <polyline points="197.5,391.033 352.5,365.779 507.5,191.69 662.5,171.51" fill="none" stroke="#b8915a" stroke-width="1.8" stroke-linejoin="round"/>
        <circle cx="197.5" cy="391.033" r="4" fill="#b8915a"/>
        <circle cx="352.5" cy="365.779" r="4" fill="#b8915a"/>
        <circle cx="507.5" cy="191.69" r="4" fill="#b8915a"/>
        <circle cx="662.5" cy="171.51" r="4" fill="#b8915a"/>
        <polyline points="197.5,365.19 352.5,259.696 507.5,183.488 662.5,168.827" fill="none" stroke="#287A4C" stroke-width="1.8" stroke-linejoin="round"/>
        <circle cx="197.5" cy="365.19" r="4" fill="#287A4C"/>
        <circle cx="352.5" cy="259.696" r="4" fill="#287A4C"/>
        <circle cx="507.5" cy="183.488" r="4" fill="#287A4C"/>
        <circle cx="662.5" cy="168.827" r="4" fill="#287A4C"/>
        <polyline points="197.5,403.221 352.5,243.506 507.5,114.702 662.5,67.6471" fill="none" stroke="#6e6479" stroke-width="1.8" stroke-linejoin="round"/>
        <circle cx="197.5" cy="403.221" r="4" fill="#6e6479"/>
        <circle cx="352.5" cy="243.506" r="4" fill="#6e6479"/>
        <circle cx="507.5" cy="114.702" r="4" fill="#6e6479"/>
        <circle cx="662.5" cy="67.6471" r="4" fill="#6e6479"/>
        <polyline points="197.5,406.704 352.5,283.398 507.5,132.578 662.5,71.456" fill="none" stroke="#9c6b50" stroke-width="1.8" stroke-linejoin="round"/>
        <circle cx="197.5" cy="406.704" r="4" fill="#9c6b50"/>
        <circle cx="352.5" cy="283.398" r="4" fill="#9c6b50"/>
        <circle cx="507.5" cy="132.578" r="4" fill="#9c6b50"/>
        <circle cx="662.5" cy="71.456" r="4" fill="#9c6b50"/>
        <text x="754" y="71.6471" fill="#6e6479" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">K opt alone 97%</text>
        <text x="754" y="87.6471" fill="#9c6b50" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">Late acceptance 96%</text>
        <text x="754" y="172.827" fill="#287A4C" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">Tabu + K opt 69%</text>
        <text x="754" y="188.827" fill="#b8915a" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">Tabu 68%</text>
        <line x1="120" y1="92.4" x2="740" y2="92.4" stroke="#9c6b50" stroke-width="1" stroke-dasharray="5,4"/>
        <rect x="190.52" y="74.4" width="198.96" height="16" rx="2" fill="#FFFFFF"/>
        <text x="290" y="86.4" fill="#9c6b50" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">BEST FOUND IN THE LAST TENTH</text>
        <line x1="40" y1="484" x2="940" y2="484" stroke="rgba(31,42,51,0.1)" stroke-width="0.8"/>
        <text x="40" y="510" fill="#444444" font-size="8" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">LEGEND</text>
        <line x1="110" y1="506" x2="146" y2="506" stroke="#287A4C" stroke-width="1.6"/>
        <text x="156" y="510" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">TABU + K OPT</text>
        <line x1="268" y1="506" x2="304" y2="506" stroke="#b8915a" stroke-width="1.6"/>
        <text x="314" y="510" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">TABU</text>
        <line x1="372" y1="506" x2="408" y2="506" stroke="#6e6479" stroke-width="1.6"/>
        <text x="418" y="510" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">K OPT</text>
        <line x1="480" y1="506" x2="516" y2="506" stroke="#9c6b50" stroke-width="1.6"/>
        <text x="526" y="510" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">LATE ACCEPTANCE</text>
        <text x="940" y="532" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end">first daily study, mean of 160 cases per point</text>
      </svg>
    </div>
  </div>
</body>
</html>
