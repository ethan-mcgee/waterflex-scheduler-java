<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Five results in one page</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #FFFFFF; --color-ink: #1F2A33; --color-muted: #444444; --color-accent: #287A4C;
      --font-sans: 'Calibri', 'Carlito', system-ui, sans-serif; --font-serif: 'Calibri', 'Carlito', serif; --font-mono: 'Consolas', 'Liberation Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1020px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 980px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">WaterFlex scheduler: a briefing</p>
    <h1>Five results in one page</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 980 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="headline-title headline-desc">
        <title id="headline-title">Five results in one page</title>
        <desc id="headline-desc">Five summary cards: holds lost at five booking desks, booking searches per minute on the rehearsal stack, the daily search&#x27;s saving over the old method, searches with no offer in a booked-out week, and the engine&#x27;s speed on the shipped changes.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#444444"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#287A4C"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0B3A66"/></marker>
<marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#444444" stroke-width="1.2"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="6" stroke="#444444" stroke-width="1.2"/></pattern>
        </defs>
        <rect width="100%" height="100%" fill="#FFFFFF"/>
        <rect x="40" y="24" width="312" height="156" rx="6" fill="#FFFFFF"/>
        <rect x="40" y="24" width="312" height="156" rx="6" fill="#FFFFFF" stroke="rgba(31,42,51,0.18)" stroke-width="1"/>
        <text x="56" y="46" fill="#5A6B7A" font-size="8" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">HOLDS LOST AT CONFIRM</text>
        <text x="56" y="86" fill="#1F2A33" font-size="28" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-weight="700">37% to 0%</text>
        <text x="56" y="114" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">customers&#x27; chosen windows lost</text>
        <text x="56" y="132" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">at five desks, first test vs fix</text>
        <text x="56" y="150" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">BOOKING</text>
        <rect x="364" y="24" width="300" height="156" rx="6" fill="#FFFFFF"/>
        <rect x="364" y="24" width="300" height="156" rx="6" fill="#FFFFFF" stroke="rgba(31,42,51,0.18)" stroke-width="1"/>
        <text x="380" y="46" fill="#5A6B7A" font-size="8" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">BOOKING CAPACITY</text>
        <text x="380" y="86" fill="#1F2A33" font-size="28" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-weight="700">289 to 1,161</text>
        <text x="380" y="114" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">searches a minute, five desks</text>
        <text x="380" y="132" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">on the rehearsal stack</text>
        <text x="380" y="150" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">BOOKING</text>
        <rect x="676" y="24" width="264" height="156" rx="6" fill="#FFFFFF"/>
        <rect x="676" y="24" width="264" height="156" rx="6" fill="#FFFFFF" stroke="rgba(31,42,51,0.18)" stroke-width="1"/>
        <text x="692" y="46" fill="#5A6B7A" font-size="8" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">BUSY WEEKS</text>
        <text x="692" y="86" fill="#1F2A33" font-size="28" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-weight="700">51% to 6%</text>
        <text x="692" y="114" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">searches that offered nothing</text>
        <text x="692" y="132" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">fixed vs dynamic horizon</text>
        <text x="692" y="150" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">BOOKING</text>
        <rect x="40" y="196" width="472" height="156" rx="6" fill="#FFFFFF"/>
        <rect x="40" y="196" width="472" height="156" rx="6" fill="rgba(40,122,76,0.06)" stroke="#287A4C" stroke-width="1.2"/>
        <text x="56" y="218" fill="#287A4C" font-size="8" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">DAILY SEARCH CHOICE</text>
        <text x="56" y="258" fill="#287A4C" font-size="28" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-weight="700">$7.55 a day</text>
        <text x="56" y="286" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">Tabu + K opt over Tabu, per metro day</text>
        <text x="56" y="304" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">mean of 640 matched synthetic days, every fleet size</text>
        <text x="56" y="322" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">DAILY PLAN, MODELED COST</text>
        <rect x="524" y="196" width="416" height="156" rx="6" fill="#FFFFFF"/>
        <rect x="524" y="196" width="416" height="156" rx="6" fill="#FFFFFF" stroke="rgba(31,42,51,0.18)" stroke-width="1"/>
        <text x="540" y="218" fill="#5A6B7A" font-size="8" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">ENGINE SPEED, SHIPPED</text>
        <text x="540" y="258" fill="#1F2A33" font-size="28" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-weight="700">1.17x to 1.29x</text>
        <text x="540" y="286" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">schedule changes tried per second</text>
        <text x="540" y="304" fill="#1F2A33" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">this week&#x27;s engine work, 10 to 50 techs</text>
        <text x="540" y="322" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">MEASURED THROUGH THE PUBLIC API</text>
        <line x1="40" y1="372" x2="940" y2="372" stroke="rgba(31,42,51,0.1)" stroke-width="0.8"/>
        <text x="40" y="398" fill="#444444" font-size="8" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">LEGEND</text>
        <rect x="110" y="388" width="18" height="12" rx="2" fill="rgba(40,122,76,0.06)" stroke="#5A6B7A" stroke-width="0.8"/>
        <text x="136" y="398" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">THE RESULT WORTH MONEY EVERY DAY</text>
        <rect x="384" y="388" width="18" height="12" rx="2" fill="#FFFFFF" stroke="#5A6B7A" stroke-width="0.8"/>
        <text x="410" y="398" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">OPERATIONAL RESULT</text>
        <text x="940" y="398" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end">each figure is read against its own study&#x27;s control</text>
      </svg>
    </div>
  </div>
</body>
</html>
