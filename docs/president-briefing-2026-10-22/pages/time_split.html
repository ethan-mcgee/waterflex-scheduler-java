<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Where a booking search&#x27;s time goes</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #FFFFFF; --color-ink: #1F2A33; --color-muted: #444444; --color-accent: #287A4C;
      --font-sans: 'Calibri', 'Carlito', system-ui, sans-serif; --font-serif: 'Calibri', 'Carlito', serif; --font-mono: 'Consolas', 'Liberation Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1020px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 980px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">WaterFlex scheduler: a briefing</p>
    <h1>Where a booking search&#x27;s time goes</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 980 468" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="time_split-title time_split-desc">
        <title id="time_split-title">Where a booking search&#x27;s time goes</title>
        <desc id="time_split-desc">Stacked horizontal bars of the median booking search&#x27;s server time, split into waiting for a slot, road routing, the calculation engine and the database, at four stages of the routing and admission work on the rehearsal stack.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#444444"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#287A4C"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0B3A66"/></marker>
<marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#444444" stroke-width="1.2"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="6" stroke="#444444" stroke-width="1.2"/></pattern>
        </defs>
        <rect width="100%" height="100%" fill="#FFFFFF"/>
        <line x1="300" y1="52" x2="300" y2="348" stroke="rgba(31,42,51,0.25)" stroke-width="0.8"/>
        <text x="300" y="368" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">0 MS</text>
        <line x1="450" y1="52" x2="450" y2="348" stroke="rgba(31,42,51,0.08)" stroke-width="0.8"/>
        <text x="450" y="368" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">250 MS</text>
        <line x1="600" y1="52" x2="600" y2="348" stroke="rgba(31,42,51,0.08)" stroke-width="0.8"/>
        <text x="600" y="368" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">500 MS</text>
        <line x1="750" y1="52" x2="750" y2="348" stroke="rgba(31,42,51,0.08)" stroke-width="0.8"/>
        <text x="750" y="368" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">750 MS</text>
        <line x1="900" y1="52" x2="900" y2="348" stroke="rgba(31,42,51,0.08)" stroke-width="0.8"/>
        <text x="900" y="368" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">1,000 MS</text>
        <text x="284" y="86" fill="#1F2A33" font-size="14" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="end" font-weight="700">Rehearsal baseline</text>
        <rect x="300" y="68" width="254.4" height="28" fill="rgba(154,165,174,0.5)" stroke="#9AA5AE" stroke-width="1"/>
        <rect x="554.4" y="68" width="211.8" height="28" fill="rgba(94,122,155,0.45)" stroke="#5e7a9b" stroke-width="1"/>
        <rect x="766.2" y="68" width="7.2" height="28" fill="rgba(184,145,90,0.5)" stroke="#b8915a" stroke-width="1"/>
        <rect x="773.4" y="68" width="16.8" height="28" fill="rgba(110,100,121,0.45)" stroke="#6e6479" stroke-width="1"/>
        <text x="800.2" y="87" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">817 ms</text>
        <text x="284" y="162" fill="#1F2A33" font-size="14" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="end" font-weight="700">Parallel, old graph</text>
        <rect x="300" y="144" width="136.8" height="28" fill="rgba(154,165,174,0.5)" stroke="#9AA5AE" stroke-width="1"/>
        <rect x="436.8" y="144" width="118.2" height="28" fill="rgba(94,122,155,0.45)" stroke="#5e7a9b" stroke-width="1"/>
        <rect x="555" y="144" width="7.8" height="28" fill="rgba(184,145,90,0.5)" stroke="#b8915a" stroke-width="1"/>
        <rect x="562.8" y="144" width="20.4" height="28" fill="rgba(110,100,121,0.45)" stroke="#6e6479" stroke-width="1"/>
        <text x="593.2" y="163" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">472 ms</text>
        <text x="284" y="238" fill="#1F2A33" font-size="14" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="end" font-weight="700">Fast road graph</text>
        <rect x="300" y="220" width="56.4" height="28" fill="rgba(154,165,174,0.5)" stroke="#9AA5AE" stroke-width="1"/>
        <rect x="356.4" y="220" width="39" height="28" fill="rgba(94,122,155,0.45)" stroke="#5e7a9b" stroke-width="1"/>
        <rect x="395.4" y="220" width="7.2" height="28" fill="rgba(184,145,90,0.5)" stroke="#b8915a" stroke-width="1"/>
        <rect x="402.6" y="220" width="19.8" height="28" fill="rgba(110,100,121,0.45)" stroke="#6e6479" stroke-width="1"/>
        <text x="432.4" y="239" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">204 ms</text>
        <text x="284" y="314" fill="#287A4C" font-size="14" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="end" font-weight="700">Confirms go first</text>
        <rect x="300" y="296" width="70.2" height="28" fill="rgba(154,165,174,0.5)" stroke="#9AA5AE" stroke-width="1"/>
        <rect x="370.2" y="296" width="33.6" height="28" fill="rgba(94,122,155,0.45)" stroke="#5e7a9b" stroke-width="1"/>
        <rect x="403.8" y="296" width="7.2" height="28" fill="rgba(184,145,90,0.5)" stroke="#b8915a" stroke-width="1"/>
        <rect x="411" y="296" width="11.4" height="28" fill="rgba(110,100,121,0.45)" stroke="#6e6479" stroke-width="1"/>
        <text x="432.4" y="315" fill="#287A4C" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" font-weight="700">204 ms</text>
        <rect x="296" y="292" width="130.4" height="36" rx="3" fill="none" stroke="#287A4C" stroke-width="1.6"/>
        <line x1="40" y1="396" x2="940" y2="396" stroke="rgba(31,42,51,0.1)" stroke-width="0.8"/>
        <text x="40" y="422" fill="#444444" font-size="8" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">LEGEND</text>
        <rect x="110" y="412" width="18" height="12" rx="2" fill="rgba(154,165,174,0.5)" stroke="#5A6B7A" stroke-width="0.8"/>
        <text x="136" y="422" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">WAITING FOR A SLOT</text>
        <rect x="288" y="412" width="18" height="12" rx="2" fill="rgba(94,122,155,0.45)" stroke="#5A6B7A" stroke-width="0.8"/>
        <text x="314" y="422" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">ROAD ROUTING</text>
        <rect x="424" y="412" width="18" height="12" rx="2" fill="rgba(184,145,90,0.5)" stroke="#5A6B7A" stroke-width="0.8"/>
        <text x="450" y="422" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">CALCULATION</text>
        <rect x="556" y="412" width="18" height="12" rx="2" fill="rgba(110,100,121,0.45)" stroke="#5A6B7A" stroke-width="0.8"/>
        <text x="582" y="422" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">DATABASE</text>
        <text x="940" y="422" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end">median search, five desks</text>
      </svg>
    </div>
  </div>
</body>
</html>
