<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost holds, before and after the fix</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #FFFFFF; --color-ink: #1F2A33; --color-muted: #444444; --color-accent: #287A4C;
      --font-sans: 'Calibri', 'Carlito', system-ui, sans-serif; --font-serif: 'Calibri', 'Carlito', serif; --font-mono: 'Consolas', 'Liberation Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1020px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 980px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">WaterFlex scheduler: a briefing</p>
    <h1>Lost holds, before and after the fix</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 980 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="holds-title holds-desc">
        <title id="holds-title">Lost holds, before and after the fix</title>
        <desc id="holds-desc">Bars of the share of customer-chosen windows lost at confirm at one, five and ten booking desks, in the first load test and after the fix, with every after bar at zero.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#444444"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#287A4C"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0B3A66"/></marker>
<marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#444444" stroke-width="1.2"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="6" stroke="#444444" stroke-width="1.2"/></pattern>
        </defs>
        <rect width="100%" height="100%" fill="#FFFFFF"/>
        <text x="54" y="28" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-weight="700">Chosen windows lost at confirm</text>
        <line x1="110" y1="400" x2="940" y2="400" stroke="rgba(31,42,51,0.25)" stroke-width="1"/>
        <text x="102" y="404" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end">0%</text>
        <line x1="110" y1="342.667" x2="940" y2="342.667" stroke="rgba(31,42,51,0.08)" stroke-width="0.8"/>
        <text x="102" y="346.667" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end">10%</text>
        <line x1="110" y1="285.333" x2="940" y2="285.333" stroke="rgba(31,42,51,0.08)" stroke-width="0.8"/>
        <text x="102" y="289.333" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end">20%</text>
        <line x1="110" y1="228" x2="940" y2="228" stroke="rgba(31,42,51,0.08)" stroke-width="0.8"/>
        <text x="102" y="232" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end">30%</text>
        <line x1="110" y1="170.667" x2="940" y2="170.667" stroke="rgba(31,42,51,0.08)" stroke-width="0.8"/>
        <text x="102" y="174.667" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end">40%</text>
        <line x1="110" y1="113.333" x2="940" y2="113.333" stroke="rgba(31,42,51,0.08)" stroke-width="0.8"/>
        <text x="102" y="117.333" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end">50%</text>
        <line x1="110" y1="56" x2="940" y2="56" stroke="rgba(31,42,51,0.08)" stroke-width="0.8"/>
        <text x="102" y="60" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end">60%</text>
        <line x1="110" y1="56" x2="110" y2="400" stroke="rgba(31,42,51,0.25)" stroke-width="1"/>
        <text x="54" y="228" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.10em" transform="rotate(-90 54 228)">% LOST</text>
        <rect x="180.333" y="400" width="64" height="0" fill="#FFFFFF"/>
        <rect x="180.333" y="400" width="64" height="0" fill="rgba(156,107,80,0.3)" stroke="#9c6b50" stroke-width="1"/>
        <text x="212.333" y="392" fill="#9c6b50" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">0%</text>
        <rect x="252.333" y="397.707" width="64" height="2.29333" fill="#FFFFFF"/>
        <rect x="252.333" y="397.707" width="64" height="2.29333" fill="rgba(40,122,76,0.12)" stroke="#287A4C" stroke-width="1"/>
        <text x="284.333" y="390" fill="#287A4C" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">0%</text>
        <text x="248.333" y="420" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">1 DESK</text>
        <rect x="457" y="188.772" width="64" height="211.228" fill="#FFFFFF"/>
        <rect x="457" y="188.772" width="64" height="211.228" fill="rgba(156,107,80,0.3)" stroke="#9c6b50" stroke-width="1"/>
        <text x="489" y="180.772" fill="#9c6b50" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">37%</text>
        <rect x="529" y="397.707" width="64" height="2.29333" fill="#FFFFFF"/>
        <rect x="529" y="397.707" width="64" height="2.29333" fill="rgba(40,122,76,0.12)" stroke="#287A4C" stroke-width="1"/>
        <text x="561" y="390" fill="#287A4C" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">0%</text>
        <text x="525" y="420" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">5 DESKS</text>
        <rect x="733.667" y="61.8803" width="64" height="338.12" fill="#FFFFFF"/>
        <rect x="733.667" y="61.8803" width="64" height="338.12" fill="rgba(156,107,80,0.3)" stroke="#9c6b50" stroke-width="1"/>
        <text x="765.667" y="53.8803" fill="#9c6b50" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">59%</text>
        <rect x="805.667" y="397.707" width="64" height="2.29333" fill="#FFFFFF"/>
        <rect x="805.667" y="397.707" width="64" height="2.29333" fill="rgba(40,122,76,0.12)" stroke="#287A4C" stroke-width="1"/>
        <text x="837.667" y="390" fill="#287A4C" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">0%</text>
        <text x="801.667" y="420" fill="#444444" font-size="12" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle">10 DESKS</text>
        <line x1="40" y1="444" x2="940" y2="444" stroke="rgba(31,42,51,0.1)" stroke-width="0.8"/>
        <text x="40" y="470" fill="#444444" font-size="8" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">LEGEND</text>
        <rect x="110" y="460" width="18" height="12" rx="2" fill="rgba(156,107,80,0.3)" stroke="#5A6B7A" stroke-width="0.8"/>
        <text x="136" y="470" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">FIRST LOAD TEST</text>
        <rect x="268" y="460" width="18" height="12" rx="2" fill="rgba(40,122,76,0.12)" stroke="#5A6B7A" stroke-width="0.8"/>
        <text x="294" y="470" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">AFTER THE FIX, FRESH ADDRESSES</text>
        <text x="940" y="470" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end">every desk confirms its chosen windows</text>
      </svg>
    </div>
  </div>
</body>
</html>
