<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How the daily search ranks two plans</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #FFFFFF; --color-ink: #1F2A33; --color-muted: #444444; --color-accent: #287A4C;
      --font-sans: 'Calibri', 'Carlito', system-ui, sans-serif; --font-serif: 'Calibri', 'Carlito', serif; --font-mono: 'Consolas', 'Liberation Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1020px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 980px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">WaterFlex scheduler: a briefing</p>
    <h1>How the daily search ranks two plans</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 980 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="score_ladder-title score_ladder-desc">

        <desc id="score_ladder-desc">Schematic with no data: the daily score&#x27;s seven levels, five hard and two soft, each with what it counts and its unit, compared from the top; a plan wins at the first level where the two differ, so no saving lower down can buy back a broken promise higher up.</desc>

<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0B3A66"/></marker>
<marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#444444" stroke-width="1.2"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="6" stroke="#444444" stroke-width="1.2"/></pattern>
        </defs>
        <rect width="100%" height="100%" fill="#FFFFFF"/>
        <line x1="64" y1="48" x2="64" y2="444" stroke="#444444" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="56" y="470" fill="#5A6B7A" font-size="8" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">COMPARED IN THIS ORDER</text>
        <rect x="96" y="40" width="560" height="52" rx="6" fill="#FFFFFF"/>
        <rect x="96" y="40" width="560" height="52" rx="6" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>
        <rect x="108" y="58" width="56" height="16" rx="2" fill="transparent" stroke="rgba(31,42,51,0.4)" stroke-width="0.8"/>
        <text x="136" y="70" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">HARD 0</text>
        <text x="196" y="63" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-weight="700">Categorical</text>
        <text x="196" y="81" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">missing skills, roads with no route</text>
        <text x="642" y="71" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end">COUNT</text>
        <rect x="96" y="100" width="560" height="52" rx="6" fill="#FFFFFF"/>
        <rect x="96" y="100" width="560" height="52" rx="6" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>
        <rect x="108" y="118" width="56" height="16" rx="2" fill="transparent" stroke="rgba(31,42,51,0.4)" stroke-width="0.8"/>
        <text x="136" y="130" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">HARD 1</text>
        <text x="196" y="123" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-weight="700">Promises and limits</text>
        <text x="196" y="141" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">late arrival, absence, return, capacity</text>
        <text x="642" y="131" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end">SECONDS</text>
        <rect x="96" y="160" width="560" height="52" rx="6" fill="#FFFFFF"/>
        <rect x="96" y="160" width="560" height="52" rx="6" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>
        <rect x="108" y="178" width="56" height="16" rx="2" fill="transparent" stroke="rgba(31,42,51,0.4)" stroke-width="0.8"/>
        <text x="136" y="190" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">HARD 2</text>
        <text x="196" y="183" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-weight="700">Unassigned</text>
        <text x="196" y="201" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">visits left without a technician</text>
        <text x="642" y="191" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end">COUNT</text>
        <rect x="96" y="220" width="560" height="52" rx="6" fill="#FFFFFF"/>
        <rect x="96" y="220" width="560" height="52" rx="6" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>
        <rect x="108" y="238" width="56" height="16" rx="2" fill="transparent" stroke="rgba(31,42,51,0.4)" stroke-width="0.8"/>
        <text x="136" y="250" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">HARD 3</text>
        <text x="196" y="243" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-weight="700">Overtime target</text>
        <text x="196" y="261" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">off the overtime the cost search proved</text>
        <text x="642" y="251" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end">MINUTES</text>
        <rect x="96" y="280" width="560" height="52" rx="6" fill="#FFFFFF"/>
        <rect x="96" y="280" width="560" height="52" rx="6" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="1"/>
        <rect x="108" y="298" width="56" height="16" rx="2" fill="transparent" stroke="rgba(31,42,51,0.4)" stroke-width="0.8"/>
        <text x="136" y="310" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">HARD 4</text>
        <text x="196" y="303" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-weight="700">Cost ceiling</text>
        <text x="196" y="321" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">above the 2 percent fairness allowance</text>
        <text x="642" y="311" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end">CENTS</text>
        <rect x="96" y="340" width="560" height="52" rx="6" fill="#FFFFFF"/>
        <rect x="96" y="340" width="560" height="52" rx="6" fill="#DCE6EF" stroke="#5A6B7A" stroke-width="1"/>
        <rect x="108" y="358" width="56" height="16" rx="2" fill="transparent" stroke="rgba(31,42,51,0.4)" stroke-width="0.8"/>
        <text x="136" y="370" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SOFT 0</text>
        <text x="196" y="363" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-weight="700">Phase objective</text>
        <text x="196" y="381" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">overtime, then the spread of work</text>
        <text x="642" y="371" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end">MIN / 1E-9</text>
        <rect x="96" y="400" width="560" height="52" rx="6" fill="#FFFFFF"/>
        <rect x="96" y="400" width="560" height="52" rx="6" fill="rgba(40,122,76,0.1)" stroke="#287A4C" stroke-width="1.4"/>
        <rect x="108" y="418" width="56" height="16" rx="2" fill="transparent" stroke="rgba(31,42,51,0.4)" stroke-width="0.8"/>
        <text x="136" y="430" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SOFT 1</text>
        <text x="196" y="423" fill="#1F2A33" font-size="16" font-family="'Calibri', 'Carlito', system-ui, sans-serif" text-anchor="start" font-weight="700">Cost</text>
        <text x="196" y="441" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">modeled operating cost of the day</text>
        <text x="642" y="431" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end">CENTS</text>
        <text x="692" y="54" fill="#5A6B7A" font-size="8" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">HARD LEVELS</text>
        <text x="692" y="78" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">Promises and limits. A plan with</text>
        <text x="692" y="95" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">any hard level above zero is</text>
        <text x="692" y="112" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">infeasible, whatever it costs.</text>
        <text x="692" y="129" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">Levels 3 and 4 apply only in the</text>
        <text x="692" y="146" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">fairness search.</text>
        <text x="692" y="354" fill="#5A6B7A" font-size="8" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">SOFT LEVELS</text>
        <text x="692" y="378" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">What the search minimizes once</text>
        <text x="692" y="395" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">every hard level is zero: first</text>
        <text x="692" y="412" fill="#1F2A33" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">the phase objective, then cost.</text>
        <line x1="40" y1="504" x2="940" y2="504" stroke="rgba(31,42,51,0.1)" stroke-width="0.8"/>
        <text x="40" y="530" fill="#444444" font-size="8" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start" font-weight="500" letter-spacing="0.14em">LEGEND</text>
        <rect x="110" y="520" width="18" height="12" rx="2" fill="#7DAFCB" stroke="#5A6B7A" stroke-width="0.8"/>
        <text x="136" y="530" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">HARD LEVEL</text>
        <rect x="232" y="520" width="18" height="12" rx="2" fill="#DCE6EF" stroke="#5A6B7A" stroke-width="0.8"/>
        <text x="258" y="530" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">SOFT LEVEL</text>
        <rect x="356" y="520" width="18" height="12" rx="2" fill="rgba(40,122,76,0.1)" stroke="#5A6B7A" stroke-width="0.8"/>
        <text x="382" y="530" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="start">WHERE THE MONEY IS</text>
        <text x="940" y="530" fill="#444444" font-size="11" font-family="'Consolas', 'Liberation Mono', ui-monospace, monospace" text-anchor="end">schematic, no data; every level a whole number</text>
      </svg>
    </div>
  </div>
</body>
</html>
