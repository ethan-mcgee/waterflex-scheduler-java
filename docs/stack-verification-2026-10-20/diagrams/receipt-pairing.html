<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receipt pairing</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); padding: 0; }
    .frame { width: 960px; }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <div class="diagram-container">
      <svg viewBox="0 0 960 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="receipt-pairing-title receipt-pairing-desc">
        <title id="receipt-pairing-title">How the kit pairs speeds with a receipt</title>
        <desc id="receipt-pairing-desc">Each line of the daily replica's log is either a Timefold phase-end line, whose speed is queued under its tenant and request, or a study receipt, which is validated strictly and takes its request's queued speeds only when there is one for each of its phases; otherwise it is counted unpaired and given none.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Arrows first -->
        <line x1="320" y1="96" x2="320" y2="148" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="430" y1="200" x2="556" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="320" y1="248" x2="320" y2="308" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="430" y1="360" x2="556" y2="360" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="320" y1="408" x2="320" y2="448" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="680" y1="388" x2="680" y2="440" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="680" y1="540" x2="680" y2="576" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <path d="M570 492 H528 Q520 492 520 500 V592 Q520 600 512 600 H444" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="479" y="180" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="495" y="189" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>
        <rect x="330" y="272" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="344" y="281" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>
        <rect x="479" y="340" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="495" y="349" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>
        <rect x="330" y="422" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="344" y="431" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>
        <rect x="690" y="552" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="706" y="561" fill="#bf4520" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>
        <rect x="532" y="474" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="546" y="483" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

        <!-- Start -->
        <rect x="200" y="40" width="240" height="56" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="320" y="64" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">A line of the replica's log</text>
        <text x="320" y="81" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">plain or ECS, with tenant, requestId</text>

        <!-- Decision 1 -->
        <polygon points="320,152 430,200 320,248 210,200" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="320" y="197" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Timefold</text>
        <text x="320" y="212" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">"Solving ended"?</text>

        <!-- Step: queue the speed -->
        <rect x="560" y="172" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="680" y="196" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Queue its speed</text>
        <text x="680" y="213" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">under tenant + requestId, in order</text>

        <!-- Decision 2 -->
        <polygon points="320,312 430,360 320,408 210,360" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="320" y="357" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">A "Study receipt"</text>
        <text x="320" y="372" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">line?</text>

        <!-- Step: validate -->
        <rect x="560" y="332" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="680" y="356" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Validate strictly</text>
        <text x="680" y="373" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">out of contract: the run fails</text>

        <!-- Decision 3 -->
        <polygon points="680,444 790,492 680,540 570,492" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="680" y="489" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">One queued speed</text>
        <text x="680" y="504" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">per phase?</text>

        <!-- Outcomes -->
        <rect x="200" y="452" width="240" height="56" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="320" y="476" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Skipped</text>
        <text x="320" y="493" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">any other log line</text>

        <rect x="200" y="572" width="240" height="56" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="320" y="596" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Counted unpaired</text>
        <text x="320" y="613" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">no speed given; evidence refused</text>

        <rect x="560" y="580" width="240" height="56" rx="20" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="680" y="604" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Paired</text>
        <text x="680" y="621" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">each phase takes its own speed</text>

        <!-- Callout -->
        <text x="560" y="88" fill="#2d3142" font-size="15" font-style="italic" font-family="'Instrument Serif', serif">A receipt is never given a guessed speed:</text>
        <text x="560" y="108" fill="#2d3142" font-size="15" font-style="italic" font-family="'Instrument Serif', serif">all 96 in this run were paired.</text>

        <!-- Legend -->
        <line x1="40" y1="668" x2="920" y2="668" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="684" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>
        <rect x="40" y="696" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="72" y="706" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Start or outcome</text>
        <rect x="200" y="696" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="232" y="706" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Step</text>
        <polygon points="316,702 328,696 340,702 328,708" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="352" y="706" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Decision</text>
        <line x1="460" y1="702" x2="488" y2="702" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="496" y="706" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">The outcome every receipt of this run reached</text>
      </svg>
    </div>
  </div>
</body>
</html>
