<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stack verification path</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); padding: 0; }
    .frame { width: 960px; }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <div class="diagram-container">
      <svg viewBox="0 0 960 568" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="stack-path-title stack-path-desc">
        <title id="stack-path-title">The path one verification proposal takes</title>
        <desc id="stack-path-desc">The conformance kit posts a daily proposal through the proxy to the daily replica, which reads Postgres and the routing service, runs the reference phase and then the fairness phase, and writes Timefold's phase speeds and a study receipt to its log, which the kit reads back after the run.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zone: the rehearsal stack -->
        <rect x="380" y="96" width="548" height="284" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="392" y="100" width="216" height="14" rx="2" fill="#f5f5f5"/>
        <text x="396" y="110" fill="#5a6580" font-size="8.5" font-family="'Geist Mono', monospace" letter-spacing="0.14em">REHEARSAL STACK · DEPLOY/VM</text>

        <!-- Arrows first -->
        <line x1="180" y1="200" x2="216" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="340" y1="200" x2="400" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="564" y1="200" x2="592" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="728" y1="200" x2="768" y2="200" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <line x1="464" y1="228" x2="464" y2="284" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="540" y1="228" x2="540" y2="408" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M662 228 V308 Q662 316 670 316 H768" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="840" y1="228" x2="840" y2="284" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M840 344 V476 Q840 484 832 484 H118 Q110 484 110 476 V232" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="548" y="358" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="566" y="367" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">LEGS</text>
        <rect x="694" y="298" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="718" y="307" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">SPEED</text>
        <rect x="736" y="250" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="784" y="259" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">SPEED, RECEIPT</text>
        <rect x="248" y="466" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="292" y="475" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">DOCKER LOGS</text>

        <!-- Kit (input) -->
        <rect x="40" y="172" width="140" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="110" y="198" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Conformance kit</text>
        <text x="110" y="214" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">load.ts, daily</text>

        <!-- Proxy -->
        <rect x="220" y="172" width="120" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="280" y="198" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Proxy</text>
        <text x="280" y="214" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">nginx, :18080</text>

        <!-- Daily replica -->
        <rect x="404" y="172" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="484" y="198" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Daily replica</text>
        <text x="484" y="214" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">pinned image, 2 CPUs</text>

        <!-- Reference phase -->
        <rect x="596" y="172" width="132" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="662" y="198" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Reference phase</text>
        <text x="662" y="214" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">cost, 10 s</text>

        <!-- Fairness phase (focal) -->
        <rect x="772" y="172" width="136" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="840" y="198" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fairness phase</text>
        <text x="840" y="214" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">variance, 5 s</text>

        <!-- Postgres (store) -->
        <rect x="404" y="288" width="120" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="464" y="314" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Postgres</text>
        <text x="464" y="330" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">1 CPU</text>

        <!-- Replica log (store) -->
        <rect x="772" y="288" width="136" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="840" y="314" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Replica log</text>
        <text x="840" y="330" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">ECS JSON lines</text>

        <!-- Routing service (external) -->
        <rect x="470" y="412" width="140" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="540" y="434" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Routing service</text>
        <text x="540" y="450" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">dev stack, 2 CPUs</text>

        <!-- Callout -->
        <text x="404" y="150" fill="#2d3142" font-size="15" font-style="italic" font-family="'Instrument Serif', serif">Both images run this path. Only the fairness phase's formula differs.</text>

        <!-- Legend -->
        <line x1="40" y1="512" x2="920" y2="512" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="528" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="40" y="540" width="24" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="72" y="550" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Load generator</text>
        <rect x="172" y="540" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="204" y="550" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Service or phase</text>
        <rect x="308" y="540" width="24" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="340" y="550" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Store</text>
        <rect x="392" y="540" width="24" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="424" y="550" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Outside the stack</text>
        <line x1="540" y1="546" x2="568" y2="546" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="576" y="550" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Where option b changes the work</text>
        <line x1="748" y1="546" x2="776" y2="546" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="784" y="550" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Read back after the run</text>
      </svg>
    </div>
  </div>
</body>
</html>
