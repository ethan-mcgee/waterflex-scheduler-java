server.port=${SERVER_PORT:8002}
server.address=${SOLVER_BIND_ADDRESS:127.0.0.1}
server.tomcat.threads.max=24
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=64
server.tomcat.accept-count=16
solver.auth-token=${SOLVER_AUTH_TOKEN}
solver.capacity=${SOLVER_CAPACITY:2}
solver.queue-limit=${SOLVER_QUEUE_LIMIT:16}
solver.background-limit=${SOLVER_BACKGROUND_LIMIT:0}
solver.transient-limit=18
# Shutdown: the web server drains solves in progress for up to this long, then any still running are told to stop.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SOLVER_SHUTDOWN_GRACE:30s}
# Timefold's own per-solve INFO lines repeat the daily receipt line; raise to INFO or DEBUG to diagnose a solve.
logging.level.ai.timefold.solver=${TIMEFOLD_LOG_LEVEL:WARN}
