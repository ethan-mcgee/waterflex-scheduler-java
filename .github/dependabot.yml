version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
    groups:
      npm-dependencies:
        patterns: ['*']
    ignore:
      # typescript-eslint, which runs the portal's type-aware lint rules, supports TypeScript below 6.1 only.
      # Remove this rule once its peer range includes the newer compiler.
      - dependency-name: typescript
        versions: ['>=6.1']
      # The types follow the Node the portal runs on (Node 26 in CI and web/Dockerfile, the engines floor), not the newest release.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
    groups:
      maven-dependencies:
        patterns: ['*']
    ignore:
      # Timefold moves by hand, never inside the weekly group: SolverEngine.INSTRUMENTED_TIMEFOLD pins the instrumentation
      # to one release, SolverEngineTest fails on any other, and a remote solver pool must run the same artifact as the
      # scheduler (runbook, "Start, stop and upgrade": a new solver pool beside the old one first).
      - dependency-name: 'ai.timefold.solver:*'
  - package-ecosystem: docker
    directories: [/web, /scheduler-service, /routing-service, /infra/map-import]
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
    groups:
      docker-images:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
    groups:
      github-actions:
        patterns: ['*']
