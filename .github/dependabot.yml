version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
    groups:
      npm-dependencies:
        patterns: ['*']
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
    groups:
      maven-dependencies:
        patterns: ['*']
  - package-ecosystem: docker
    directories: [/web, /scheduler-service, /routing-service, /infra/map-import]
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
    groups:
      docker-images:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
    groups:
      github-actions:
        patterns: ['*']
