name: CI

on:
  pull_request:
    branches: [main]
    # Skip CI for Markdown-only changes, except Markdown that CI generates or reads.
    paths:
      - '**'
      - '!**/*.md'
      - 'docs/scheduler-field-validation.md'
      - 'docs/scheduler-algorithm-comparison-*.md'
      - 'docs/timefold-audit/**'
  push:
    branches: [main]
    paths:
      - '**'
      - '!**/*.md'
      - 'docs/scheduler-field-validation.md'
      - 'docs/scheduler-algorithm-comparison-*.md'
      - 'docs/timefold-audit/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  java-javac:
    name: Java build and tests (javac)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify complete reactor including benchmark adapters
        run: ./mvnw -Pcampaign-benchmark clean verify --batch-mode --no-transfer-progress
      - name: Summarize Java tests
        if: always()
        run: python3 infra/summarize-tests.py '*/target/surefire-reports/TEST-*.xml' --label 'java-javac'
      - name: Upload Java diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: java-javac-reports
          path: "*/target/surefire-reports/"
          retention-days: 7

  java-nullability:
    name: Java build and tests (nullability)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify complete reactor including benchmark adapters
        run: ./mvnw -Pcampaign-benchmark,nullability clean verify --batch-mode --no-transfer-progress
      - name: Summarize Java tests
        if: always()
        run: python3 infra/summarize-tests.py '*/target/surefire-reports/TEST-*.xml' --label 'java-nullability'
      - name: Upload Java diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: java-nullability-reports
          path: "*/target/surefire-reports/"
          retention-days: 7

  portal-checks:
    name: Portal checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install portal dependencies and generate Prisma client
        working-directory: web
        run: npm ci && npm run prisma:generate
      - name: Lint portal
        working-directory: web
        run: npm run lint
      - name: Typecheck portal
        working-directory: web
        run: npm run typecheck
      - name: Portal unit tests
        working-directory: web
        run: npm run test:unit
      - name: Build portal
        working-directory: web
        run: npm run build
      - name: Summarize portal tests
        if: always()
        run: python3 infra/summarize-tests.py 'web/test-results/unit.xml' --label Portal
      - name: Upload portal diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: portal-test-reports
          path: web/test-results/
          retention-days: 7

  infrastructure-evidence:
    name: Infrastructure and evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Campaign lifecycle regressions compile and launch a real Java 25 fixture.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Validate workflows with actionlint and ShellCheck
        run: |
          command -v shellcheck
          curl --fail --silent --show-error --location https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Validate Compose configuration
        run: docker compose --profile map-import config --quiet
      - name: Verify retained field evidence and generated reports
        run: |
          python3 infra/report-field-validation.py --require-complete
          git diff --exit-code -- docs/scheduler-field-validation.md docs/scheduler-field-validation.html docs/scheduler-field-cost-runtime.svg docs/scheduler-field-routes.svg docs/evidence/scheduler-field-2026-09-29/summary.json
      - name: Install report test dependencies
        run: |
          python3 -m pip install matplotlib==3.11.2 reportlab==5.0.1 pymupdf==1.28.2
      - name: Verify experiment and campaign toolkits (no full matrix)
        run: python3 -m unittest discover -s infra -p 'test_*.py' -v
      - name: Verify Timefold audit evidence helpers
        run: |
          python3 -m pip install lxml==6.1.3 python-docx==1.2.0
          python3 -m unittest discover -s docs/timefold-audit -p 'test_*.py' -v
          python3 -m unittest discover -s docs/timefold-audit/remediation -p 'test_*.py' -v

  integration-core:
    name: Database and core workflows
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          POSTGRES_USER: waterflex
          POSTGRES_PASSWORD: waterflex
          POSTGRES_DB: waterflex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U waterflex -d waterflex_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://waterflex:waterflex@127.0.0.1:5432/waterflex_test
      JDBC_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/waterflex_test
      DATABASE_USER: waterflex
      DATABASE_PASSWORD: waterflex
      ROUTING_URL: http://127.0.0.1:18001
      # The public API booking smoke's metro routes through the fixture router.
      ROUTING_METRO_URLS: api-booking-smoke=http://127.0.0.1:18001,api-dispatch-smoke=http://127.0.0.1:18001,api-repair-smoke=http://127.0.0.1:18001,api-shared-smoke=http://127.0.0.1:18001,api-overnight-smoke=http://127.0.0.1:18001,api-master-smoke=http://127.0.0.1:18001,api-master-smoke-far=http://127.0.0.1:18001,api-cancel-smoke=http://127.0.0.1:18001,metro-omaha=http://127.0.0.1:18001,address-matching-smoke=http://127.0.0.1:18001
      SCHEDULER_TEST_URL: http://127.0.0.1:18000
      ENGINE_URL: http://127.0.0.1:18000
      SERVER_PORT: '18000'
      TIME_OFF_POLL_DELAY_MS: '1000'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install portal dependencies and generate Prisma client
        working-directory: web
        run: npm ci && npm run prisma:generate
      - name: Migrate, seed, and check schema
        working-directory: web
        run: npx prisma migrate deploy && npx prisma db seed && npm run test:schema-contract
      - name: Immutable snapshot, reservation and database admission gates
        run: |
          ./mvnw -Pnullability -pl calculation-engine -DskipTests install --batch-mode --no-transfer-progress
          ./mvnw -Pnullability -pl scheduler-service clean package '-Dtest=*IT' -DfailIfNoTests=true --batch-mode --no-transfer-progress
      - name: Start fixture routing and scheduler
        run: |
          node infra/fixture-routing.mjs > "$RUNNER_TEMP/fixture-routing.log" 2>&1 &
          java -jar scheduler-service/target/scheduler-service-0.1.0-SNAPSHOT.jar > "$RUNNER_TEMP/scheduler.log" 2>&1 &
          for _attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:18001/health > /dev/null &&
               curl --fail --silent http://127.0.0.1:18000/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Services did not become healthy" >&2
          exit 1
      - name: Policy settings migration contract
        env:
          DATABASE_URL: postgresql://waterflex:waterflex@127.0.0.1:5432/waterflex_test?schema=policy_migration
          JDBC_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/waterflex_test?currentSchema=policy_migration
        run: |
          node web/node_modules/prisma/build/index.js migrate deploy --schema web/prisma/schema.prisma
          node web/node_modules/tsx/dist/cli.mjs web/scripts/smoke-policy-migration.ts
      - name: Booking location contracts with isolated data
        working-directory: web
        env:
          DATABASE_URL: postgresql://waterflex:waterflex@127.0.0.1:5432/waterflex_test?schema=booking_location_it
          JDBC_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/waterflex_test?currentSchema=booking_location_it
          ENGINE_URL: http://127.0.0.1:18002
          SERVER_PORT: '18002'
          SCHEDULER_SEARCH_CAPACITY: '2'
        run: |
          npx prisma migrate deploy
          java -jar ../scheduler-service/target/scheduler-service-0.1.0-SNAPSHOT.jar > "$RUNNER_TEMP/location-scheduler.log" 2>&1 &
          location_pid=$!
          trap 'kill "$location_pid"' EXIT
          for _attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:18002/health > /dev/null; then break; fi
            sleep 2
          done
          node ../infra/run-check.mjs test:booking-location:integration npx tsx scripts/smoke-booking-location.ts
      - name: Depot pin setup smoke
        working-directory: web
        run: node ../infra/run-check.mjs test:depot-setup:integration npm run test:depot-setup:integration
      - name: Client solver settings smoke
        working-directory: web
        run: node ../infra/run-check.mjs test:client-settings:integration npm run test:client-settings:integration
      - name: Client snapshot smoke
        working-directory: web
        run: node ../infra/run-check.mjs test:client-snapshot:integration npm run test:client-snapshot:integration
      - name: Public API booking smoke
        working-directory: web
        run: node ../infra/run-check.mjs test:api-booking:integration npm run test:api-booking:integration
      - name: Public API dispatch smoke
        working-directory: web
        run: node ../infra/run-check.mjs test:api-dispatch:integration npm run test:api-dispatch:integration
      - name: Public API repair smoke
        working-directory: web
        run: node ../infra/run-check.mjs test:api-repair:integration npm run test:api-repair:integration
      - name: Two clients in one metro smoke
        working-directory: web
        run: node ../infra/run-check.mjs test:shared-metro:integration npm run test:shared-metro:integration
      - name: Portal overnight optimization smoke
        working-directory: web
        run: node ../infra/run-check.mjs test:portal-overnight:integration npm run test:portal-overnight:integration
      - name: Public API depot and assignment changes smoke
        working-directory: web
        run: node ../infra/run-check.mjs test:api-master-data:integration npm run test:api-master-data:integration
      - name: Public API cancellation and road geometry smoke
        working-directory: web
        run: node ../infra/run-check.mjs test:api-cancel-geometry:integration npm run test:api-cancel-geometry:integration
      - name: Public API fake data smoke
        working-directory: web
        run: node ../infra/run-check.mjs test:api-fake-data:integration npm run test:api-fake-data:integration
      - name: Shared address matching smoke
        working-directory: web
        run: node ../infra/run-check.mjs test:address-matching:integration npm run test:address-matching:integration
      - name: Technician home pin smoke
        working-directory: web
        run: node ../infra/run-check.mjs test:technician-home:integration npm run test:technician-home:integration
      - name: Sequential booking test runner smoke
        working-directory: web
        run: node ../infra/run-check.mjs test:booking-tests:integration npm run test:booking-tests:integration
      - name: Print service logs on failure
        if: failure()
        run: |
          echo 'Fixture routing log:'
          cat "$RUNNER_TEMP/fixture-routing.log" 2>/dev/null || true
          echo 'Scheduler log:'
          cat "$RUNNER_TEMP/scheduler.log" 2>/dev/null || true
          cat "$RUNNER_TEMP/reservation-scheduler.log" 2>/dev/null || true
          cat "$RUNNER_TEMP/remote-solver.log" 2>/dev/null || true
          cat "$RUNNER_TEMP/remote-scheduler.log" 2>/dev/null || true
      - name: Summarize database tests
        if: always()
        run: python3 infra/summarize-tests.py 'scheduler-service/target/surefire-reports/TEST-*.xml' --label 'Database integration'
      - name: Upload integration diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-core-diagnostics
          path: |
            scheduler-service/target/surefire-reports/
            ${{ runner.temp }}/*.log
          retention-days: 7

  integration-time-off:
    name: Time-off repair
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          POSTGRES_USER: waterflex
          POSTGRES_PASSWORD: waterflex
          POSTGRES_DB: waterflex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U waterflex -d waterflex_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://waterflex:waterflex@127.0.0.1:5432/waterflex_test
      JDBC_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/waterflex_test
      DATABASE_USER: waterflex
      DATABASE_PASSWORD: waterflex
      ROUTING_URL: http://127.0.0.1:18001
      SCHEDULER_TEST_URL: http://127.0.0.1:18000
      ENGINE_URL: http://127.0.0.1:18000
      SERVER_PORT: '18000'
      TIME_OFF_POLL_DELAY_MS: '1000'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install portal dependencies and generate Prisma client
        working-directory: web
        run: npm ci && npm run prisma:generate
      - name: Migrate, seed, and check schema
        working-directory: web
        run: npx prisma migrate deploy && npx prisma db seed && npm run test:schema-contract
      - name: Build isolated integration services
        run: ./mvnw -Pnullability -pl scheduler-service -am -DskipTests package --batch-mode --no-transfer-progress
      - name: Start fixture routing and scheduler
        run: |
          node infra/fixture-routing.mjs > "$RUNNER_TEMP/fixture-routing.log" 2>&1 &
          java -jar scheduler-service/target/scheduler-service-0.1.0-SNAPSHOT.jar > "$RUNNER_TEMP/scheduler.log" 2>&1 &
          for _attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:18001/health > /dev/null &&
               curl --fail --silent http://127.0.0.1:18000/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Services did not become healthy" >&2
          exit 1
      - name: Time-off repair smoke
        working-directory: web
        run: |
          for repetition in 1 2 3; do
            echo "Time-off smoke repetition $repetition"
            node ../infra/run-check.mjs time-off-$repetition npm run test:time-off:integration
          done
      - name: Print service logs on failure
        if: failure()
        run: |
          echo 'Fixture routing log:'
          cat "$RUNNER_TEMP/fixture-routing.log" 2>/dev/null || true
          echo 'Scheduler log:'
          cat "$RUNNER_TEMP/scheduler.log" 2>/dev/null || true
          cat "$RUNNER_TEMP/reservation-scheduler.log" 2>/dev/null || true
          cat "$RUNNER_TEMP/remote-solver.log" 2>/dev/null || true
          cat "$RUNNER_TEMP/remote-scheduler.log" 2>/dev/null || true
      - name: Upload integration diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-time-off-diagnostics
          path: |
            scheduler-service/target/surefire-reports/
            ${{ runner.temp }}/*.log
          retention-days: 7

  integration-remote:
    name: Remote calculation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          POSTGRES_USER: waterflex
          POSTGRES_PASSWORD: waterflex
          POSTGRES_DB: waterflex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U waterflex -d waterflex_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://waterflex:waterflex@127.0.0.1:5432/waterflex_test
      JDBC_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/waterflex_test
      DATABASE_USER: waterflex
      DATABASE_PASSWORD: waterflex
      ROUTING_URL: http://127.0.0.1:18001
      SCHEDULER_TEST_URL: http://127.0.0.1:18000
      ENGINE_URL: http://127.0.0.1:18000
      SERVER_PORT: '18000'
      TIME_OFF_POLL_DELAY_MS: '1000'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install portal dependencies and generate Prisma client
        working-directory: web
        run: npm ci && npm run prisma:generate
      - name: Build isolated integration services
        run: ./mvnw -Pnullability -pl scheduler-service,solver-service -am -DskipTests package --batch-mode --no-transfer-progress
      - name: Start fixture routing
        run: |
          node infra/fixture-routing.mjs > "$RUNNER_TEMP/fixture-routing.log" 2>&1 &
          for _attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:18001/health > /dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Remote calculation business workflows in an isolated database schema
        env:
          DATABASE_URL: postgresql://waterflex:waterflex@127.0.0.1:5432/waterflex_test?schema=remote_calculation_it
          JDBC_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/waterflex_test?currentSchema=remote_calculation_it
          ENGINE_URL: http://127.0.0.1:18003
          SCHEDULER_TEST_URL: http://127.0.0.1:18003
          ROUTING_METRO_URLS: api-booking-smoke=http://127.0.0.1:18001,api-dispatch-smoke=http://127.0.0.1:18001,api-repair-smoke=http://127.0.0.1:18001
        run: |
          node web/node_modules/prisma/build/index.js migrate deploy --schema web/prisma/schema.prisma
          token=$(openssl rand -hex 32)
          SOLVER_AUTH_TOKEN="$token" SERVER_PORT=18004 java -jar solver-service/target/solver-service-0.1.0-SNAPSHOT.jar > "$RUNNER_TEMP/remote-solver.log" 2>&1 &
          solver_pid=$!
          SCHEDULER_CALCULATION_AUTH_TOKEN="$token" SCHEDULER_CALCULATION_MODE=REMOTE SCHEDULER_CALCULATION_URL=http://127.0.0.1:18004 SERVER_PORT=18003 java -jar scheduler-service/target/scheduler-service-0.1.0-SNAPSHOT.jar > "$RUNNER_TEMP/remote-scheduler.log" 2>&1 &
          remote_pid=$!
          trap 'kill "$remote_pid" "$solver_pid"' EXIT
          for _attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:18003/health > /dev/null && curl --fail --silent http://127.0.0.1:18004/health > /dev/null; then break; fi
            sleep 1
          done
          cd web
          npx prisma db seed
          node ../infra/run-check.mjs remote-booking npm run test:api-booking:integration
          node ../infra/run-check.mjs remote-dispatch npm run test:api-dispatch:integration
          node ../infra/run-check.mjs remote-repair npm run test:api-repair:integration
      - name: Print service logs on failure
        if: failure()
        run: |
          echo 'Fixture routing log:'
          cat "$RUNNER_TEMP/fixture-routing.log" 2>/dev/null || true
          echo 'Scheduler log:'
          cat "$RUNNER_TEMP/scheduler.log" 2>/dev/null || true
          cat "$RUNNER_TEMP/reservation-scheduler.log" 2>/dev/null || true
          cat "$RUNNER_TEMP/remote-solver.log" 2>/dev/null || true
          cat "$RUNNER_TEMP/remote-scheduler.log" 2>/dev/null || true
      - name: Upload integration diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-remote-diagnostics
          path: |
            scheduler-service/target/surefire-reports/
            ${{ runner.temp }}/*.log
          retention-days: 7

  build-and-unit:
    name: Build and unit
    needs: [java-javac, java-nullability, portal-checks, infrastructure-evidence]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every check to succeed
        env:
          ALL_SUCCEEDED: ${{ needs.java-javac.result == 'success' && needs.java-nullability.result == 'success' && needs.portal-checks.result == 'success' && needs.infrastructure-evidence.result == 'success' }}
        run: test "$ALL_SUCCEEDED" = true

  booking-and-optimizer-integration:
    name: Booking and optimizer integration
    needs: [integration-core, integration-remote]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every check to succeed
        env:
          ALL_SUCCEEDED: ${{ needs.integration-core.result == 'success' && needs.integration-remote.result == 'success' }}
        run: test "$ALL_SUCCEEDED" = true

  browser-regressions:
    name: Browser regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          POSTGRES_USER: waterflex
          POSTGRES_PASSWORD: waterflex
          POSTGRES_DB: waterflex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U waterflex -d waterflex_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://waterflex:waterflex@127.0.0.1:5432/waterflex_test?schema=nullability_ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install portal dependencies and generate Prisma client
        working-directory: web
        run: npm ci && npm run prisma:generate
      # apt mirrors occasionally stall; bound each attempt so a stuck mirror cannot consume the job timeout.
      - name: Install Playwright Chromium
        working-directory: web
        timeout-minutes: 10
        run: |
          # The ubuntu-24.04 runner image already has every library Chromium needs. --with-deps
          # only added optional font packages from the Azure apt mirror, which repeatedly stalled
          # or crawled past the step limit. Download the browser alone (from the Playwright CDN);
          # a genuinely missing host library still fails the browser tests at launch.
          for attempt in 1 2 3; do
            timeout 180 npx playwright install chromium && exit 0
            echo "Playwright install attempt $attempt failed or timed out"; sleep 10
          done
          exit 1
      - name: Browser regressions in an isolated schema
        working-directory: web
        run: npx prisma migrate deploy && npm run test:ui
      - name: Summarize browser tests
        if: always()
        run: python3 infra/summarize-tests.py 'web/test-results/browser.xml' --label Browser
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
