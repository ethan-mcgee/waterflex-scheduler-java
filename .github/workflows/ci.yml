name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-unit:
    name: Build and unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Validate workflows with actionlint and ShellCheck
        run: |
          command -v shellcheck
          curl --fail --silent --show-error --location https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Validate Compose configuration
        run: docker compose --profile map-import config --quiet
      - name: Verify offer limit interpolation
        run: node infra/test-booking-offer-limit-compose.mjs
      - name: Verify benchmark evidence assembly
        run: python3 infra/test_booking_baseline_assembly.py
      - name: Verify retained field evidence and generated reports
        run: |
          python3 infra/report-field-validation.py --require-complete
          git diff --exit-code -- docs/scheduler-field-validation.md docs/scheduler-field-validation.html docs/scheduler-field-cost-runtime.svg docs/scheduler-field-routes.svg docs/evidence/scheduler-field-2026-09-29/summary.json
      - name: Verify Java modules
        run: ./mvnw verify --batch-mode --no-transfer-progress
      - name: Verify algorithm comparison report regressions
        run: |
          python3 -m pip install matplotlib==3.11.2 reportlab==5.0.1 pymupdf==1.28.2
          python3 infra/test_scheduler_algorithm_comparison.py
      - name: Verify configurable experiment toolkit (no full matrix)
        run: python3 -m unittest discover -s infra -p test_experiments.py -v
      - name: Summarize javac tests before clean
        if: always()
        run: python3 infra/summarize-tests.py '*/target/surefire-reports/TEST-*.xml' --label javac
      - name: Preserve javac diagnostics
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/javac-reports"
          cp -R scheduler-service/target/surefire-reports "$RUNNER_TEMP/javac-reports/scheduler" 2>/dev/null || true
          cp -R routing-service/target/surefire-reports "$RUNNER_TEMP/javac-reports/routing" 2>/dev/null || true
      - name: Verify Java nullability contracts
        run: ./mvnw -Pnullability clean verify --batch-mode --no-transfer-progress
      - name: Install portal dependencies and generate Prisma client
        working-directory: web
        run: npm ci && npm run prisma:generate
      - name: Lint portal
        working-directory: web
        run: npm run lint
      - name: Typecheck portal
        working-directory: web
        run: npm run typecheck
      - name: Portal unit tests
        working-directory: web
        run: npm run test:unit
      - name: Build portal
        working-directory: web
        run: npm run build
      - name: Summarize ECJ and portal tests
        if: always()
        run: python3 infra/summarize-tests.py '*/target/surefire-reports/TEST-*.xml' 'web/test-results/unit.xml' --label 'ECJ and portal'
      - name: Upload build test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-test-reports
          path: |
            */target/surefire-reports/
            ${{ runner.temp }}/javac-reports/
            web/test-results/
          retention-days: 7

  booking-and-optimizer-integration:
    name: Booking and optimizer integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: waterflex
          POSTGRES_PASSWORD: waterflex
          POSTGRES_DB: waterflex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U waterflex -d waterflex_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://waterflex:waterflex@127.0.0.1:5432/waterflex_test
      JDBC_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/waterflex_test
      DATABASE_USER: waterflex
      DATABASE_PASSWORD: waterflex
      ROUTING_URL: http://127.0.0.1:18001
      SCHEDULER_TEST_URL: http://127.0.0.1:18000
      ENGINE_URL: http://127.0.0.1:18000
      SERVER_PORT: '18000'
      TIME_OFF_POLL_DELAY_MS: '1000'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install portal dependencies and generate Prisma client
        working-directory: web
        run: npm ci && npm run prisma:generate
      - name: Migrate, seed, and check schema
        working-directory: web
        run: npx prisma migrate deploy && npx prisma db seed && npm run test:schema-contract
      - name: Benchmark cleanup PostgreSQL regression
        working-directory: web
        env:
          DATABASE_URL: postgresql://waterflex:waterflex@127.0.0.1:5432/waterflex_test?schema=benchmark_cleanup_it
        run: npx prisma migrate deploy && npx tsx scripts/check-benchmark-cleanup.ts
      - name: Immutable snapshot, reservation and database admission gates
        run: ./mvnw -Pnullability -pl scheduler-service clean package '-Dtest=*IT,!DurableBookingSearchIT,!BookingSnapshotDatabaseIT' -DfailIfNoTests=true --batch-mode --no-transfer-progress
      - name: Start fixture routing and scheduler
        run: |
          node infra/fixture-routing.mjs > "$RUNNER_TEMP/fixture-routing.log" 2>&1 &
          java -jar scheduler-service/target/scheduler-service-0.1.0-SNAPSHOT.jar > "$RUNNER_TEMP/scheduler.log" 2>&1 &
          for _attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:18001/health > /dev/null &&
               curl --fail --silent http://127.0.0.1:18000/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Services did not become healthy" >&2
          exit 1
      - name: Durable search and snapshot database contracts
        env:
          DATABASE_URL: postgresql://waterflex:waterflex@127.0.0.1:5432/waterflex_test?schema=durable_contracts
          JDBC_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/waterflex_test?currentSchema=durable_contracts
        run: |
          node web/node_modules/prisma/build/index.js migrate deploy --schema web/prisma/schema.prisma
          node web/node_modules/tsx/dist/cli.mjs web/scripts/smoke-policy-migration.ts
          ./mvnw -pl scheduler-service '-Dtest=DurableBookingSearchIT' test --batch-mode --no-transfer-progress
      - name: Frozen service calendar database contracts
        env:
          DATABASE_URL: postgresql://waterflex:waterflex@127.0.0.1:5432/waterflex_test?schema=benchmark_calendar_it
          JDBC_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/waterflex_test?currentSchema=benchmark_calendar_it
        run: |
          node web/node_modules/prisma/build/index.js migrate deploy --schema web/prisma/schema.prisma
          ./mvnw -pl scheduler-service '-Dtest=BookingSnapshotDatabaseIT,MonetaryMigrationDatabaseIT' test --batch-mode --no-transfer-progress
      - name: Booking smoke
        working-directory: web
        run: node ../infra/run-check.mjs test:booking:integration npm run test:booking:integration
      - name: Booking location contracts with reservations and isolated data
        working-directory: web
        env:
          DATABASE_URL: postgresql://waterflex:waterflex@127.0.0.1:5432/waterflex_test?schema=booking_location_it
          JDBC_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/waterflex_test?currentSchema=booking_location_it
          ENGINE_URL: http://127.0.0.1:18002
          SERVER_PORT: '18002'
          BOOKING_RESERVATIONS_ENABLED: 'true'
          BOOKING_OFFER_LIMIT: '1'
          BOOKING_SEARCH_BOUNDED: 'true'
          SCHEDULER_SEARCH_CAPACITY: '2'
          ROUTING_PREWARM_ENABLED: 'true'
        run: |
          npx prisma migrate deploy
          java -jar ../scheduler-service/target/scheduler-service-0.1.0-SNAPSHOT.jar > "$RUNNER_TEMP/location-scheduler.log" 2>&1 &
          location_pid=$!
          trap 'kill "$location_pid"' EXIT
          for _attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:18002/health > /dev/null; then break; fi
            sleep 2
          done
          node ../infra/run-check.mjs test:booking-location:integration npx tsx scripts/smoke-booking-location.ts
      - name: Configurable offer limits across both booking paths
        run: node infra/run-check.mjs offer-limits node infra/test-booking-offer-limits.mjs
      - name: Pending reservation dependency guards
        working-directory: web
        run: node ../infra/run-check.mjs test:reservation:integration npm run test:reservation:integration
      - name: Optimizer smoke
        working-directory: web
        run: node ../infra/run-check.mjs test:optimizer:integration npm run test:optimizer:integration
      - name: Multi-depot dealership smoke
        working-directory: web
        run: node ../infra/run-check.mjs test:multi-depot:integration npm run test:multi-depot:integration
      - name: Depot pin setup smoke
        working-directory: web
        run: node ../infra/run-check.mjs test:depot-setup:integration npm run test:depot-setup:integration
      - name: Shared address matching smoke
        working-directory: web
        run: node ../infra/run-check.mjs test:address-matching:integration npm run test:address-matching:integration
      - name: Technician home pin smoke
        working-directory: web
        run: node ../infra/run-check.mjs test:technician-home:integration npm run test:technician-home:integration
      - name: Time-off repair smoke
        working-directory: web
        run: |
          for repetition in 1 2 3; do
            echo "Time-off smoke repetition $repetition"
            node ../infra/run-check.mjs time-off-$repetition npm run test:time-off:integration
          done
      - name: Sequential booking and preview smoke
        working-directory: web
        run: node ../infra/run-check.mjs test:booking-tests:integration npm run test:booking-tests:integration
      - name: Start common-reservation rollout test instance
        run: |
          java -Xmx512m -jar scheduler-service/target/scheduler-service-0.1.0-SNAPSHOT.jar --server.port=18002 --booking.reservations.enabled=true --booking.search.bounded=true > "$RUNNER_TEMP/reservation-scheduler.log" 2>&1 &
          for _attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18002/health > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Common reservation booking lifecycle
        working-directory: web
        env:
          SCHEDULER_TEST_URL: http://127.0.0.1:18002
          SCHEDULER_RESERVATIONS_TEST: 'true'
        run: node ../infra/run-check.mjs test:booking:integration npm run test:booking:integration
      - name: Cross-instance search cancellation and lost response cleanup
        working-directory: web
        env:
          SCHEDULER_TEST_URL: http://127.0.0.1:18002
          SCHEDULER_CANCEL_URL: http://127.0.0.1:18000
        run: |
          node ../infra/run-check.mjs cancellation-forward npm run test:search-cancellation:integration
          SCHEDULER_TEST_URL=http://127.0.0.1:18000 SCHEDULER_CANCEL_URL=http://127.0.0.1:18002 node ../infra/run-check.mjs cancellation-reverse npm run test:search-cancellation:integration
      - name: Bounded rearrangement and concurrency with rollout disabled at confirmation
        working-directory: web
        env:
          SCHEDULER_TEST_URL: http://127.0.0.1:18002
          SCHEDULER_CONFIRM_URL: http://127.0.0.1:18000
        run: node ../infra/run-check.mjs test:bounded-booking:integration npm run test:bounded-booking:integration
      - name: Cancellation preserves a pending rearranged reservation
        working-directory: web
        env:
          SCHEDULER_TEST_URL: http://127.0.0.1:18002
          SCHEDULER_CONFIRM_URL: http://127.0.0.1:18000
          SCHEDULER_CANCEL_PENDING_TEST: 'true'
        run: node ../infra/run-check.mjs test:bounded-booking:integration npm run test:bounded-booking:integration
      - name: Print service logs on failure
        if: failure()
        run: |
          echo 'Fixture routing log:'
          cat "$RUNNER_TEMP/fixture-routing.log" 2>/dev/null || true
          echo 'Scheduler log:'
          cat "$RUNNER_TEMP/scheduler.log" 2>/dev/null || true
          cat "$RUNNER_TEMP/reservation-scheduler.log" 2>/dev/null || true
      - name: Summarize database tests
        if: always()
        run: python3 infra/summarize-tests.py 'scheduler-service/target/surefire-reports/TEST-*.xml' --label 'Database integration'
      - name: Upload integration diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-diagnostics
          path: |
            scheduler-service/target/surefire-reports/
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/booking-offer-limits-*/
          retention-days: 7

  browser-regressions:
    name: Browser regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: waterflex
          POSTGRES_PASSWORD: waterflex
          POSTGRES_DB: waterflex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U waterflex -d waterflex_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://waterflex:waterflex@127.0.0.1:5432/waterflex_test?schema=nullability_ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install portal dependencies and generate Prisma client
        working-directory: web
        run: npm ci && npm run prisma:generate
      - name: Browser regressions in an isolated schema
        working-directory: web
        run: npx prisma migrate deploy && npx playwright install --with-deps chromium && npm run test:ui
      - name: Summarize browser tests
        if: always()
        run: python3 infra/summarize-tests.py 'web/test-results/browser.xml' --label Browser
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
