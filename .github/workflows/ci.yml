name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-unit:
    name: Build and unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Validate Compose configuration
        run: docker compose --profile map-import config --quiet
      - name: Verify Java modules
        run: ./mvnw verify --batch-mode --no-transfer-progress
      - name: Verify Java nullability contracts
        run: ./mvnw -Pnullability clean verify --batch-mode --no-transfer-progress
      - name: Install portal dependencies and generate Prisma client
        working-directory: web
        run: npm ci && npm run prisma:generate
      - name: Lint portal
        working-directory: web
        run: npm run lint
      - name: Typecheck portal
        working-directory: web
        run: npm run typecheck
      - name: Portal unit tests
        working-directory: web
        run: npm run test:geocode && npm run test:fake-data && npm run test:optimization && npm run test:dispatch-geometry && npm run test:booking-tests && npm run test:nullability
      - name: Build portal
        working-directory: web
        run: npm run build

  booking-and-optimizer-integration:
    name: Booking and optimizer integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: waterflex
          POSTGRES_PASSWORD: waterflex
          POSTGRES_DB: waterflex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U waterflex -d waterflex_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://waterflex:waterflex@127.0.0.1:5432/waterflex_test
      JDBC_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/waterflex_test
      DATABASE_USER: waterflex
      DATABASE_PASSWORD: waterflex
      ROUTING_URL: http://127.0.0.1:18001
      SCHEDULER_TEST_URL: http://127.0.0.1:18000
      ENGINE_URL: http://127.0.0.1:18000
      SERVER_PORT: '18000'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build scheduler
        run: ./mvnw -pl scheduler-service -am package -DskipTests --batch-mode --no-transfer-progress
      - name: Install portal dependencies and generate Prisma client
        working-directory: web
        run: npm ci && npm run prisma:generate
      - name: Migrate, seed, and check schema
        working-directory: web
        run: npx prisma migrate deploy && npx prisma db seed && npm run test:schema-contract
      - name: Immutable snapshot and reservation database gate
        run: ./mvnw -Pnullability -pl scheduler-service clean package -Dtest=BookingSnapshotDatabaseIT --batch-mode --no-transfer-progress
      - name: Browser nullability regressions in an isolated schema
        working-directory: web
        env:
          DATABASE_URL: postgresql://waterflex:waterflex@127.0.0.1:5432/waterflex_test?schema=nullability_ui
        run: npx prisma migrate deploy && npx playwright install --with-deps chromium && npm run test:ui
      - name: Upload browser test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Start fixture routing and scheduler
        run: |
          node infra/fixture-routing.mjs > "$RUNNER_TEMP/fixture-routing.log" 2>&1 &
          java -jar scheduler-service/target/scheduler-service-0.1.0-SNAPSHOT.jar > "$RUNNER_TEMP/scheduler.log" 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:18001/health > /dev/null &&
               curl --fail --silent http://127.0.0.1:18000/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Services did not become healthy" >&2
          exit 1
      - name: Booking smoke
        working-directory: web
        run: npm run test:booking:integration
      - name: Pending reservation dependency guards
        working-directory: web
        run: npm run test:reservation:integration
      - name: Optimizer smoke
        working-directory: web
        run: npm run test:optimizer:integration
      - name: Multi-depot dealership smoke
        working-directory: web
        run: npm run test:multi-depot:integration
      - name: Depot pin setup smoke
        working-directory: web
        run: npm run test:depot-setup:integration
      - name: Technician home pin smoke
        working-directory: web
        run: npm run test:technician-home:integration
      - name: Time-off repair smoke
        working-directory: web
        run: npm run test:time-off:integration
      - name: Sequential booking and preview smoke
        working-directory: web
        run: npm run test:booking-tests:integration
      - name: Start common-reservation rollout test instance
        run: |
          java -Xmx512m -jar scheduler-service/target/scheduler-service-0.1.0-SNAPSHOT.jar --server.port=18002 --booking.reservations.enabled=true --booking.search.bounded=true > "$RUNNER_TEMP/reservation-scheduler.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18002/health > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Common reservation booking lifecycle
        working-directory: web
        env:
          SCHEDULER_TEST_URL: http://127.0.0.1:18002
          SCHEDULER_RESERVATIONS_TEST: 'true'
        run: npm run test:booking:integration
      - name: Bounded rearrangement and concurrency with rollout disabled at confirmation
        working-directory: web
        env:
          SCHEDULER_TEST_URL: http://127.0.0.1:18002
          SCHEDULER_CONFIRM_URL: http://127.0.0.1:18000
        run: npm run test:bounded-booking:integration
      - name: Cancellation preserves a pending rearranged reservation
        working-directory: web
        env:
          SCHEDULER_TEST_URL: http://127.0.0.1:18002
          SCHEDULER_CONFIRM_URL: http://127.0.0.1:18000
          SCHEDULER_CANCEL_PENDING_TEST: 'true'
        run: npm run test:bounded-booking:integration
      - name: Print service logs on failure
        if: failure()
        run: |
          echo 'Fixture routing log:'
          cat "$RUNNER_TEMP/fixture-routing.log" 2>/dev/null || true
          echo 'Scheduler log:'
          cat "$RUNNER_TEMP/scheduler.log" 2>/dev/null || true
          cat "$RUNNER_TEMP/reservation-scheduler.log" 2>/dev/null || true
