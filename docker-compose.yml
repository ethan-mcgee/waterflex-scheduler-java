services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: waterflex
      POSTGRES_PASSWORD: waterflex
      POSTGRES_DB: waterflex
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["app-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waterflex"]
      interval: 5s
      retries: 10
  routing-service:
    image: waterflex-scheduler-routing:local
    pull_policy: build
    build:
      context: .
      dockerfile: routing-service/Dockerfile
    environment:
      ROUTING_OSM_FILE: /maps/omaha.osm.pbf
      ROUTING_GRAPH_DIR: /maps/graph
      ROUTING_CH_ENABLED: ${ROUTING_CH_ENABLED:-false}
      # Local-only default; production VMs must set their own secret.
      ROUTING_AUTH_TOKEN: ${ROUTING_AUTH_TOKEN:-local-compose-routing-token-not-for-production}
    volumes: ["map-data:/maps"]
    ports: ["127.0.0.1:8001:8001"]
    # The JRE image has no curl; bash's /dev/tcp reads the status line. Loading the road graph can take minutes.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8001 && printf 'GET /health HTTP/1.0\r\n\r\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 300s
  solver-service:
    profiles: ["remote-solver"]
    image: waterflex-calculation-solver:local
    pull_policy: build
    build:
      context: .
      dockerfile: solver-service/Dockerfile
    environment:
      SOLVER_BIND_ADDRESS: 0.0.0.0
      SOLVER_AUTH_TOKEN: ${SOLVER_AUTH_TOKEN:-}
      SOLVER_CAPACITY: ${SOLVER_CAPACITY:-2}
      SOLVER_QUEUE_LIMIT: ${SOLVER_QUEUE_LIMIT:-16}
    # Internal Compose connectivity only. No published solver port or database/routing credentials.
    expose: ["8002"]
  scheduler-service:
    image: waterflex-scheduler-engine:local
    pull_policy: build
    build:
      context: .
      dockerfile: scheduler-service/Dockerfile
    environment:
      JDBC_DATABASE_URL: jdbc:postgresql://db:5432/waterflex
      # The least-privilege login schema-migrate creates (a member of scheduler_app); never the schema owner.
      DATABASE_USER: scheduler
      DATABASE_PASSWORD: ${SCHEDULER_DB_PASSWORD:-local-compose-scheduler-db-password-not-for-production}
      # Required, no default: days the thin store keeps requests, proposals, offers and receipts. The scheduler refuses
      # to start without it; set it in .env.
      SCHEDULER_RETENTION_DAYS: ${SCHEDULER_RETENTION_DAYS:-}
      ROUTING_URL: http://routing-service:8001
      # Public API routing per WaterFlex metro ID, for example omaha=http://routing-service:8001
      # The public API routes only the metros listed here; the seeded Omaha metro is listed by default.
      ROUTING_METRO_URLS: ${ROUTING_METRO_URLS:-metro-omaha=http://routing-service:8001}
      ROUTING_AUTH_TOKEN: ${ROUTING_AUTH_TOKEN:-local-compose-routing-token-not-for-production}
      SCHEDULER_CALCULATION_MODE: ${SCHEDULER_CALCULATION_MODE:-EMBEDDED}
      SCHEDULER_CALCULATION_URL: ${SCHEDULER_CALCULATION_URL:-http://solver-service:8002}
      SCHEDULER_CALCULATION_AUTH_TOKEN: ${SOLVER_AUTH_TOKEN:-}
      SCHEDULER_SEARCH_CAPACITY: ${SCHEDULER_SEARCH_CAPACITY:-0}
      # Public API locations sent with an address only: COORDINATES_REQUIRED never locates them; NOMINATIM looks
      # them up in the scheduler's own Nominatim and accepts only an exact house.
      GEOCODING_MODE: ${GEOCODING_MODE:-COORDINATES_REQUIRED}
      NOMINATIM_URL: http://nominatim:8080
    depends_on:
      db: { condition: service_healthy }
      schema-migrate: { condition: service_completed_successfully }
    # 8000 is the API; 9000 serves /actuator/health and /actuator/prometheus and stays on a private interface.
    ports: ["127.0.0.1:8000:8000", "127.0.0.1:9000:9000"]
    # Readiness: 503 until the database, each metro's routing and any remote solver or address lookup answer.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /health HTTP/1.0\r\n\r\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
  nominatim:
    image: mediagis/nominatim:5.3
    environment:
      PBF_PATH: /maps/omaha.osm.pbf
      # A file path, never "true": the image would then download TIGER data from a third-party server. The image
      # rereads this on every start and only searches TIGER ranges while the file exists.
      IMPORT_TIGER_ADDRESSES: /maps/tiger-nominatim-preprocessed.csv.tar.gz
      IMPORT_STYLE: address
      IMPORT_WIKIPEDIA: "false"
      UPDATE_MODE: none
      THREADS: "4"
      # The image starts gunicorn as the nominatim user with HOME=/root, where it cannot create its control socket.
      GUNICORN_CMD_ARGS: "--no-control-socket"
    shm_size: 1g
    volumes:
      - map-data:/maps:ro
      - nominatim-db:/var/lib/postgresql/16/main
    ports: ["127.0.0.1:8082:8080"]
  tiles:
    image: protomaps/go-pmtiles:v1.22.1
    command: ["serve", "/maps", "--public-url=http://localhost:8083", "--cors=http://localhost:3001"]
    volumes: ["map-data:/maps:ro"]
    ports: ["127.0.0.1:8083:8080"]
  web:
    image: waterflex-scheduler-web:local
    pull_policy: build
    build: ./web
    environment:
      DATABASE_URL: postgresql://waterflex:waterflex@db:5432/waterflex
      ENGINE_URL: http://scheduler-service:8000
      NOMINATIM_URL: http://nominatim:8080
      LOCAL_BOOKING_TESTS: ${LOCAL_BOOKING_TESTS:-true}
      # The portal schedules only through the public scheduling API. Each client's token is
      # SCHEDULER_API_TOKEN_<CLIENT ID> in portal-api-tokens.env (ignored by git) or, when that is unset, the file
      # token-bootstrap wrote for the client in SCHEDULER_API_TOKEN_DIR; never in the database.
      SCHEDULER_API_URL: http://scheduler-service:8000
      SCHEDULER_API_TOKEN_DIR: /run/portal-api-tokens
    env_file:
      - path: portal-api-tokens.env
        required: false
    volumes: ["portal-api-tokens:/run/portal-api-tokens:ro"]
    depends_on:
      db: { condition: service_healthy }
      schema-migrate: { condition: service_completed_successfully }
      token-bootstrap: { condition: service_completed_successfully }
    ports: ["127.0.0.1:3001:3000"]
  # Each client's overnight optimization through the public scheduling API, at the client's run times and on "Run
  # now": docker compose --profile overnight up. Proposals wait for a dispatcher.
  overnight-worker:
    profiles: ["overnight"]
    image: waterflex-scheduler-web:local
    pull_policy: build
    build: ./web
    command: ["npm", "run", "overnight:worker"]
    environment:
      DATABASE_URL: postgresql://waterflex:waterflex@db:5432/waterflex
      SCHEDULER_API_URL: http://scheduler-service:8000
      SCHEDULER_API_TOKEN_DIR: /run/portal-api-tokens
    env_file:
      - path: portal-api-tokens.env
        required: false
    volumes: ["portal-api-tokens:/run/portal-api-tokens:ro"]
    depends_on:
      db: { condition: service_healthy }
      schema-migrate: { condition: service_completed_successfully }
      token-bootstrap: { condition: service_completed_successfully }
    restart: unless-stopped
  # Local Compose only: issues a public API token for each existing client without one and writes it to the
  # portal-api-tokens volume (the plaintext never reaches the database). Existing files are never rotated. For a client
  # created later: docker compose run --rm token-bootstrap. Production never sets LOCAL_TOKEN_BOOTSTRAP.
  token-bootstrap:
    image: waterflex-scheduler-web:local
    pull_policy: build
    build: ./web
    command: ["npx", "tsx", "scripts/bootstrap-local-tokens.ts"]
    environment:
      DATABASE_URL: postgresql://waterflex:waterflex@db:5432/waterflex
      LOCAL_TOKEN_BOOTSTRAP: ${LOCAL_TOKEN_BOOTSTRAP:-true}
      SCHEDULER_API_TOKEN_DIR: /run/portal-api-tokens
    volumes: ["portal-api-tokens:/run/portal-api-tokens"]
    depends_on:
      db: { condition: service_healthy }
      schema-migrate: { condition: service_completed_successfully }
    restart: "no"
  schema-migrate:
    image: waterflex-scheduler-schema-migrate:local
    pull_policy: build
    build: ./web
    # Migrates, then creates or updates the scheduler's least-privilege login (scripts/scheduler-db-login.ts).
    command: ["sh", "-c", "npx prisma migrate deploy && npx tsx scripts/scheduler-db-login.ts"]
    environment:
      DATABASE_URL: postgresql://waterflex:waterflex@db:5432/waterflex
      SCHEDULER_DB_LOGIN: scheduler
      SCHEDULER_DB_PASSWORD: ${SCHEDULER_DB_PASSWORD:-local-compose-scheduler-db-password-not-for-production}
    depends_on:
      db: { condition: service_healthy }
    restart: "no"
  map-import:
    profiles: ["map-import"]
    image: waterflex-scheduler-map-import:local
    pull_policy: build
    build: ./infra/map-import
    volumes: ["map-data:/maps"]
  tile-import:
    profiles: ["map-import"]
    image: ghcr.io/onthegomap/planetiler:0.9.0
    volumes: ["map-data:/maps"]
volumes:
  app-db:
  portal-api-tokens:
  map-data:
  nominatim-db:
