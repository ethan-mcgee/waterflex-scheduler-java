services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: waterflex
      POSTGRES_PASSWORD: waterflex
      POSTGRES_DB: waterflex
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["app-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waterflex"]
      interval: 5s
      retries: 10
  routing-service:
    image: waterflex-scheduler-routing:local
    pull_policy: build
    build:
      context: .
      dockerfile: routing-service/Dockerfile
    environment:
      ROUTING_OSM_FILE: /maps/omaha.osm.pbf
      ROUTING_GRAPH_DIR: /maps/graph
      ROUTING_CH_ENABLED: ${ROUTING_CH_ENABLED:-false}
      # Local-only default; production VMs must set their own secret.
      ROUTING_AUTH_TOKEN: ${ROUTING_AUTH_TOKEN:-local-compose-routing-token-not-for-production}
    volumes: ["map-data:/maps"]
    ports: ["127.0.0.1:8001:8001"]
  solver-service:
    profiles: ["remote-solver"]
    image: waterflex-calculation-solver:local
    pull_policy: build
    build:
      context: .
      dockerfile: solver-service/Dockerfile
    environment:
      SOLVER_BIND_ADDRESS: 0.0.0.0
      SOLVER_AUTH_TOKEN: ${SOLVER_AUTH_TOKEN:-}
      SOLVER_CAPACITY: ${SOLVER_CAPACITY:-2}
      SOLVER_QUEUE_LIMIT: ${SOLVER_QUEUE_LIMIT:-16}
    # Internal Compose connectivity only. No published solver port or database/routing credentials.
    expose: ["8002"]
  scheduler-service:
    image: waterflex-scheduler-engine:local
    pull_policy: build
    build:
      context: .
      dockerfile: scheduler-service/Dockerfile
    environment:
      JDBC_DATABASE_URL: jdbc:postgresql://db:5432/waterflex
      DATABASE_USER: waterflex
      DATABASE_PASSWORD: waterflex
      ROUTING_URL: http://routing-service:8001
      # Public API routing per WaterFlex metro ID, for example omaha=http://routing-service:8001
      ROUTING_METRO_URLS: ${ROUTING_METRO_URLS:-}
      ROUTING_AUTH_TOKEN: ${ROUTING_AUTH_TOKEN:-local-compose-routing-token-not-for-production}
      SCHEDULER_CALCULATION_MODE: ${SCHEDULER_CALCULATION_MODE:-EMBEDDED}
      SCHEDULER_CALCULATION_URL: ${SCHEDULER_CALCULATION_URL:-http://solver-service:8002}
      SCHEDULER_CALCULATION_AUTH_TOKEN: ${SOLVER_AUTH_TOKEN:-}
      BOOKING_RESERVATIONS_ENABLED: ${BOOKING_RESERVATIONS_ENABLED:-false}
      BOOKING_OFFER_LIMIT: "${BOOKING_OFFER_LIMIT-4}"
      BOOKING_SEARCH_BOUNDED: ${BOOKING_SEARCH_BOUNDED:-false}
      SCHEDULER_SEARCH_CAPACITY: ${SCHEDULER_SEARCH_CAPACITY:-0}
      ROUTING_PREWARM_ENABLED: ${ROUTING_PREWARM_ENABLED:-false}
    depends_on:
      db: { condition: service_healthy }
      schema-migrate: { condition: service_completed_successfully }
    ports: ["127.0.0.1:8000:8000"]
  nominatim:
    image: mediagis/nominatim:5.3
    environment:
      PBF_PATH: /maps/omaha.osm.pbf
      IMPORT_STYLE: address
      IMPORT_WIKIPEDIA: "false"
      UPDATE_MODE: none
      THREADS: "4"
    shm_size: 1g
    volumes:
      - map-data:/maps:ro
      - nominatim-db:/var/lib/postgresql/16/main
    ports: ["127.0.0.1:8082:8080"]
  tiles:
    image: protomaps/go-pmtiles:v1.22.1
    command: ["serve", "/maps", "--public-url=http://localhost:8083", "--cors=http://localhost:3001"]
    volumes: ["map-data:/maps:ro"]
    ports: ["127.0.0.1:8083:8080"]
  web:
    image: waterflex-scheduler-web:local
    pull_policy: build
    build: ./web
    environment:
      DATABASE_URL: postgresql://waterflex:waterflex@db:5432/waterflex
      ENGINE_URL: http://scheduler-service:8000
      NOMINATIM_URL: http://nominatim:8080
      LOCAL_BOOKING_TESTS: ${LOCAL_BOOKING_TESTS:-true}
    depends_on:
      db: { condition: service_healthy }
      schema-migrate: { condition: service_completed_successfully }
    ports: ["127.0.0.1:3001:3000"]
  schema-migrate:
    image: waterflex-scheduler-schema-migrate:local
    pull_policy: build
    build: ./web
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://waterflex:waterflex@db:5432/waterflex
    depends_on:
      db: { condition: service_healthy }
    restart: "no"
  map-import:
    profiles: ["map-import"]
    image: waterflex-scheduler-map-import:local
    pull_policy: build
    build: ./infra/map-import
    volumes: ["map-data:/maps"]
  tile-import:
    profiles: ["map-import"]
    image: ghcr.io/onthegomap/planetiler:0.9.0
    volumes: ["map-data:/maps"]
volumes:
  app-db:
  map-data:
  nominatim-db:
