# The scheduler VM's load balancer (scheduler-proxy in docker-compose.yml): one address for WaterFlex Software, two
# pools behind it. Every replica answers every route, so a call sent to the other pool still gets the right answer;
# the split keeps 20 second daily solves off the booking replicas.
worker_processes 1;
events { worker_connections 1024; }

http {
    access_log off;
    # Docker's resolver: each pool name resolves to all its replicas. Names in variables are looked up again when the
    # answer is older than 10 s, so replicas added or removed are found without a restart.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;

    # A day's snapshot with many technicians is the largest body; the scheduler validates every field itself.
    client_max_body_size 16m;
    # A synchronous daily proposal routes its day and solves for up to 20 s; a queued one answers at once.
    proxy_read_timeout 300s;
    proxy_send_timeout 60s;
    proxy_connect_timeout 3s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # A call is never resent to another replica: the scheduler is idempotent by requestId, but a resend could start a
    # second calculation while the first still runs.
    proxy_next_upstream off;

    server {
        listen 8000;

        set $booking_pool http://scheduler-booking:8000;
        set $daily_pool http://scheduler-daily:8000;

        location = /proxy/live { access_log off; default_type text/plain; return 200 "ok\n"; }

        # What nginx answers itself is a Problem too (spec 1.11.0), so a host parses every refusal the same way. The
        # scheduler's own answers pass through untouched: proxy_intercept_errors stays off. A body past the proxy's
        # limit gets the scheduler's own 413 wording; no replica answering (refused, down or too slow) is a retryable
        # 503, because resending the same requestId returns the stored answer, or 429 while it still runs.
        error_page 413 /proxy/errors/too-large;
        error_page 502 503 504 =503 /proxy/errors/unavailable;
        location = /proxy/errors/too-large {
            internal;
            default_type application/json;
            return 413 '{"error":"INVALID_REQUEST","message":"The request body exceeds 8388608 bytes","retryable":false}';
        }
        location = /proxy/errors/unavailable {
            internal;
            default_type application/json;
            add_header Retry-After 1 always;
            return 503 '{"error":"SERVICE_UNAVAILABLE","message":"No scheduler replica answered; send the same call again, with the same requestId, after the Retry-After seconds","retryable":true}';
        }

        # Daily and repair proposals, synchronous or queued, and the status and cancellation of any request.
        location ~ ^/api/v1/(daily|repairs)/proposals$ { proxy_pass $daily_pool; }
        location /api/v1/requests/ { proxy_pass $daily_pool; }

        # Booking searches, holds and confirms, commits, route evaluation and geometry, whoami, and /health.
        location / { proxy_pass $booking_pool; }
    }
}
