# The scheduler VM's load balancer (scheduler-proxy in docker-compose.yml): one address for WaterFlex Software, two
# pools behind it. Every replica answers every route, so a call sent to the other pool still gets the right answer;
# the split keeps 20 second daily solves off the booking replicas.
#
# Two listeners. The public one (8443, published on SCHEDULER_API_BIND) terminates TLS and serves only the API and
# /health/live. The private one (8000, published on SCHEDULER_MANAGEMENT_BIND, loopback by default) is plain HTTP for
# operators and studies on the VM: the same API plus /health, which names components and the replica's role, and
# /health/daily, the daily pool's readiness.
worker_processes 1;
events { worker_connections 1024; }

http {
    access_log off;
    # Docker's resolver: each pool name resolves to all its replicas. Names in variables are looked up again when the
    # answer is older than 10 s, so replicas added or removed are found without a restart.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;

    # A day's snapshot with many technicians is the largest body; the scheduler validates every field itself.
    client_max_body_size 16m;
    # A synchronous daily proposal routes its day and solves for up to 20 s; a queued one answers at once.
    proxy_read_timeout 300s;
    proxy_send_timeout 60s;
    proxy_connect_timeout 3s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # A call is never resent to another replica: the scheduler is idempotent by requestId, but a resend could start a
    # second calculation while the first still runs.
    proxy_next_upstream off;

    # The pools as upstream groups that follow Docker's DNS (resolve), so nginx keeps a failure count per replica. A
    # replica that fails a call (refused, reset, or no answer within the location's read timeout) is left out for 30 s
    # while the others answer. Docker's own health checks never reach nginx: its DNS lists an unhealthy replica until it
    # stops, so without this a hung replica kept receiving its share of calls, each held for the full read timeout.
    # With one replica in a pool nginx never leaves it out, since nothing else could answer.
    upstream booking_pool {
        zone booking_pool 64k;
        server scheduler-booking:8000 resolve max_fails=1 fail_timeout=30s;
    }
    upstream daily_pool {
        zone daily_pool 64k;
        server scheduler-daily:8000 resolve max_fails=1 fail_timeout=30s;
    }

    # The public listener: what WaterFlex Software calls. The certificate and key come from SCHEDULER_TLS_DIR; replace
    # them and run `nginx -s reload` in this container to rotate (deploy/vm/README.md). TLS 1.2 and 1.3 with the Mozilla
    # "intermediate" ciphers.
    server {
        listen 8443 ssl;
        http2 on;
        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        include /etc/nginx/scheduler-api.conf;

        # Plain HTTP sent to this port is refused as a Problem too, not with nginx's HTML page.
        error_page 497 =400 /proxy/errors/plain-http;
        location = /proxy/errors/plain-http {
            internal;
            default_type application/json;
            return 400 '{"error":"INVALID_REQUEST","message":"This port takes HTTPS only","retryable":false}';
        }

        # Liveness only: a booking replica answers. It reads nothing, so it reveals nothing.
        set $booking_live http://scheduler-booking:8000/health/live;
        location = /health/live { proxy_pass $booking_live; }

        location / {
            default_type application/json;
            return 404 '{"error":"NOT_FOUND","message":"No such path; the API is under /api/v1","retryable":false}';
        }
    }

    # The private listener, for operators and studies on the VM.
    server {
        listen 8000;

        include /etc/nginx/scheduler-api.conf;

        location = /proxy/live { access_log off; default_type text/plain; return 200 "ok\n"; }

        # Each pool's readiness: /health reaches a booking replica, /health/daily a daily one.
        set $daily_health http://scheduler-daily:8000/health;
        location = /health/daily { proxy_pass $daily_health; }
        location / { proxy_pass $booking_pool; }
    }
}
