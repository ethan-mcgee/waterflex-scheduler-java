# The scheduler VM: what runs on the machine WaterFlex Software calls at https://<scheduler-vm>/api/v1, and nothing
# else. No portal, no tiles, no portal database. Every secret is required (no defaults); copy .env.example to .env and
# put the TLS certificate in deploy/vm/tls (or SCHEDULER_TLS_DIR).
# See deploy/vm/README.md for installation, and docs/operations-runbook.md for running it.
#
#   docker compose -f deploy/vm/docker-compose.yml --env-file deploy/vm/.env up -d
#
# Compute is partitioned with deploy.resources limits, so this machine's share is explicit. To serve another metro, add
# a routing service like routing-omaha with that metro's map and list it in ROUTING_METRO_URLS.
#
# The scheduler runs as two pools of the same image behind scheduler-proxy, the one address WaterFlex Software calls:
# booking replicas (SCHEDULER_ROLE=booking) answer booking searches, confirms and route calls, and daily replicas
# (SCHEDULER_ROLE=daily) answer daily and repair proposals and run the queued ones. Scale a pool by its replica count
# and its per-replica CPU and memory; each limit applies to every replica of the pool.
name: scheduler-vm

# No Linux capabilities and no way to gain privileges: the services built here (uid 10001, their Dockerfiles) and
# Prometheus (nobody). Postgres and Nominatim keep their images' defaults: their entrypoints switch users as root.
x-hardened: &hardened
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

# A study pins a tag built from one commit with SCHEDULER_IMAGE and SCHEDULER_PULL_POLICY=never, so compose runs that
# image rather than rebuilding the working tree (infra/run-stack-verification.ps1). Normal use leaves both unset.
x-scheduler-image: &scheduler-image
  <<: *hardened
  image: ${SCHEDULER_IMAGE:-waterflex-scheduler-engine:vm}
  pull_policy: ${SCHEDULER_PULL_POLICY:-build}
  build:
    context: ../..
    dockerfile: scheduler-service/Dockerfile

# What every scheduler replica runs with; each pool adds its role, admission and compute.
x-scheduler-runtime: &scheduler-runtime
  JDBC_DATABASE_URL: jdbc:postgresql://scheduler-db:5432/scheduler
  DATABASE_USER: scheduler
  DATABASE_PASSWORD: ${SCHEDULER_DB_PASSWORD:?Set SCHEDULER_DB_PASSWORD}
  SCHEDULER_RETENTION_DAYS: ${SCHEDULER_RETENTION_DAYS:?Set SCHEDULER_RETENTION_DAYS}
  ROUTING_METRO_URLS: ${ROUTING_METRO_URLS:?Set ROUTING_METRO_URLS}
  ROUTING_AUTH_TOKEN: ${ROUTING_AUTH_TOKEN:?Set ROUTING_AUTH_TOKEN}
  GEOCODING_MODE: ${GEOCODING_MODE:-COORDINATES_REQUIRED}
  NOMINATIM_URL: http://nominatim:8080
  SCHEDULER_CALCULATION_MODE: ${SCHEDULER_CALCULATION_MODE:-EMBEDDED}
  SCHEDULER_CALCULATION_URL: ${SCHEDULER_CALCULATION_URL:-}
  SCHEDULER_CALCULATION_AUTH_TOKEN: ${SOLVER_AUTH_TOKEN:-}
  LOGGING_STRUCTURED_FORMAT_CONSOLE: ${LOGGING_STRUCTURED_FORMAT_CONSOLE:-ecs}
  TIMEFOLD_LOG_LEVEL: ${TIMEFOLD_LOG_LEVEL:-WARN}

# A replica is ready when its /health answers 200 (database, schema and every metro's routing up). Its ports are not
# published: the API is reached through scheduler-proxy, metrics through Prometheus on this network.
x-scheduler-replica: &scheduler-replica
  <<: *scheduler-image
  expose: ["8000", "9000"]
  # Drain the web server and the daily queue (each up to 30 s) before Docker's SIGKILL.
  stop_grace_period: 75s
  healthcheck:
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 60s
  depends_on:
    scheduler-db: { condition: service_healthy }
    scheduler-admin: { condition: service_completed_successfully }
  restart: unless-stopped

x-owner-connection: &owner-connection
  JDBC_DATABASE_URL: jdbc:postgresql://scheduler-db:5432/scheduler
  DATABASE_USER: scheduler_owner
  DATABASE_PASSWORD: ${SCHEDULER_DB_OWNER_PASSWORD:?Set SCHEDULER_DB_OWNER_PASSWORD}

services:
  # The scheduler's own database: tenants and token digests, the thin store, the route cache.
  scheduler-db:
    image: postgres:16-alpine@sha256:f377d590e5474681d4d7838635031a2b50647923b7abfa803ce9b5ff35d5c663
    environment:
      POSTGRES_USER: scheduler_owner
      POSTGRES_PASSWORD: ${SCHEDULER_DB_OWNER_PASSWORD:?Set SCHEDULER_DB_OWNER_PASSWORD}
      POSTGRES_DB: scheduler
    volumes: ["scheduler-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler_owner -d scheduler"]
      interval: 5s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "${SCHEDULER_DB_CPUS:-1}", memory: "${SCHEDULER_DB_MEMORY:-1g}" }
    restart: unless-stopped

  # Runs once per start as the database owner: applies migrations and creates or updates the serving login. Operators
  # also run tenant commands through it, for example:
  #   docker compose -f deploy/vm/docker-compose.yml --env-file deploy/vm/.env run --rm scheduler-admin --command=issue-token acme "Acme Water" primary
  scheduler-admin:
    <<: *scheduler-image
    command: ["--command=migrate"]
    environment:
      <<: *owner-connection
      SCHEDULER_DB_LOGIN: scheduler
      SCHEDULER_DB_PASSWORD: ${SCHEDULER_DB_PASSWORD:?Set SCHEDULER_DB_PASSWORD}
    depends_on:
      scheduler-db: { condition: service_healthy }
    restart: "no"

  # Booking pool: latency first. It takes no queued daily work, so a queued day never takes a slot a booking needs.
  # Admission capacity matches each replica's cores.
  scheduler-booking:
    <<: *scheduler-replica
    environment:
      <<: *scheduler-runtime
      SCHEDULER_ROLE: booking
      SCHEDULER_SEARCH_CAPACITY: ${SCHEDULER_BOOKING_SEARCH_CAPACITY:-2}
      # Connections per replica: more than the capacity and confirm slots together, with headroom (the replica checks).
      SCHEDULER_DB_POOL_SIZE: ${SCHEDULER_BOOKING_DB_POOL_SIZE:-10}
      # The part of a client's bookingDeadlineMs kept back to validate and publish the offers (800 to 1000).
      SCHEDULER_BOOKING_PUBLISH_RESERVE_MS: ${SCHEDULER_BOOKING_PUBLISH_RESERVE_MS:-1000}
      # The cap on an optional booking refinement when a client sets no bookingRefinementMs (0 to 3000).
      SCHEDULER_BOOKING_REFINEMENT_MS: ${SCHEDULER_BOOKING_REFINEMENT_MS:-2000}
      # JVM flags of this pool (measured in research/api-load.md, "Confirm priority and JVM settings"); the heap is three
      # quarters of the container's memory limit.
      JAVA_TOOL_OPTIONS: ${SCHEDULER_BOOKING_JAVA_OPTIONS:--XX:MaxRAMPercentage=75}
    deploy:
      replicas: ${SCHEDULER_BOOKING_REPLICAS:-1}
      resources:
        limits: { cpus: "${SCHEDULER_BOOKING_CPUS:-2}", memory: "${SCHEDULER_BOOKING_MEMORY:-2g}" }

  # Daily pool: throughput. Each replica runs up to SCHEDULER_DAILY_BACKGROUND_LIMIT daily calculations at once (at
  # most its search capacity), with as many queue workers.
  scheduler-daily:
    <<: *scheduler-replica
    environment:
      <<: *scheduler-runtime
      SCHEDULER_ROLE: daily
      SCHEDULER_SEARCH_CAPACITY: ${SCHEDULER_DAILY_SEARCH_CAPACITY:-2}
      SCHEDULER_DB_POOL_SIZE: ${SCHEDULER_DAILY_DB_POOL_SIZE:-10}
      SCHEDULER_SEARCH_BACKGROUND_LIMIT: ${SCHEDULER_DAILY_BACKGROUND_LIMIT:-2}
      SCHEDULER_DAILY_QUEUE_WORKERS: ${SCHEDULER_DAILY_BACKGROUND_LIMIT:-2}
      SCHEDULER_STUDY_RECEIPTS: ${SCHEDULER_STUDY_RECEIPTS:-false}
      SCHEDULER_STUDY_PROFILES: ${SCHEDULER_STUDY_PROFILES:-}
      JAVA_TOOL_OPTIONS: ${SCHEDULER_DAILY_JAVA_OPTIONS:--XX:MaxRAMPercentage=75}
    deploy:
      replicas: ${SCHEDULER_DAILY_REPLICAS:-1}
      resources:
        limits: { cpus: "${SCHEDULER_DAILY_CPUS:-2}", memory: "${SCHEDULER_DAILY_MEMORY:-2g}" }

  # The one address WaterFlex Software calls. nginx sends daily and repair proposals and request status and
  # cancellation to the daily pool and everything else to the booking pool, spreading each over its replicas; it
  # looks the replicas up again every 10 s, so scaling a pool needs no restart here (deploy/vm/nginx.conf). It
  # terminates TLS on SCHEDULER_API_BIND (the API and /health/live only) and serves plain HTTP, with the detailed
  # /health, on SCHEDULER_MANAGEMENT_BIND, which stays on loopback unless an internal monitor needs it.
  scheduler-proxy:
    # nginx's master starts as root and runs its workers as nginx; it keeps only the capabilities that needs: setting
    # the workers' user and group, owning its cache folders, and reading a key file the operator owns.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    image: nginx:1.27.5-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    volumes:
      - "./nginx.conf:/etc/nginx/nginx.conf:ro"
      - "./scheduler-api.conf:/etc/nginx/scheduler-api.conf:ro"
      # fullchain.pem and privkey.pem for the name WaterFlex Software calls (deploy/vm/README.md, "TLS certificate").
      - "${SCHEDULER_TLS_DIR:-./tls}:/etc/nginx/tls:ro"
    ports:
      - "${SCHEDULER_API_BIND:?Set SCHEDULER_API_BIND to the interface WaterFlex Software reaches}:${SCHEDULER_API_PORT:-443}:8443"
      - "${SCHEDULER_MANAGEMENT_BIND:-127.0.0.1}:${SCHEDULER_PRIVATE_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/proxy/live"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      scheduler-booking: { condition: service_started }
      scheduler-daily: { condition: service_started }
    deploy:
      resources:
        limits: { cpus: "${SCHEDULER_PROXY_CPUS:-0.5}", memory: "${SCHEDULER_PROXY_MEMORY:-128m}" }
    restart: unless-stopped

  # Omaha's routing service. The map volume holds the prepared versions (infra/prepare-map.ps1 on a build machine,
  # then copied here); ACTIVE_MAP_VERSION picks one. It only reads them: the volume is mounted read-only and a version
  # with no prepared graph stops the start instead of being imported here.
  routing-omaha:
    <<: *hardened
    image: waterflex-scheduler-routing:vm
    stop_grace_period: 20s
    pull_policy: build
    build:
      context: ../..
      dockerfile: routing-service/Dockerfile
    environment:
      ROUTING_OSM_FILE: /maps/versions/${ACTIVE_MAP_VERSION:?Set ACTIVE_MAP_VERSION}/omaha.osm.pbf
      ROUTING_GRAPH_DIR: /maps/versions/${ACTIVE_MAP_VERSION:?Set ACTIVE_MAP_VERSION}/graph
      ROUTING_MAP_VERSION: ${ACTIVE_MAP_VERSION:?Set ACTIVE_MAP_VERSION}
      ROUTING_AUTH_TOKEN: ${ROUTING_AUTH_TOKEN:?Set ROUTING_AUTH_TOKEN}
      # The version's contraction hierarchy graph (graph-ch-car-v1, prepared with the map); false serves the flexible
      # graph under another routing identity. A request's pairs are routed on ROUTING_PARALLELISM threads at once.
      ROUTING_CH_ENABLED: ${ROUTING_CH_ENABLED:-true}
      ROUTING_PARALLELISM: ${ROUTING_PARALLELISM:-0}
      ROUTING_GRAPH_READ_ONLY: "true"
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    volumes: ["maps:/maps:ro"]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8001 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 300s
    deploy:
      resources:
        limits: { cpus: "${ROUTING_CPUS:-2}", memory: "${ROUTING_MEMORY:-6g}" }
    restart: unless-stopped

  # Address lookup for locations sent without coordinates (GEOCODING_MODE=NOMINATIM). Its database is imported once
  # per map version, as on the development machine (README map steps).
  nominatim:
    profiles: ["nominatim"]
    image: mediagis/nominatim:5.3@sha256:168c30e20fbba0c2e8199fca7a8aa2640e8cc1a62f8b05b1958897796fdb38f1
    environment:
      PBF_PATH: /maps/versions/${ACTIVE_MAP_VERSION:?Set ACTIVE_MAP_VERSION}/omaha.osm.pbf
      IMPORT_TIGER_ADDRESSES: /maps/versions/${ACTIVE_MAP_VERSION:?Set ACTIVE_MAP_VERSION}/tiger-nominatim-preprocessed.csv.tar.gz
      IMPORT_STYLE: address
      IMPORT_WIKIPEDIA: "false"
      UPDATE_MODE: none
      THREADS: "4"
      GUNICORN_CMD_ARGS: "--no-control-socket"
    shm_size: 1g
    volumes: ["maps:/maps:ro", "nominatim-db:/var/lib/postgresql/16/main"]
    deploy:
      resources:
        limits: { cpus: "${NOMINATIM_CPUS:-2}", memory: "${NOMINATIM_MEMORY:-4g}" }
    restart: unless-stopped

  # A remote solver pool (SCHEDULER_CALCULATION_MODE=REMOTE, SCHEDULER_CALCULATION_URL=http://solver-service:8002 on
  # this private network). The embedded solver is the default. Its capacity serves every replica's searches at once
  # (booking capacity plus daily capacity, summed over replicas: 4 for the defaults above) and its background limit
  # is how many daily calculations it runs at once (0: every slot). Measured in research/api-load.md, "Embedded against
  # remote (K)".
  solver-service:
    <<: *hardened
    profiles: ["remote-solver"]
    image: waterflex-calculation-solver:vm
    # The web server drains solves for up to 30 s first.
    stop_grace_period: 45s
    pull_policy: build
    build:
      context: ../..
      dockerfile: solver-service/Dockerfile
    environment:
      SOLVER_BIND_ADDRESS: 0.0.0.0
      SOLVER_AUTH_TOKEN: ${SOLVER_AUTH_TOKEN:-}
      SOLVER_CAPACITY: ${SOLVER_CAPACITY:-4}
      SOLVER_QUEUE_LIMIT: ${SOLVER_QUEUE_LIMIT:-16}
      SOLVER_BACKGROUND_LIMIT: ${SOLVER_BACKGROUND_LIMIT:-0}
      TIMEFOLD_LOG_LEVEL: ${TIMEFOLD_LOG_LEVEL:-WARN}
    expose: ["8002"]
    deploy:
      resources:
        limits: { cpus: "${SOLVER_CPUS:-4}", memory: "${SOLVER_MEMORY:-4g}" }
    restart: unless-stopped

  # Scrapes every scheduler replica's metrics (found by name on this network); its UI answers on the management
  # interface only.
  prometheus:
    <<: *hardened
    profiles: ["monitoring"]
    image: prom/prometheus:v2.53.0@sha256:075b1ba2c4ebb04bc3a6ab86c06ec8d8099f8fda1c96ef6d104d9bb1def1d8bc
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro", "prometheus-data:/prometheus"]
    ports: ["${SCHEDULER_MANAGEMENT_BIND:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"]
    restart: unless-stopped

volumes:
  scheduler-db:
  # On the VM this holds the copied map versions. The local rehearsal points it at the development stack's map volume.
  maps:
    name: ${MAP_VOLUME:-scheduler-vm-maps}
    external: true
  nominatim-db:
  prometheus-data:
