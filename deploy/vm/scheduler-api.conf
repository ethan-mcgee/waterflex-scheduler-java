# The /api/v1 routes, included by both of scheduler-proxy's listeners (nginx.conf), so the public and the private
# address route every call the same way.

set $booking_pool http://scheduler-booking:8000;
set $daily_pool http://scheduler-daily:8000;

# What nginx answers itself is a Problem too (spec 1.11.0), so a host parses every refusal the same way. The scheduler's
# own answers pass through untouched: proxy_intercept_errors stays off. A body past the proxy's limit gets the
# scheduler's own 413 wording; no replica answering (refused, down or too slow) is a retryable 503, because resending
# the same requestId returns the stored answer, or 429 while it still runs.
error_page 413 /proxy/errors/too-large;
error_page 502 503 504 =503 /proxy/errors/unavailable;
location = /proxy/errors/too-large {
    internal;
    # Over HTTP/2 a declared Content-Length past the limit leaves the body undiscarded, so without this the redirect here
    # would meet the same limit again and nginx would answer with its own HTML page (found by infra/check-vm-stack.sh).
    client_max_body_size 0;
    default_type application/json;
    return 413 '{"error":"INVALID_REQUEST","message":"The request body exceeds 8388608 bytes","retryable":false}';
}
location = /proxy/errors/unavailable {
    internal;
    default_type application/json;
    add_header Retry-After 1 always;
    return 503 '{"error":"SERVICE_UNAVAILABLE","message":"No scheduler replica answered; send the same call again, with the same requestId, after the Retry-After seconds","retryable":true}';
}

# Daily and repair proposals, synchronous or queued, and the status and cancellation of any request.
location ~ ^/api/v1/(daily|repairs)/proposals$ { proxy_pass $daily_pool; }
location /api/v1/requests/ { proxy_pass $daily_pool; }

# Booking searches, holds and confirms, commits, route evaluation and geometry, and whoami.
location /api/v1/ { proxy_pass $booking_pool; }
