server.port=8000
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5433/waterflex}
spring.datasource.username=${DATABASE_USER:waterflex}
spring.datasource.password=${DATABASE_PASSWORD:waterflex}
# Connections per replica. Each running search holds one, the refinement's routes and the road workers take more, so it
# must exceed the search capacity with headroom (DatabasePool checks it at startup); 10 fits a capacity of 2.
spring.datasource.hikari.maximum-pool-size=${SCHEDULER_DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=250
spring.datasource.hikari.validation-timeout=250
# Open replacement connections in the pool worker rather than blocking the first search on startup.
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.data-source-properties.connectTimeout=2
routing.url=${ROUTING_URL:http://localhost:8001}
# Shared bearer token for routing-service; required by the real routing service, ignored by fixture routers.
routing.auth-token=${ROUTING_AUTH_TOKEN:}
# Public /api/v1 routing, one service per WaterFlex metro ID: metro=url,metro=url. Unlisted metros have no routing.
routing.metro-urls=${ROUTING_METRO_URLS:}
# Public /api/v1 locations without coordinates. Only COORDINATES_REQUIRED exists: such a technician-day is left unchanged and reported.
geocoding.mode=${GEOCODING_MODE:COORDINATES_REQUIRED}
geocoding.nominatim-url=${NOMINATIM_URL:http://localhost:8082}
# Operations. Metrics and actuator health answer on their own port, never on the API port and never behind the tenant
# filter; publish it only on the VM's private interface.
management.server.port=${MANAGEMENT_PORT:9000}
# Booking search tuning. The publish reserve is the part of a client's bookingDeadlineMs kept back from exploration to
# validate, prepare and publish the offers (800 to 1000 ms); the request log's commitMs says how much of it a search used.
booking.search.publish-reserve-ms=${SCHEDULER_BOOKING_PUBLISH_RESERVE_MS:1000}
booking.search.refinement-ms=${SCHEDULER_BOOKING_REFINEMENT_MS:2000}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
# Plain console lines carry the call's tenant and host request ID; LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs writes JSON instead.
logging.pattern.level=%5p [tenant=%X{tenant:-} request=%X{requestId:-}]
# Required, no default: days the thin store keeps requests, proposals, offers and receipts before the daily purge.
scheduler.retention.days=${SCHEDULER_RETENTION_DAYS:}
# Shutdown. The web server drains calls in progress (Boot's default graceful shutdown); the daily queue worker first
# lets running jobs finish for scheduler.daily.queue.drain-ms, then stops them and queues them again for another
# replica. Each phase may take up to this timeout, so a container's stop grace must exceed twice it.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SCHEDULER_SHUTDOWN_GRACE:30s}
scheduler.daily.queue.drain-ms=${SCHEDULER_DAILY_QUEUE_DRAIN_MS:25000}
# A public API body larger than the 8 MiB calculation ceiling is refused with 413 before it is read; Tomcat drains at
# most this much of a refused upload so the connection can be kept.
server.tomcat.max-swallow-size=8MB
# Timefold's own per-solve INFO lines repeat the daily receipt line; raise to INFO or DEBUG to diagnose a solve.
logging.level.ai.timefold.solver=${TIMEFOLD_LOG_LEVEL:WARN}
# Studies only, off in production: each daily calculation also logs "Study receipt {json}" (StudyReceipts) with the
# phases, the decision and the DECIMAL128 readings of the reference and proposed plans. Pair it with TIMEFOLD_LOG_LEVEL=INFO
# for Timefold's per-phase move evaluation speed.
scheduler.study.receipts=${SCHEDULER_STUDY_RECEIPTS:false}
# FairnessMeasures keeps one study ConstraintProvider subclass (load balance) beside the production provider, and
# Timefold's starter refuses to start when it finds more than one. Nothing injects the starter's beans; SolverEngine
# names its provider class in each solver configuration.
spring.autoconfigure.exclude=ai.timefold.solver.spring.boot.autoconfigure.TimefoldSolverAutoConfiguration
