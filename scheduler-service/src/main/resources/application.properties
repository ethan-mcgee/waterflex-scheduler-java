server.port=8000
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5433/waterflex}
spring.datasource.username=${DATABASE_USER:waterflex}
spring.datasource.password=${DATABASE_PASSWORD:waterflex}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=250
spring.datasource.hikari.validation-timeout=250
# Open replacement connections in the pool worker rather than blocking the first search on startup.
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.data-source-properties.connectTimeout=2
routing.url=${ROUTING_URL:http://localhost:8001}
# Shared bearer token for routing-service; required by the real routing service, ignored by fixture routers.
routing.auth-token=${ROUTING_AUTH_TOKEN:}
# Public /api/v1 routing, one service per WaterFlex metro ID: metro=url,metro=url. Unlisted metros have no routing.
routing.metro-urls=${ROUTING_METRO_URLS:}
# Public /api/v1 locations without coordinates. Only COORDINATES_REQUIRED exists: such a technician-day is left unchanged and reported.
geocoding.mode=${GEOCODING_MODE:COORDINATES_REQUIRED}
geocoding.nominatim-url=${NOMINATIM_URL:http://localhost:8082}
# Operations. Metrics and actuator health answer on their own port, never on the API port and never behind the tenant
# filter; publish it only on the VM's private interface.
management.server.port=${MANAGEMENT_PORT:9000}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
# Plain console lines carry the call's tenant and host request ID; LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs writes JSON instead.
logging.pattern.level=%5p [tenant=%X{tenant:-} request=%X{requestId:-}]
# Required, no default: days the thin store keeps requests, proposals, offers and receipts before the daily purge.
scheduler.retention.days=${SCHEDULER_RETENTION_DAYS:}
